  note: >-
    Antony seized Artavasdes II in 34, "occupied the whole of Armenia" and
    "left his legions in Armenia" (Dio 49.39–40); the crown was promised to
    Alexander Helios at the Donations (49.41.3), on paper. Drawn as a client
    kingdom in Roman hands, with the occupation in its own layer; the
    Armenians proclaimed Artavasdes' son Artaxes king, and he fled to Parthia.

