    kush's. The stele of Octavian's first Egyptian regnal year (29) has Gallus
    march "beyond the Nile Cataract, a region to which neither the Roman people
    nor the kings of Egypt had marched", and set a ruler over the
    Triacontaschoenus "on Aethiopian territory": Kushite ground before him, on
    the stele's word. Eller disagrees: Ptolemy VI had reestablished control "up
    to the Second Cataract", and at the annexation Ptolemaic control "likely
    reached at least beyond Maharraqa", though the first century "remains
