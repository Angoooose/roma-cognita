# Cleopatra's coast, 36–31, and what Octavian gave Herod in 30

- atom: phoenicia
  polity: aegyptus
  relation: client
  from: 36 BCE
  to: 31 BCE
  sources:
    - { source: plutarch, locator: 'Antony 36.2' }
    - { source: josephus-aj, locator: '15.95' }
    - { source: josephus-bj, locator: '1.361' }
    - { source: bingen-2007 }
  confidence: probable
  review: needs-check
  note: >-
    Antony gave Cleopatra "Phoenicia, Coele Syria" (Plut. Antony 36.2), "the
    cities that were within the river Eleutherus, as far as Egypt, excepting
    Tyre and Sidon" (AJ 15.95). She began a second count of her regnal years in
    37/36, "more or less directly connected with … the first territorial
    concessions" (Bingen 2007); Josephus tells the gift with the events of 34.
    Drawn as her holding, not only its revenues: Josephus has Antony take the
    cities from their governors and give them to her.

