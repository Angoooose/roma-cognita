# --- added September 2026: the extension to 133 BCE, Anatolia -----------------
#
# Attalus' bequest and Aristonicus; Greater Phrygia and Lycaonia given to kings
# and taken back; Cibyra's tyranny to Murena; Pontus growing under the two
# Mithridates, its three wars with Rome and Lucullus' conquest; the Bithynian
# kingdom to its bequest; Cappadocia's kings driven out and restored; Cilicia
# as a praetorian province from Antonius' war on the pirates; the Cilician plain
# Seleucid, then Tigranes'. Occupations end the year before the occupier was
# driven out, as above: Mithridates gave up Asia, Bithynia, Paphlagonia and
# Cappadocia at Dardanus in the late summer or autumn of 85, so his rows there
# end with 86.

