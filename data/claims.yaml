# --- the Black Sea -------------------------------------------------------------
# Back to 133 (added for the extension to 133 BCE): the Spartocid kingdom until
# Paerisades V gave it to Mithridates (Strabo 7.4.4), Diophantus' wars for the
# king c. 110–107 (the Diophantus decree, IOSPE I² 352), the revolt of the
# Bosporan peoples in the First Mithridatic War (App. Mithr. 64), and Machares,
# the king's son, set over them c. 80 (Mithr. 67), who made himself a friend of
# Rome in 70 (Mithr. 83). The dates of c. 110–107 are the decree's usual ones;
# the decree itself is dated only by a Chersonesite eponym. The Maeotic shore
# (bosporus-tanais) is left unclaimed under Machares (c. 80–66): no readable
# text gives it to him, the Maeotic princes received Mithridates in 65 as
# rulers of their own (Mithr. 102), and Minns (p. 589) has Pharnaces, after 63,
# the first to push the frontier to the Tanais.

- atom: bosporus
  polity: bosporus
  relation: independent
  from: before 133 BCE
  to: c. 111 BCE
  sources:
    - source: minns-1913
      locator: 'p. 582'
      quote: >-
        Accordingly Paerisades put himself under the protection of Mithridates
        VI Eupator king of Pontus … After defeating Palacus, Diophantus went to
        the Bosporus and there was most successful (presumably in the winter of
        B.C. iio, inscr. 1. 10), apparently relieving Paerisades from his
        enemies, but leaving him the semblance of authority.
      supports: [to]
    - source: strabo
      locator: '7.4.4'
      quote: >-
        For a long time it was ruled as a monarchy by the dynasty of Leuco,
        Satyrus, and Parisades, as were also all the neighboring settlements
        near the south of Lake Maeotis on both sides, until Parisades gave over
        the sovereignty to Mithridates. … The last of these monarchs also bore
        the name Parisades, but he was unable to hold out against the
        barbarians, who kept exacting greater tribute than before, and he
        therefore gave over the sovereignty to Mithridates Eupator.
      supports: [polity, relation, from]
    - source: appian
      locator: 'Mithr. 112'
      quote: >-
        He lived sixty-eight or sixty-nine years, and of these he reigned
        fifty-seven
      supports: [from]
    - source: cassius-dio
      locator: '37.10.4'
      quote: >-
        when Marcus Cicero had become consul with Gaius Antonius, and
        Mithridates no longer caused any injury to the Romans, but had destroyed
        himself
      supports: [from]
    - { source: diophantus-decree }
  confidence: probable
  review: needs-check
  note: >-
    The kingdom of the Spartocids ("the dynasty of Leuco, Satyrus, and
    Parisades", Strabo 7.4.4) until its last king, Paerisades V, "unable to hold
    out against the barbarians, who kept exacting greater tribute than
    before", gave it over to Mithridates Eupator. No tie to Rome is recorded.
    In force in 133: the gift was to Eupator, who died in Cicero's consulship
    (63, Dio 37.10.4) after reigning fifty-seven years (App. Mithr. 112), so
    came to the throne in 120. Ends when Paerisades put himself under the
    king's protection, by the winter of 110 on Minns' reading of the decree
    (see the next row); it ran to c. 109 until October 2026.

