  review: draft
  note: >-
    After Philippi the triumvirs agreed to make Cisalpine Gaul "independent, as
    the elder Caesar had intended" (App. BC 5.3): no longer a province, so no
    governor could keep an army south of the Alps. Dio has it "included by this
    time in the district of Italy" in 41 (48.12.5). In practice Pollio held
    Venetia for Antony into 40 (Vell. 2.76.2), and Broughton still lists
