# Lower Nubia

- atom: triakontaschoinos
  polity: kush
  relation: independent
  from: before 68 BCE
  to: 30 BCE
  sources:
    - { source: torok-1997, locator: 'chs. 4–5' }
    - { source: barrington, locator: 'map 81' }
  confidence: uncertain
  review: needs-check
  note: >-
    Part of the kush atom until it was split out (September 2026); the row is
    kush's. The stele of 29 has Gallus march "beyond the Nile Cataract, a region
    to which neither the Roman people nor the kings of Egypt had marched".
    Whether the Dodecaschoenus next to Philae was Ptolemaic before 30 is argued:
    Burstein (Barrington map 81) puts the Egyptian–Kushite boundary at
    Hierasykaminos for most of the period the map covers.

