# The time series. One row says: this atom was held by this polity, in this
# way, over these years, inclusive at both ends. Geometry is drawn once; all
# that changes over time changes here. An atom with no row covering a year is
# not claimed that year and draws as plain land — the map says nothing rather
# than guess. Rows on one atom may abut but never overlap within a layer
# (holding vs occupation, see packages/schema), and the validator fails if
# they do.
#
# The window is 68–43 BCE, so every `before 68 BCE` / `after 43 BCE` below is
# where that window cuts the row off: in force at that year, extent beyond it
# not stated. Only rows that start or end *inside* the window carry a real
# event date.
#
# The year of a transition belongs to the successor: Numidia is the kingdom's
# to 47 and Africa Nova's from 46.

# --- Italy -------------------------------------------------------------------

- atom: italia
  polity: italia
  relation: citizen-territory
  from: before 68 BCE
  to: after 27 BCE
  sources:
    - { source: appian, locator: 'BC 1.49' }
    - { source: cicero-arch, locator: '7' }
  confidence: certain
  review: draft
  note: Enfranchised after the Social War.

- atom: cisalpina
  polity: gallia-cisalpina
  relation: province
  from: before 68 BCE
  to: 43 BCE
  sources:
    - { source: cah-ix }
    - { source: broughton-mrr, locator: 'vol. II, 44–43 BCE (D. Brutus in Cisalpina)' }
    - { source: cassius-dio, locator: '48.12.5' }
  confidence: probable
  review: draft
  note: >-
    Provincial from c. 81. The lex Roscia of 49 gave the Transpadanes
    citizenship, but the province went on: D. Brutus governed it in 44–43 and
    Antony fought him for it. It was merged into Italy only in 42 (App. BC 5.3;
    Dio 48.12.5); the row ran to "after 43" until September 2026, against its
    own polity's end.

