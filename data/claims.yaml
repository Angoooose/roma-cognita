  confidence: uncertain
  review: needs-check
  note: >-
    Antony had Iamblichus killed before Actium (Dio 50.13.7); his brother
    Alexander, who got the kingdom, was still a suppliant with Octavian in 30
    (BJ 1.393) and was then deposed and led in the triumph (Dio 51.2.2). In 20
    Augustus gave Iamblichus II "his ancestral dominion" (54.9.2). No source
    says who governed Emesa in between; the governor of Syria is the natural
    inference. Leaving it unclaimed would be the stricter choice.

# Armenia and Media

