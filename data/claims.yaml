  confidence: probable
  review: needs-check
  note: >-
    The kingdom of the Spartocids ("the dynasty of Leuco, Satyrus, and
    Parisades", Strabo 7.4.4) until its last king, Paerisades V, "unable to hold
    out against the barbarians, who kept exacting greater tribute than
    before", gave it over to Mithridates Eupator. No tie to Rome is recorded.

