  note: >-
    Attalus III left his kingdom to the Roman people in 133, and "the Romans
    proclaimed the country a province, calling it Asia" (Strabo 13.4.2);
    Aquillius organised it with ten commissioners after the war with
    Aristonicus (14.1.38). The atom is the province of Cicero's day. At first
    the ground subject to tribute was "a patchwork of communities and regions
    concentrated chiefly in Mysia and Lydia … interspersed with the autonomous
    Greek cities of the coast", and neither Caria nor Lycia had been Attalid
    (Kallet-Marx 112–115); when Caria came under the governor is not recorded,
    so the whole atom is drawn from the bequest, as with the free cities
    elsewhere (README decision 2). Aristonicus is drawn as a seat, 133–130.

