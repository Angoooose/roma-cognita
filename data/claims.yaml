# Sertorius, 80–72: a Roman commander holding Spain against Sulla's government
# (README decision 18), so occupation over the standing provinces. Like every
# occupation row, his end the year before the government recovered the ground:
# Pompey "recovered the Spanish provinces" in 72 (Livy Per. 96).

