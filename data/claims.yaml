    and Orchomenus in 86, but Archelaus kept Chalcis and the sea (App. Mithr.
    45), and the king's garrisons left Greece only under the terms he and Sulla
    agreed near Delium in the winter of 86/85 (Mithr. 55; Plut. Sulla 22.3). So
    the row ends in 86. The free cities that held out (Thespiae; Demetrias and
    Magnesia in Thessaly, Mithr. 29) lie inside, as do Athens and Sparta, which
    joined him. The years: Mithridates already held Achaia when Sulla, as
    consul (88), was sent against him (Eutrop. 5.4), and Sulla was fighting
    his generals in Greece in the year Cinna and Marius were consuls, 86
    (Vell. 2.23.1–3).

