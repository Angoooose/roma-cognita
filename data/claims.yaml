  confidence: probable
  review: draft
  note: >-
    The Roman citizen land before the Social War, with the Latin colonies and
    the allied enclaves inside it (Tibur, Praeneste, Neapolis, Ancona, Teanum
    Sidicinum, Camerinum), which are places, not ground. Probable, not certain,
    because Beloch reconstructs its edges from colonies, prefectures and voting
    tribes, not from a source that draws them (p. 54 is the Sabine and
    Praetuttian land, p. 56 the ager Gallicus). Ends with 91 because the lex
    Iulia of the consul L. Caesar (90) made its Latin colonies and loyal allies
    citizens, and the ground passes to italia.

