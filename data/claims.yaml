  review: draft
  note: >-
    Menodorus (Dio's Menas) took Sardinia and its two legions for Sextus while
    Antony besieged Brundisium in autumn 40 (App. BC 5.56; Dio 48.30.7–8), and
    handed it to Octavian in 38 (Dio 48.45.5–6; App. BC 5.78, 5.80). Dio 48.2.1
    has Sextus "still occupying Sardinia and Sicily" already in 42; Appian
    (5.56) calls Sardinia Octavian's before 40 and Dio's own narrative has the
    seizure in 40, so 48.2.1 is read as an anticipation.

