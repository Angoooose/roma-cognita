        together.
      supports: [polity]
  confidence: probable
  review: draft
  note: >-
    One province with the old Africa by 27 at the latest, and perhaps from 36/35
    (see africa-nova): the merger was put in 27 until Fishwick and Shaw argued
    for 35 (Fishwick 1993, 53). Dio's list of the settlement in Augustus'
    seventh consulship, 27, names Africa and Numidia apart, but he says he uses
    the names of his own day for provinces then "administered two and three
    together" (53.12.8). The ground was Rome's either way, which is why the row
    is probable despite the dispute over its polity.

