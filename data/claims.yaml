  confidence: probable
  review: needs-check
  note: >-
    Mithridates' by Paerisades' gift (Strabo 7.4.3–4). The Scythians under
    Saumacus rose and killed Paerisades, and Diophantus took Theodosia and
    Panticapaeum back for the king (the decree); the revolt is not drawn. In
    88–87 a son of Mithridates held "Pontus and Bosporus … as far as the
    deserts beyond Lake Maeotis" (Plut. Sulla 11.2). The Bosporan peoples had
    revolted by the time the king came home in 85 (App. Mithr. 64); when is not
    recorded, and the row ends in 86.

