    - { source: cassius-dio, locator: '51.21.5' }
    - { source: dzino-2010 }
  confidence: uncertain
  review: needs-check
  note: >-
    Metulum fell in 35 and the transalpine Iapydes were subject "for the first
    time" (App. Ill. 21); Octavian triumphed over "the Pannonians and
    Dalmatians, the Iapydes and their neighbours" in 29 (Dio 51.21.5). They rose
    again with the Delmatae in 16 (Dio 54.20.3), hence uncertain. Siscia on the
    Save, taken in 35 and held by a garrison of twenty-five cohorts in a walled-off
    part of the town (App. Ill. 24), is not drawn as ground: the Pannonian
    country round it was "not yet under subjection" (Ill. 22), its garrison was
    driven out in 34 (Dio 49.38.3), and Augustus himself dates the frontier on
    the Danube to Tiberius' war (RGDA 30).

