# Italy and the islands

- atom: cisalpina
  polity: italia
  relation: citizen-territory
  from: 42 BCE
  to: after 27 BCE
  sources:
    - { source: appian, locator: 'BC 5.3' }
    - { source: cassius-dio, locator: '48.12.5' }
    - { source: laffi-1992 }
  confidence: probable
  review: draft
  note: >-
    After Philippi the triumvirs agreed to make Cisalpine Gaul "independent, as
    the elder Caesar had intended" (App. BC 5.3): no longer a province, so no
    governor could keep an army south of the Alps. Dio has it "included by this
    time in the district of Italy" in 41 (48.12.5). In practice Pollio held
    Venetia for Antony into 40 (Vell. 2.76.2), and Broughton still lists
    commanders there in 42–40; Laffi (not read) is reported to put the real end
    in late 41. The legal decision is taken as the date.

- atom: sicilia
  polity: sextus-pompeius
  relation: occupied
  from: { earliest: 43 BCE, latest: 42 BCE }
  to: 37 BCE
  sources:
    - { source: cassius-dio, locator: '48.17.4–19.1' }
    - { source: appian, locator: 'BC 4.84–85' }
    - { source: cassius-dio, locator: '49.11.3' }
    - { source: powell-welch-2002 }
  confidence: certain
  review: draft
  note: >-
    Sextus took Mylae and Tyndaris and shared Messana with the governor
    Pompeius Bithynicus in 43 (Dio 48.17.4–5), then "occupied the whole of the
    island" and killed him (48.19.1). Welch: some of the island "must have gone
    over to Sextus before November 43". Misenum made him its lawful governor in
    39 (Dio 48.36.5), which changed the legal cover but not who held it, so the
    row runs on unbroken. Naulochus (September 36) ended it; 36 is Octavian's.

- atom: sardinia
  polity: sextus-pompeius
  relation: occupied
  from: 40 BCE
  to: 39 BCE
  sources:
    - { source: appian, locator: 'BC 5.56' }
    - { source: cassius-dio, locator: '48.30.7–8' }
    - { source: appian, locator: 'BC 5.78' }
    - { source: cassius-dio, locator: '48.45.5–6' }
  confidence: certain
  review: draft
  note: >-
    Menodorus (Dio's Menas) took Sardinia and its two legions for Sextus while
    Antony besieged Brundisium in autumn 40 (App. BC 5.56; Dio 48.30.7–8), and
    handed it to Octavian in 38 (Dio 48.45.5–6; App. BC 5.78, 5.80). Dio 48.2.1
    has Sextus "still occupying Sardinia and Sicily" already in 42; Appian
    (5.56) calls Sardinia Octavian's before 40 and Dio's own narrative has the
    seizure in 40, so 48.2.1 is read as an anticipation.

- atom: corsica
  polity: sextus-pompeius
  relation: occupied
  from: 40 BCE
  to: 39 BCE
  sources:
    - { source: appian, locator: 'BC 5.67' }
    - { source: appian, locator: 'BC 5.72' }
    - { source: appian, locator: 'BC 5.80' }
  confidence: probable
  review: draft
  note: >-
    Sardinia and Corsica were held by Sextus's lieutenants before Misenum (App.
    BC 5.67), and Menodorus handed over both in 38 (5.80). No source gives the
    year Corsica was taken; 40 follows Sardinia.

