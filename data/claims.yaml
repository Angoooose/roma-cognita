    since it was suited to the building of her fleets" (Strabo 14.5.3). Magie
    dates the gift with Amyntas' Galatia in 37/36 (I 434) and to 36 (II
    1272). Octavian gave it to Amyntas in his settlement after Actium, four
    years before 26 (Magie I 443), so it is hers to 31. Before the grant, "it
    is not known what was done with Cilicia Aspera" (Magie II 1272), and it is
    unclaimed.

