# The time series. One row says: this atom was held by this polity, in this
# way, over these years, inclusive at both ends. Geometry is drawn once; all
# that changes over time changes here. An atom with no row covering a year is
# not claimed that year and draws as plain land — the map says nothing rather
# than guess. Rows on one atom may abut but never overlap within a layer
# (holding vs occupation, see packages/schema), and the validator fails if
# they do.
#
# The window is 133–27 BCE, so every `before 133 BCE` / `after 27 BCE` below is
# where that window cuts the row off: in force at that year, extent beyond it
# not stated. Only rows that start or end *inside* the window carry a real
# event date.
#
# The year of a transition belongs to the successor: Numidia is the kingdom's
# to 47 and Africa Nova's from 46.

# --- Italy -------------------------------------------------------------------
#
# Carried back to 133 in September 2026. Before the Social War the italia atom
# is the Roman citizen land (ager-romanus) and the allied regions cut out of it
# are the socii's, washed Roman on the map (a subject-of relation). The
# insurgents' league, italici, holds its ground independent from the outbreak
# at Asculum late in 91 to the year before each region gave in or was taken;
# the year of submission, or of the law that enfranchised it, is italia's (the
# lex Iulia of 90 for the loyal, 89 for the Marsic peoples, the Hirpini and the
# Nucerine cities, 88 for Apulia, 87 for Samnium and Lucania). From 87 all of
# peninsular Italy is italia, as before. The civil war of 88–82, fought for
# the government of Rome itself, and Nola's and Volaterrae's last stands, are
# not drawn.

