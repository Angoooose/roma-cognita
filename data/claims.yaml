# The time series. One row says: this atom was held by this polity, in this
# way, over these years, inclusive at both ends. Geometry is drawn once; all
# that changes over time changes here. An atom with no row covering a year is
# not claimed that year and draws as plain land — the map says nothing rather
# than guess. Rows on one atom may abut but never overlap within a layer
# (holding vs occupation, see packages/schema), and the validator fails if
# they do.
#
# Migrated from cicero-map/data/control.json, whose −68 meant 68 BCE (it
# called that astronomical; it was not). Its window was 68–43 BCE, so every
# `before 68 BCE` / `after 43 BCE` below is where that window cut the row off:
# in force at that year, extent beyond it not stated. Only rows that start or
# end *inside* the window carry a real event date.
#
# The year of a transition belongs to the successor: Numidia is the kingdom's
# to 47 and Africa Nova's from 46.

# --- Italy -------------------------------------------------------------------

- atom: italia
  polity: italia
  relation: citizen-territory
  from: before 68 BCE
  to: after 43 BCE
  sources:
    - { source: cicero-map, locator: data/control.json }
  confidence: certain
  review: draft
  note: Enfranchised after the Social War.

- atom: cisalpina
  polity: gallia-cisalpina
  relation: province
  from: before 68 BCE
  to: 50 BCE
  sources:
    - { source: cah-ix }
  confidence: probable
  review: draft
  note: Provincial from c. 81.

- atom: cisalpina
  polity: italia
  relation: citizen-territory
  from: 49 BCE
  to: after 43 BCE
  sources:
    - { source: cicero-map, locator: data/control.json }
  confidence: certain
  review: draft
  note: >-
    lex Roscia, 49 — citizenship to the Transpadanes. The province is not
    formally dissolved into Italy until 42, after Cicero's death; the ground
    becomes citizen territory here.

