- atom: chersonesus
  polity: bosporus
  relation: client
  from: c. 41 BCE
  to: after 27 BCE
  sources:
    - { source: strabo, locator: '7.4.3' }
    - { source: pliny-nh, locator: '4.85' }
    - { source: vnukov-kovalenko-2007 }
  confidence: uncertain
  review: needs-check
  note: >-
    As bosporus. Strabo has the city "subject to the potentates of the Bosporus"
    down to his own day (7.4.3). Pliny records an undated grant of freedom by the
    Romans (4.85), dated to Caesar c. 45 by Rostovtzeff; Vnukov and Kovalenko
    argue from a coin of Asander's year 8 found at Kara-Tobe that Bosporan
    control was back by about 37/36. The free interval is not drawn.

# The West

- atom: vaccaei
  polity: hispania-citerior
  relation: province
  from: c. 29 BCE
  to: after 27 BCE
  sources:
    - { source: cassius-dio, locator: '51.20.5' }
    - { source: florus, locator: '2.33.47' }
    - { source: orosius, locator: '6.21.3' }
    - { source: perea-yebenes-2017, locator: '127' }
  confidence: uncertain
  review: needs-check
  note: >-
    Statilius Taurus subdued them (Dio 51.20.5, no year given; his campaign is
    usually put in 29, Perea Yébenes 2017, 127), and by 26 the Cantabri were
    raiding the Vaccaei, the Turmogi and the Autrigones (Flor. 2.33.47; Oros.
    6.21.3) — Rome's charges by then. The Turmogi and Autrigones between them
    and Pompaelo stay unclaimed: nothing says when they came over.

# Africa, Mauretania, Egypt, Cyrene and Crete

- atom: numidia-soummam
  polity: mauretania
  relation: client
  from: 41 BCE
  to: 34 BCE
  sources:
    - { source: bridoux-2020, locator: '¶103, ¶159' }
    - { source: cassius-dio, locator: '53.26.2' }
  confidence: uncertain
  review: needs-check
  note: >-
    Arabio's lands after his death in 41. Bridoux infers that Bocchus II took
    them, so that Mauretania reached the Ampsaga ("se serait emparé", ¶103); no
    ancient text says so, though Juba II was later given "the possessions of
    Bocchus and Bogud" (Dio 53.26.2) and Pliny's Mauretania ends at the Ampsaga.
    Fango, the governor of Numidia, had driven Arabio out (Dio 48.22.4), so
    part may have gone to the province instead.

