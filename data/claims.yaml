  note: >-
    Antony executed Lysanias, "whom he himself had made king", for favouring
    Pacorus, and gave "extensive portions" of the Ituraeans' districts to
    Cleopatra's house (Dio 49.32.5; AJ 15.92); her second count of years was
    as queen of Chalcis (Porphyry, as Bingen reports). Dio says portions, not
    all, hence uncertain.

