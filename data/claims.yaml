  review: needs-check
  note: >-
    Hostile to Rome before 35 (App. Ill. 18), though some of them owed tribute
    (Dio 49.34.2), hence uncertain.

- atom: iapydes
  polity: illyricum
  relation: province
  from: 35 BCE
  to: after 27 BCE
  sources:
    - { source: appian, locator: 'Ill. 21' }
    - { source: cassius-dio, locator: '49.35' }
    - { source: cassius-dio, locator: '51.21.5' }
    - { source: dzino-2010 }
  confidence: uncertain
  review: needs-check
  note: >-
    Metulum fell in 35 and the transalpine Iapydes were subject "for the first
    time" (App. Ill. 21); Octavian triumphed over "the Pannonians and
    Dalmatians, the Iapydes and their neighbours" in 29 (Dio 51.21.5). They rose
    again with the Delmatae in 16 (Dio 54.20.3), hence uncertain. Siscia on the
    Save, taken in 35 and held by a garrison of twenty-five cohorts in a walled-off
    part of the town (App. Ill. 24), is not drawn as ground: the Pannonian
    country round it was "not yet under subjection" (Ill. 22), its garrison was
    driven out in 34 (Dio 49.38.3), and Augustus himself dates the frontier on
    the Danube to Tiberius' war (RGDA 30).

- atom: delmatae
  polity: illyricum
  relation: province
  from: 33 BCE
  to: after 27 BCE
  sources:
    - { source: appian, locator: 'Ill. 25–28' }
    - { source: cassius-dio, locator: '49.38.3–4' }
    - { source: cassius-dio, locator: '49.43.8' }
    - { source: cassius-dio, locator: '53.12.4' }
    - { source: dzino-2010 }
  confidence: uncertain
  review: needs-check
  note: >-
    Octavian took Promona in 34 and left Statilius Taurus to finish the war
    (App. Ill. 25–27). After the Calends of January 33 the Delmatae gave 700
    children as hostages, the standards taken from Gabinius and the tribute "in
    arrears since the time of Gaius Caesar" (Ill. 28). Dio lists "the
    Dalmatian… districts" among the people's provinces in 27 (53.12.4). A
    tributary people under treaty is a defensible reading too, and they revolted
    in 16 and 11 (Dio 54.20.3, 54.34.3–4), hence uncertain. Illyricum was
    governed as a province of its own from some time between 32 and 27 (Džino,
    as reviewed in BMCR 2010.08.44).

# The Bosporus: Asander recognised

- atom: bosporus
  polity: bosporus
  relation: client
  from: c. 41 BCE
  to: after 27 BCE
  sources:
    - { source: vnukov-kovalenko-2007 }
    - { source: lucian-macrobii, locator: '17' }
    - { source: strabo, locator: '7.4.4' }
  confidence: uncertain
  review: needs-check
  note: >-
    Asander's gold staters read "archon" for years 1–4 and "king" from year 4
    to 29. On Vnukov and Kovalenko's chronology, year 1 is 44/43 at the
    earliest, so the royal title — and with it, most likely, Roman recognition —
    comes in 41/40 at the earliest, while Antony was ordering the East. Other
    chronologies put year 1 in 50/49 or 49/48, which would move it under
    Caesar; and ps.-Lucian (Macr. 17) says Asander "was proclaimed king of
    Bosporus by the divine Augustus", which read literally points after Actium.
    Strabo: "since the time of Mithridates the kingdom has been subject to the
    Romans" (7.4.4).

