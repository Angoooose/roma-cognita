# Judaea: Antigonus and Herod

- atom: judaea
  polity: judaea-antigonus
  relation: independent
  from: 40 BCE
  to: 38 BCE
  sources:
    - { source: josephus-aj, locator: '14.330–369' }
    - { source: cassius-dio, locator: '48.26.2' }
    - { source: debevoise-1938, locator: 'p. 113' }
  confidence: probable
  review: draft
  note: >-
    The Parthians took Jerusalem in 40, carried off Hyrcanus and made
    Antigonus king (AJ 14.330–369). From 39 Herod, whom the senate had made king
    in 40, held Joppa, Idumaea and by the winter of 39/38 Galilee (AJ
    14.394–397, 14.413–414) — part of this atom, which cannot be split by year,
    so it is drawn Antigonus' to the fall of Jerusalem.

