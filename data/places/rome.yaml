  note: >-
    Vowed in 499 BCE after Lake Regillus and dedicated in 484; restored in 117 BCE by L.
    Caecilius Metellus. The remains, and so the outline, are of Tiberius' rebuilding
    (dedicated 6 CE) on the same site. The outline is the Augustan podium of 6 CE; the
    Metellan temple of 117 BCE that stood through the window was six-sevenths its scale
    (Nielsen and Poulsen), with a deep speakers' tribunal before it reached by stairs at
    its sides.
    Until 117 the archaic temple of 484 stood, 27.5 by 37–40 m on a podium of
    cappellaccio 3–5 m high, three cellae behind a deep porch of three rows of four tufa
    columns; from the early 2nd century it had stairs at its sides and a provisional
    speakers' tribunal in front (Nielsen and Poulsen, as the Parco archeologico del
    Colosseo summarises them). Metellus's rebuilding is dated only to 117: the map shows
    that one year as building.

