    - { source: pleiades, locator: places/103808101 }
    - source: osm-rome
      locator: >-
        way/112675404, way/105281824, way/112677344, way/112677349, way/112677352,
        way/1223826659, way/1223826660, way/781934076, way/781934077, way/427413247,
        way/785914787, way/120880574, way/120880575
    - { source: sitar, locator: '19694 (the course); the pieces in rome-servian.geojson' }
    - { source: appian, locator: 'BC 1.66' }
  confidence: certain
  review: draft
  note: >-
    The circuit of squared tufa the censors contracted for after the Gallic sack
    (Livy 6.32.1, under 377 BCE), some 10 km round, on SITAR's reconstruction of
    its course: along the brows of the hills, and across the Esquiline plateau as
    the agger, a ditch and an earth bank. It still stood whole in this period,
    repaired in the civil wars of 87 BCE, when the consuls "repaired the walls, and
    planted engines on them" (Appian, Civil Wars 1.66), and manned in 87 and 82, though the city
    had long outgrown it and pressed against it. The Aurelian Walls, which most
    maps of Rome show, are of 271 CE.

# --- the Forum -----------------------------------------------------------------

- id: aedes-saturni
  kind: temple
  within: roma
  location: [12.48409, 41.8924]
  names:
    - { text: Aedes Saturni, lang: la, preferred: true }
    - { text: Temple of Saturn, lang: en }
  from: before 133 BCE
  to: after 27 BCE
  condition:
    - { value: standing, from: before 133 BCE, to: 43 BCE }
    - { value: under construction, from: 42 BCE, to: c. 35 BCE, kept: footings }
    - { value: standing, from: c. 34 BCE, to: after 27 BCE }
  prominence: 5
  sources:
    - { source: platner-ashby, locator: 'Aedes Saturni, pp. 463–465' }
    - { source: osm-rome, locator: relation/1849835 }
    - { source: digitales-forum-romanum, locator: 'Saturntempel' }
  confidence: certain
  review: draft
  note: >-
    One of the oldest temples of the Forum, and the state treasury (aerarium).
    Rebuilt from 42 BCE by L. Munatius Plancus on the old temple's site: the
    podium standing now is his, of travertine and peperino walls filled with
    concrete, and only "a few blocks of the podium of the original temple" remain
    in it (P&A, p. 464), so only the footings are kept and the podium rises new.
    The eight columns standing now are from a late-antique restoration, and the
    outline is the podium.
    Plancus's rebuilding from 42 BCE is not dated to its end; the map shows it under
    way to about 35 BCE (Digital Augustan Rome: it "must have begun in the late 40s").
    The point is the podium's centre, about 40 m west of where the Forum's plan once
    put it.

- id: aedes-castoris
  kind: temple
  within: roma
  pleiades: '157276290'
  location: [12.48563, 41.89167]
  names:
    - { text: Aedes Castoris, lang: la, preferred: true }
    - { text: Temple of Castor, lang: en }
  from: before 133 BCE
  to: after 27 BCE
  condition:
    - { value: standing, from: before 133 BCE, to: 118 BCE }
    - { value: under construction, from: 117 BCE, to: 117 BCE }
    - { value: standing, from: 116 BCE, to: after 27 BCE }
  prominence: 5
  sources:
    - { source: platner-ashby, locator: 'Aedes Castoris#in_Foro_Romano, pp. 102–105' }
    - { source: pleiades, locator: places/157276290 }
    - { source: osm-rome, locator: relation/1842061 }
    - { source: digitales-forum-romanum, locator: 'Dioskurentempel' }
    - { source: parco-colosseo-castori, locator: 'pp. 2–3' }
    - { source: cicero-scaur, locator: '46' }
  confidence: certain
  review: draft
  note: >-
    Vowed in 499 BCE after Lake Regillus and dedicated in 484; restored in 117 BCE by L.
    Caecilius Metellus. The remains, and so the outline, are of Tiberius' rebuilding
    (dedicated 6 CE) on the same site. The outline is the Augustan podium of 6 CE; the
    Metellan temple of 117 BCE that stood through the window was six-sevenths its scale
    (Nielsen and Poulsen), with a deep speakers' tribunal before it reached by stairs at
    its sides.
    Until 117 the archaic temple of 484 stood, 27.5 by 37–40 m on a podium of
    cappellaccio 3–5 m high, three cellae behind a deep porch of three rows of four tufa
    columns; from the early 2nd century it had stairs at its sides and a provisional
    speakers' tribunal in front (Nielsen and Poulsen, as the Parco archeologico del
    Colosseo summarises them). Metellus's rebuilding is dated only to 117: the map shows
    that one year as building.

