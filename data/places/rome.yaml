    The temple of Concord at the north-west corner of the forum, below the Capitol, said
    to have been vowed by Camillus in 367 BCE. The senate had it restored by L. Opimius
    in 121 BCE, after the death of C. Gracchus, and it was then often used for meetings
    of the senate. The outline is of Tiberius's rebuilding (dedicated 10 CE); Platner &
    Ashby say the plan of Opimius's temple seems to have been similar, and much of the
    podium core is of 121 BCE. The outline is Tiberius's temple, whose cella lay across
    its width; Opimius's of 121 BCE was laid out lengthwise, eight columns across its
    front (Digitales Forum Romanum, after Gasparri and Ferroni).
    Before 121 an older temple stood here, of which 4th-century remains have been found
    (Ferroni); its form is not known, and it is drawn as a typical temple. Opimius's
    enlarged temple did away with Cn. Flavius's bronze shrine of Concord on the
    Graecostasis (304 BCE) and the old Senaculum (Platner & Ashby, pp. 138, 470). Its
    dedication is not dated: the map shows 121 as building. That is the weak
    point: Platner & Ashby and Appian (BC 1.26) give the senate's order of 121, Plutarch
    (C. Gracch. 17) Opimius's building, none the year it was finished, so standing from 120
    is not backed and the record is probable, not certain (October 2026).

