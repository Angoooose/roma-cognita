# The places of Rome, for the model of the city shown when the map is zoomed right
# into it (DESIGN.md §7.7): its monuments, river, streets, hills and quarters. They
# are places like any other — named, dated, sourced, searchable — at prominence 5,
# the city plan, and `within: roma`.
#
# Every date is from Platner & Ashby, checked against the article linked by its
# locator. Outlines are OpenStreetMap's (the osm-rome locators), fetched into
# data/geometry/rome.geojson by `npm run rome:fetch -w pipeline`, and raised into the
# model by the type of building (pipeline/src/rome/model.ts). An outline is of the
# remains as they survive, and the note says when those are a later rebuilding on
# the same site. Where OSM has no outline the monument is left out of the model,
# except two landmarks sized from Platner & Ashby's measurements (model.ts).
# The houses between the monuments are generated, not recorded (DESIGN.md §7.7).
#
# Dates follow the atlas's rules: `from` is when a thing stood (or works began, with
# `condition: under construction` until the dedication), open ends are bounds, and
# the year of a change belongs to what came after it. The window is before 133 BCE
# to after 27 BCE.
#
# Not yet here, and why (BACKLOG.md): the Largo Argentina and Forum Boarium temples,
# whose identifications postdate Platner & Ashby; the Curia Hostilia and the
# Basilica Sempronia, which have no surveyed outline.

# --- the river and its crossings ----------------------------------------------

