# The places of Rome, for the model of the city shown when the map is zoomed right
# into it (DESIGN.md §7.7): its monuments, river, streets, hills and quarters. They
# are places like any other — named, dated, sourced, searchable — at prominence 5,
# the city plan, and `within: roma`.
#
# Every date is from Platner & Ashby, checked against the article linked by its
# locator, unless the record cites the modern literature that superseded them
# (Digital Augustan Rome, the Digitales Forum Romanum). Outlines are OpenStreetMap's
# (the osm-rome locators), fetched into data/geometry/rome.geojson by `npm run
# rome:fetch -w pipeline`. An outline is of the remains as they survive, and the note
# says when those are a later rebuilding on the same site. Each monument is built in
# the model from its design (pipeline/src/rome/designs.ts), which says what it was
# like in 133–27 BCE and on what evidence. The houses between the monuments are
# generated, not recorded (DESIGN.md §7.7).
#
# Dates follow the atlas's rules: `from` is when a thing stood (or works began, with
# `condition: under construction` until the dedication), open ends are bounds, and
# the year of a change belongs to what came after it. The window is before 133 BCE
# to after 27 BCE.
#
# Researched and left out, and why: BACKLOG.md, "The model of Rome".

# --- the river and its crossings ----------------------------------------------

- id: insula-tiberina
  kind: island
  within: roma
  location: [12.47768, 41.89058]
  names:
    - { text: Insula Tiberina, lang: la, preferred: true }
    - { text: Tiber Island, lang: en }
  from: before 133 BCE
  to: after 27 BCE
  prominence: 5
  sources:
    - { source: platner-ashby, locator: 'Insula Tiberina, pp. 281–282' }
    - { source: osm-rome, locator: way/126146475 }
    - { source: digital-augustan-rome, locator: 'Insula Tiberina' }
  confidence: certain
  review: draft
  note: >-
    Its temple of Aesculapius dates from the arrival of the god's serpent in 292 BCE.
    The outline is the island inside its modern embankments, which follow the
    ancient shore closely; the travertine facing that gave it the shape of a ship
    was probably built with the bridges of the 60s–40s BCE.
    The ship's walls are drawn from 62 BCE, with the Pons Fabricius; Digital Augustan
    Rome dates the revetment "imitating a trireme prow" to the mid-1st century BCE.

