    - { source: digitales-forum-romanum, locator: 'Concordiatempel' }
  confidence: certain
  review: draft
  note: >-
    The temple of Concord at the north-west corner of the forum, below the
    Capitol, said to have been vowed by Camillus in 367 BCE. The senate had it
    restored by L. Opimius in 121 BCE, after the death of C. Gracchus, and it was
    then often used for meetings of the senate. The outline is of Tiberius's
    rebuilding (dedicated 10 CE); Platner & Ashby say the plan of Opimius's
    temple seems to have been similar, and much of the podium core is of 121 BCE.
    The outline is Tiberius's temple, whose cella lay across its width; Opimius's of
    121 BCE was laid out lengthwise, eight columns across its front (Digitales Forum
    Romanum, after Gasparri and Ferroni).

