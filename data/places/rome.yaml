  from: 179 BCE
  to: after 27 BCE
  condition:
    - { value: standing, from: 179 BCE, to: 79 BCE }
    - { value: under construction, from: 78 BCE, to: 78 BCE }
    - { value: standing, from: 77 BCE, to: 56 BCE }
    - { value: under construction, from: 55 BCE, to: 35 BCE }
    - { value: standing, from: 34 BCE, to: after 27 BCE }
  prominence: 5
  sources:
    - { source: platner-ashby, locator: 'Basilica Aemilia, pp. 72–76' }
    - { source: pleiades, locator: places/417632343 }
    - { source: osm-rome, locator: relation/1766532 }
    - { source: pliny-nh, locator: '35.13' }
    - { source: basilica-aemilia-online, locator: 'project description' }
    - { source: freyberger-ertel-2016 }
  confidence: certain
  review: draft
  note: >-
    Built by the censors of 179 BCE as a hall of one storey; "in the early years of the
    1st century B.C." it was made two-storeyed (Freyberger and Ertel). The consul M.
    Aemilius Lepidus restored it in 78, hanging shields with his ancestors' portraits on
    it (Pliny, NH 35.13), and his son's coin shows it two-storeyed with the shields and
    "ref(ecta)": the map takes the second storey to be his work, an inference. The
    aedile L. Aemilius Paullus began rebuilding it in 55 BCE, and his son dedicated the
    work in 34; from then it was often called the basilica Paulli. It burned in 14 BCE
    and was rebuilt, but Platner & Ashby find little change in its extent and plan, so
    the surviving outline stands for the whole period.

