  note: >-
    The street up the Aventine that the aediles Lucius and Marcus Publicius
    Malleolus built and paved about 238 BCE (Varro, LL 5.158; Festus). It "began in
    the forum Boarium, near the west end of the circus Maximus and the porta
    Trigemina, and must have extended across the Aventine in a southerly direction,
