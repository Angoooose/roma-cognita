  note: >-
    The road west along the coast, which Catiline took out of Rome in 63 BCE
    (Cicero, In Catilinam 2.6); 241 BCE, the censorship of C. Aurelius Cotta, is the
    usual inference from its name. It "led from the pons Aemilius across the low
    ground on the right bank of the Tiber (where two arches of a viaduct belonging to
    it were found near S. Crisogono …) up to the Janiculum", through the later Porta
    Aurelia (Platner & Ashby), and on along the line of the modern Via Aurelia Antica
    "for nearly 3 miles" (Ashby 1927). Its line up the Janiculum is not known, and
    is drawn over the easiest ground, lighter. Itiner-e brings its Aurelia in
    through the Vatican plain, which is another road, so its line is not used here.

