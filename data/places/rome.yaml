  note: >-
    In use from the kings; the censors of 174 BCE rebuilt its starting gates. Caesar
    lengthened it and dug a moat between the arena and the seats in 46 BCE, and a fire
    destroyed much of it in 31. The outline is the valley it filled at its imperial
    extent; the republican circus lay in the same place but did not reach as far. Caesar
