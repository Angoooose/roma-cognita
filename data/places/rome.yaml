  from: 144 BCE
  to: after 27 BCE
  condition:
    - { value: under construction, from: 144 BCE, to: 141 BCE }
    - { value: standing, from: 140 BCE, to: after 27 BCE }
  prominence: 5
  sources:
    - { source: frontinus, locator: '1.7' }
    - { source: platner-ashby, locator: 'Aqua Marcia, s.v.' }
    - { source: ashby-1935, locator: 'pp. 128–152' }
    - { source: pleiades, locator: places/423565 }
  confidence: certain
  review: draft
  note: >-
    Built by the praetor Q. Marcius Rex from 144 BCE, his praetorship "extended for
    a second year" (Frontinus 1.7), and brought to the Capitol in 140. Of its 91 km,
    about 9.6 km near Rome ran on arches (6,472 paces), which the model draws from
    Tor Fiscale to the Via Marsala at the channel levels Ashby surveyed. Placed at
    its remains at Porta Furba (OpenStreetMap way 113758266). Agrippa repaired it in
    33 BCE (Frontinus 1.9).

