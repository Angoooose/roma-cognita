  confidence: certain
  review: draft
  note: >-
    One of the oldest temples of the Forum, and the state treasury (aerarium).
    Rebuilt from 42 BCE by L. Munatius Plancus on the same podium; the eight
    columns standing now are from a late-antique restoration, and the outline is
    the podium.
    Plancus's rebuilding from 42 BCE is not dated to its end; the map shows it under
