  confidence: certain
  review: draft
  note: >-
    The temple of Jupiter, Juno and Minerva on the Capitol. Until 83 BCE the archaic
    temple: tufa under white stucco, a timber entablature and a terracotta roof, gilt
    shields on its pediment (193 BCE) and a chariot group on its apex; a mosaic floor
    laid after 149 and ceilings gilded in 142 (Pliny). It burned to the ground on 6 July
    83 BCE, and the ruin is shown to the end of 82, when Sulla took the city and the
    rebuilding in hand; Catulus's temple, on the same foundations but higher and roofed
    with gilded bronze tiles, was dedicated in 69. It was rebuilt on the old
    foundations (Dionysius of Halicarnassus 4.61.4; "eodem loco", Tacitus, Histories
    3.72), so the podium is kept and the temple rises on it. It was not finished at
    the dedication: in 62 Caesar, as praetor, called Catulus to account for the
    rebuilding and would have handed the rest of the work to Pompey (Suetonius, Divus
    Iulius 15), saying many parts were "but half finished, or at any rate Caesar
    pretended this was the case" (Dio 37.44.1–2). So it is shown being finished to 62,
    the last year a source puts work on it; when the work ended is not recorded. In 46
    the Senate voted Caesar's name onto it in place of Catulus's, as having completed
    it (Dio 43.14.6), which was never carried out and dates no work. Whether the
    temple filled the whole 53 by 62 m platform, as drawn, or stood on part of it, is
    disputed (Arata 2010; Kaderka and Tucci 2021); the 74 m length of some plans takes
    in a wall behind it that others give to the precinct. Parts of the podium survive
    under the Palazzo Caffarelli, but no surveyed outline is open, so it is drawn as a
    point.

