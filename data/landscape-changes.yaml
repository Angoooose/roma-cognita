# Dated corrections to modern physical geography (DESIGN.md §6.1). The coast
# comes from modern OSM and HydroLAKES; where the modern landscape differs from
# the one this map shows, a record here says how, when and on whose authority,
# and the coast build (pipeline/src/water) applies it. Geometry lives in
# data/geometry/landscape-changes.geojson, keyed by id, and is written by the
# generators in pipeline/src/landscape, each of which keeps the others' shapes.
# The validator checks that every add-water and remove-water record has one.
#
# The interval is when the correction applies: all three of these hold for the
# whole of the map's window.

- id: suez-canal
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: karabell-2003 }
    - { source: osm-land-polygons, locator: "channel centrelines; see canals.ts" }
  confidence: certain
  review: draft
  note: >-
    The modern canal (1869) and its 2015 parallel channels. The Bitter Lakes and
    Lake Timsah are left as water: Strabo (17.1.25) has the Ptolemaic Nile–Red
    Sea canal running through the Bitter Lakes. Their extent in antiquity, and
    whether the Ptolemaic canal was navigable in 133–27 BCE, are separate
    questions for their own records.

- id: corinth-canal
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: corinth-canal-1893 }
  confidence: certain
  review: needs-check
  note: >-
    Cut 1881–93. In the Republic the isthmus was crossed by hauling ships on
    the diolkos. The source is a placeholder citation to be replaced.

- id: lake-tharthar
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: escwa-bgr-2013 }
  confidence: certain
  review: needs-check
  note: >-
    A dry salt depression (Wadi Tharthar) until the Tigris was diverted into it
    from 1956. HydroLAKES types it as a natural lake, so the reservoir filter
    in the coast build does not catch it. The locator is still to be supplied.
