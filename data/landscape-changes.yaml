# Dated corrections to modern physical geography (DESIGN.md §6.1). The coast
# comes from modern OSM and HydroLAKES; where the modern landscape differs from
# the one this map shows, a record here says how, when and on whose authority,
# and the coast build (pipeline/src/water) applies it. Geometry lives in
# data/geometry/landscape-changes.geojson, keyed by id, and is written by the
# generators in pipeline/src/landscape, each of which keeps the others' shapes.
# The validator checks that every add-water and remove-water record has one.
#
# The interval is when the correction applies: all three of these hold for the
# whole of the map's window.

- id: suez-canal
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: karabell-2003 }
    - { source: osm-land-polygons, locator: "channel centrelines; see canals.ts" }
  confidence: certain
  review: draft
  note: >-
    The modern canal (1869) and its 2015 parallel channels. The Bitter Lakes and
    Lake Timsah are left as water: Strabo (17.1.25) has the Ptolemaic Nile–Red
    Sea canal running through the Bitter Lakes. Their extent in antiquity, and
    whether the Ptolemaic canal was navigable in 133–27 BCE, are separate
    questions for their own records.

- id: corinth-canal
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: corinth-canal-1893 }
  confidence: certain
  review: needs-check
  note: >-
    Cut 1881–93. In the Republic the isthmus was crossed by hauling ships on
    the diolkos. The source is a placeholder citation to be replaced.

- id: lake-tharthar
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: escwa-bgr-2013 }
  confidence: certain
  review: needs-check
  note: >-
    A dry salt depression (Wadi Tharthar) until the Tigris was diverted into it
    from 1956. HydroLAKES types it as a natural lake, so the reservoir filter
    in the coast build does not catch it. The locator is still to be supplied.

# --- lakes drained since ------------------------------------------------------
# Shapes derived by pipeline/src/landscape/derive-coasts.ts: the modern ground
# below the lake's level, flooded from its bed; the level is argued in coasts.ts.

- id: lacus-fucinus
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: suetonius-iul, locator: '44: Caesar planned to drain it' }
    - { source: wikipedia-fucine-lake, locator: recorded depths 1783–1861; area at its largest }
    - { source: mapterhorn, locator: 'z11 terrain: the basin below 668 m' }
  confidence: probable
  review: needs-check
  note: >-
    The Fucine Lake, drained by the Torlonia works of 1854–78. In the window it was
    natural and closed, draining only through swallow-holes: Claudius's tunnel came
    in AD 52. Its level moved with the seasons and the decades, so the outline is a
    middling high stand (668 m), not a survey; about 147 km².

- id: lake-copais
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: strabo, locator: '9.2.16–18: a circuit of 380 stades, changing greatly with the seasons' }
    - { source: koutsoyiannis-kopais, locator: 'levels +92 to +97 m' }
    - { source: knauss-1987 }
    - { source: mapterhorn, locator: 'z11 terrain: the basin below 97 m' }
  confidence: uncertain
  review: needs-check
  note: >-
    Lake Copais, drained between 1882 and 1931. A seasonal lake and reed fen: drawn
    at its high stand (97 m, about 235 km², against 241 km² reclaimed), because the
    drained peat has since shrunk and at lower levels the modern ground misplaces the
    western shore. Even so Orchomenos is 2 km from the water; the western arm was
    more fen than lake.

- id: lake-boibeis
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: strabo, locator: '9.5.15, 9.5.22: Lake Boebeïs' }
    - { source: wikipedia-lake-karla, locator: area; drained 1962 }
    - { source: mapterhorn, locator: 'z11 terrain: the basin below 49 m' }
  confidence: uncertain
  review: needs-check
  note: >-
    Lake Boibeis (Karla), drained in 1962. Certainly a lake; its outline is not. The
    floor is so flat that each metre of level adds or removes about a hundred km², so
    49 m is a middle choice inside its seasonal range (about 119 km²), and the
    north-west side, where it met the Peneios's flood plain, is drawn by us.

- id: lake-moeris
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: strabo, locator: '17.1.35–38' }
    - { source: herodotus, locator: '2.149' }
    - { source: ball-1939, locator: levels of Lake Moeris (locator to supply) }
    - { source: caton-thompson-gardner-1934, locator: ancient lake levels (locator to supply) }
    - { source: mapterhorn, locator: 'z10 terrain: the depression below −2 m' }
  confidence: uncertain
  review: draft
  note: >-
    The Fayum lake at the level usually given for the Ptolemaic reclamation, about
    −2 m, against Lake Qarun's −43 m today: exactly the ground the Fayum floodplain
    (features.yaml) leaves out, so the two meet. Uncertain for the same reason: the
    level moved during the window and is a single number. Modern drains cut below
    the old level on the south side are left out (arms under 500 m wide).

# --- ancient coasts: Italy ----------------------------------------------------
# A coast is the shore of about 50 BCE, read from the cited reconstructions (their
# figures georeferenced against named sites), with the sea filled in to it over
# today's ground by derive-coasts.ts; coasts.ts says where each vertex comes from.
# A lagoon is an authored outline of the extent its sources give.

- id: tiber-mouth
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: salomon-2018, locator: 'cores ISF-1, TB-1; fig. 1 (wall of 63–58 BCE, 2nd–3rd-century coast)' }
    - { source: salomon-2023, locator: 'fig. 1, coastline of the 2nd century CE' }
    - { source: strabo, locator: '5.3.5: Ostia harbourless from the Tiber’s silt' }
    - { source: mapterhorn, locator: 'z12 terrain seaward of the shore' }
  confidence: probable
  review: draft
  note: >-
    The Tiber delta has built out 2–4 km since: Isola Sacra, Fiumicino and Lido di
    Ostia stand on it, and Claudius's harbour was dug partly into the sea. Certain
    at Ostia, where cores date the shore; north of the Claudian basin and south of
    Ostia, where the old coast closes on the modern one, the line is ours.

- id: stagno-di-maccarese
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: di-rita-2010, locator: brackish from the 9th–8th century BCE }
  confidence: uncertain
  review: needs-check
  note: >-
    The lagoon north of the Tiber, behind the Roman barrier, reclaimed in the 19th
    and 20th centuries (Maccarese; Fiumicino airport). Its extent is the sources';
    its outline is ours.

- id: stagno-di-ostia
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: salomon-2018, locator: 'fig. 1, the 19th-century lagoon' }
    - { source: vittori-2015, locator: kept open to the sea for the salt works }
  confidence: uncertain
  review: needs-check
  note: >-
    The lagoon east of Ostia, the Campus Salinarum Romanarum, drained in the 19th
    century. Its outline is rounded by us inside the extent the figure gives.

- id: arno-coast
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: pasquinucci-2014, locator: 'fig. 2, the innermost ancient shoreline (after Mazzanti 2003)' }
    - { source: kaniewski-2018, locator: 'fig. 8A, the Roman period' }
    - { source: strabo, locator: '5.2.5: Pisa 20 stades from the sea by the river' }
    - { source: mapterhorn, locator: 'z12 terrain seaward of the shore' }
  confidence: probable
  review: draft
  note: >-
    The coast off Pisa, about 7 km inland of today's at the Arno: it was nearly still
    from the 8th to the 2nd century BCE and began to build out in the 2nd–1st. North
    of the Serchio, where it closes on the modern coast towards Viareggio, the line
    is ours.

- id: portus-pisanus
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: kaniewski-2018, locator: 'fig. 8A; the lagoon formed about 200 BCE' }
  confidence: probable
  review: draft
  note: >-
    Pisa's harbour lagoon behind the barrier north of Livorno, open to the sea by an
    inlet. Outline rounded by us inside the figure's extent.

- id: po-delta-coast
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: ispra-205-comacchio, locator: 'fig. 13 (after Ciabatti 1966), ridge V; p. 118, the Comacchio ship' }
    - { source: ciabatti-1966 }
    - { source: cirelli-2013, locator: 'fig. 2, Ravenna and Classe' }
    - { source: strabo, locator: '5.1.7–8: Spina 90 stades from the sea; Atria by canals' }
    - { source: pliny-nh, locator: '3.119–121, the mouths of the Po' }
    - { source: mapterhorn, locator: 'z11 terrain seaward of the shore' }
  confidence: uncertain
  review: needs-check
  note: >-
    The Adriatic coast from Ravenna to Chioggia on the Roman beach ridge. Everything
    seaward of it is later: the lobes of the Po di Goro, Tolle and Pila, most of them
    after the Porto Viro cut of 1604. Ciabatti's map is a sketch, good to 1–2 km, so
    uncertain; probable at Ravenna and Comacchio, where it is tied to finds. The
    delta built out fast between the 4th and the 1st century BCE, so the line is the
    end of the window more than its start. Comacchio comes out 2.8 km from the water,
    against a ridge said to pass through it: within the figure's error, not resolved.

- id: ravenna-lagoon
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: cirelli-2013, locator: 'fig. 2' }
    - { source: strabo, locator: '5.1.7: Ravenna built on piles in the marshes' }
  confidence: uncertain
  review: needs-check
  note: >-
    Open water west and south of Ravenna and between it and Classe. Schematic: the
    figure is a sketch of the early Empire, and Classe's harbour is Augustan.

# --- modern lagoons that were land --------------------------------------------

- id: valli-di-comacchio
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: ispra-205-comacchio, locator: 'Roman villas at Agosta and Dosso dei Sassi on the lagoon floor' }
  confidence: probable
  review: needs-check
  note: >-
    The valli west of the Augustan ridge formed as the delta subsided after
    antiquity; in the window they were land with villas on it. Where some was marsh
    the map cannot yet say.

- id: grado-lagoon
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: donda-2025, locator: 'the lagoon mostly emerged land in the Roman period; the San Gottardo harbour 500 m offshore at −4 m' }
  confidence: uncertain
  review: needs-check
  note: >-
    The eastern lagoon, between Aquileia's plain and the Grado barrier, is post-Roman;
    the Marano lagoon to the west is older and is left as it is. The coast itself lay
    at or a little seaward of today's barrier islands, which at this scale changes
    nothing, so it is not redrawn. Relative sea level was 1.2–1.7 m lower, which the
    map does not apply.
