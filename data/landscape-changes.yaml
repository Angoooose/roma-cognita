# --- modern lagoons that were land --------------------------------------------

- id: valli-di-comacchio
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: ispra-205-comacchio, locator: 'Roman villas at Agosta and Dosso dei Sassi on the lagoon floor' }
  confidence: probable
  review: needs-check
  note: >-
    The valli west of the Augustan ridge formed as the delta subsided after
    antiquity; in the window they were land with villas on it. Where some was marsh
    the map cannot yet say.

- id: grado-lagoon
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: donda-2025, locator: 'the lagoon mostly emerged land in the Roman period; the San Gottardo harbour 500 m offshore at −4 m' }
  confidence: uncertain
  review: needs-check
  note: >-
    The eastern lagoon, between Aquileia's plain and the Grado barrier, is post-Roman;
    the Marano lagoon to the west is older and is left as it is. The coast itself lay
    at or a little seaward of today's barrier islands, which at this scale changes
    nothing, so it is not redrawn. Relative sea level was 1.2–1.7 m lower, which the
    map does not apply.

# --- ancient coasts: the Aegean -----------------------------------------------

- id: latmian-gulf
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: bruckner-2017, locator: 'fig. 1, the "±0" delta front; Lade, pp. 880–881 and fig. 4' }
    - { source: mullenhoff-2005 }
    - { source: bruckner-2014, locator: 'p. 68: Priene cut off from the open sea by the 90s BCE' }
    - { source: akcer-on-2020, locator: 'Bafa a lagoon with a narrow link to the sea by about 33 BCE' }
    - { source: strabo, locator: '12.8.17; 14.1.7–10' }
    - { source: pausanias, locator: '7.2.11; 8.24.11 (the gulf silted, 2nd century CE)' }
    - { source: mapterhorn, locator: 'z11 terrain below 6 m seaward of the delta front' }
  confidence: probable
  review: draft
  note: >-
    The Latmian Gulf, open from Miletus to Herakleia and up to Myus; now the Maeander
    plain, with Lake Bafa its last remnant. The delta advanced about 1 km within the
    window, so the line (the turn of the eras) is its end more than its start. Lade
    is an island, as Strabo has it. Miletus's own ground is buried in the same silt,
    so its peninsula is kept dry by hand. Priene comes out 2 km from the water: by
    the 90s BCE it had no harbour on the open sea, and Strabo puts it 40 stades from
    it; the figure puts water a little nearer.

- id: ephesus-coast
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: stock-2013, locator: 'fig. 1, the "1st c. BC" shore and the "0 AD/BC" front' }
    - { source: kraft-2007, locator: 'fig. 12; pp. 134, 138' }
    - { source: strabo, locator: '14.1.24: Attalus II’s mole' }
    - { source: livy, locator: '37.14–15: the harbour mouth like a river' }
    - { source: mapterhorn, locator: 'z12 terrain below 10 m seaward of the shore' }
  confidence: probable
  review: draft
  note: >-
    The Cayster delta west of Ephesus, drawn halfway between the shore of the early
    1st century BCE and the delta front of 0 CE: it advanced about 1.5 km within the
    window, so any single line is loose. North of Syrie (Kuru Tepe) the line across
    the plain is ours.

- id: malian-gulf
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: kraft-1987, locator: 'fig. 14, the shoreline of 480 BCE; p. 189 on the pass' }
    - { source: vouvalidis-2010, locator: '8–10 km of advance since 480 BCE (abstract)' }
    - { source: livy, locator: '36.15–18: swamp and quicksand between the defences and the sea' }
    - { source: herodotus, locator: '7.176, 7.198–200' }
    - { source: mapterhorn, locator: 'z12 terrain below 30 m seaward of the shore' }
  confidence: uncertain
  review: needs-check
  note: >-
    The Malian Gulf reached far up what is now the Spercheios plain. No shoreline is
    dated to the 1st century BCE: this is Kraft's 480 BCE line with the gulf's head
    moved 1.5 km east, at the steady rate the 8–10 km since then implies, and at the
    pass set a quarter of a kilometre off the cliff, for the marsh and shoal that by
    191 BCE a Roman army could stand on. Probable at the pass, uncertain at the head.

# --- ancient coasts: Africa and Egypt -----------------------------------------

- id: gulf-of-utica
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: pleuger-2019, locator: 'fig. 7 panel 2 ("2600 BC–1st c. AD"), fig. 1c' }
    - { source: delile-2015, locator: 'figs. 1–2' }
    - { source: ben-mosbah-sebkhet-ariana, locator: 'fig. 7B: Sebkhet Ariana open to the gulf until about 1300 BP' }
    - { source: caesar-bc, locator: '2.24: Castra Cornelia' }
    - { source: livy, locator: '29.35: Utica washed by the sea on one side' }
    - { source: mapterhorn, locator: 'z11 terrain below 8 m seaward of the shore' }
  confidence: probable
  review: draft
  note: >-
    The bay the Bagradas has filled since: open from Utica to Jebel Ennadhour, with
    no Ghar el-Melh lagoon yet, and Sebkhet Ariana a lagoon open to the Gulf of
    Tunis. The corridor between Utica and Kalaat el-Andalous was emerging in the
    1st century BCE and is drawn as the shallow water it still mostly was. Probable
    from Ghar el-Melh round to Castra Cornelia; the southern compartment's coast,
    with no dated figure, is ours and uncertain. Relative sea level was about 0.6 m
    lower (Pleuger), which the map does not apply.

- id: lake-mareotis
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: crepy-boussac-2021, locator: 'fig. 7: the western basins separate in the Hellenistic and early Roman periods' }
    - { source: flaux-2021 }
    - { source: strabo, locator: '17.1.7' }
    - { source: mapterhorn, locator: 'z11 terrain below 0 m in the eastern basin' }
  confidence: uncertain
  review: needs-check
  note: >-
    The main lake east of Marea, fed from the Canopic branch and cut off from the
    sea. Its bed is reclaimed and pumped below sea level today, so the lake is drawn
    to 0 m; its level in the window was lower than the Roman peak and is not known
    to a metre. West of Marea the basins were separate and filled only by winter
    rain; they are left out.

- id: canopic-coast
  op: remove-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: flaux-2021, locator: 'fig. 1, the coastline in antiquity' }
    - { source: goddio-heracleion }
    - { source: strabo, locator: '17.1.16–18: Canopus and Heracleion' }
  confidence: probable
  review: draft
  note: >-
    The Canopic promontory, 3–7 km of land now under Aboukir Bay: Eastern Canopus
    and Heracleion–Thonis at the Canopic mouth. Heracleion had partly collapsed about
    100 BCE; Canopus stood on dry land until it sank by the 8th century CE.

- id: alexandria-heptastadion
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: strabo, locator: '17.1.6: Pharos, the Heptastadion, the two harbours' }
  confidence: uncertain
  review: needs-check
  note: >-
    Pharos was an island joined to the city only by the Heptastadion; the broad
    tombolo the modern city stands on was harbour water either side of it. This is
    the western harbour (Eunostos). The causeway's ends are inferred to ±0.3 km and
    the outline is ours. The eastern harbour's sunken quarters (Antirhodos, the
    palaces, Cape Lochias, now 5–7 m down) are a band too narrow for this map.

- id: alexandria-great-harbour
  op: add-water
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: strabo, locator: '17.1.6' }
  confidence: uncertain
  review: needs-check
  note: The Great Harbour's side of the tombolo, as alexandria-heptastadion.

