# Kingdoms drawn as their capital rather than as territory, because nobody can
# say where they ended. Every published polygon for these dynasts that
# cicero-map found was a thirty-two-segment ellipse given a scholarly citation,
# so the map marks the seat of power instead.
#
# September 2026: Galatia, Cappadocia, Commagene, Judaea, Emesa, Ituraea and
# Tarcondimotus' Amanus are now drawn as territory, from their frontiers in the
# ancient geographers and the scholarship (atoms.yaml), and their seats are
# gone. Osroene stays a seat: its extent east of the Euphrates is not known.
#
# Migrated from cicero-map/data/seats.json, which gave a confidence but no
# source; each row now cites its polity's source. Its seats spanned the whole
# 68–43 BCE window, hence the open ends. The seat's position is its place's
# (places.yaml), which is Pleiades' where the place is joined to Pleiades.
# cicero-map's own seat coordinates agree with Pleiades to within 1.5 km for the
# six that join.

- polity: osroene
  place: edessa
  from: before 68 BCE
  to: after 43 BCE
  sources: [{ source: sullivan-1990 }, { source: cicero-map, locator: data/seats.json }]
  confidence: certain
  review: draft
