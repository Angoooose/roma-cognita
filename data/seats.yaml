# Kingdoms drawn as their capital rather than as territory. These are the
# dynasts whose extent no open dataset gives credibly — every published polygon
# for Galatia, Cappadocia, Commagene or Nabataea that cicero-map could find was
# a thirty-two-segment ellipse drawn around a centroid and given a scholarly
# citation. So the map marks the seat of power and says nothing about where the
# kingdom ended. The capitals are well located; the kingdoms are not.
#
# Migrated from cicero-map/data/seats.json, which gave a confidence but no
# source; each row now cites its polity's source. Its seats spanned the whole
# 68–43 BCE window, hence the open ends. The seat's position is its place's
# (places.yaml), which is Pleiades' where the place is joined to Pleiades.
# cicero-map's own seat coordinates agree with Pleiades to within 1.5 km for the
# six that join.

- polity: galatia
  place: ancyra
  from: before 68 BCE
  to: after 43 BCE
  sources:
    - { source: cicero-deiotaro }
    - { source: cicero-map, locator: data/seats.json }
  confidence: certain
  review: needs-check
  note: >-
    Migration review: Ancyra was the chief town of the Tectosages, but
    Deiotarus' own strongholds were Blucium and Peium (Strabo 12.5.2), and he
    ruled all Galatia only late in his reign. Whether Ancyra is the right mark
    for Deiotarus' court in this window wants checking.

- polity: cappadocia
  place: mazaca
  from: before 68 BCE
  to: after 43 BCE
  sources: [{ source: sullivan-1990 }, { source: cicero-map, locator: data/seats.json }]
  confidence: certain
  review: draft

- polity: commagene
  place: samosata
  from: before 68 BCE
  to: after 43 BCE
  sources: [{ source: sullivan-1990 }, { source: cicero-map, locator: data/seats.json }]
  confidence: certain
  review: draft

- polity: judaea
  place: hierosolyma
  from: before 68 BCE
  to: after 43 BCE
  sources: [{ source: cicero-map, locator: data/seats.json }]
