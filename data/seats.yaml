- polity: emesa
  place: emesa
  from: before 68 BCE
  to: after 43 BCE
  sources:
    - { source: sullivan-1990 }
    - { source: cicero-map, locator: data/seats.json }
  confidence: certain
  review: needs-check
  note: >-
    Migration review: Strabo (16.2.10) places the seat of Sampsiceramus and
    Iamblichus at Arethusa, not Emesa, which became the dynasty's city later.
    Check before trusting this mark in the 60s–40s.

- polity: cilicia-tracheia
  place: hierapolis-castabala
  from: before 68 BCE
  to: after 43 BCE
  sources:
    - { source: sullivan-1990 }
    - { source: cicero-map, locator: data/seats.json }
  confidence: probable
  review: draft
  note: Tarcondimotus' seat; the identification is standard but not beyond dispute.

- polity: ituraea
  place: chalcis-sub-libano
  from: before 68 BCE
  to: after 43 BCE
  sources:
    - { source: sullivan-1990 }
    - { source: cicero-map, locator: data/seats.json }
  confidence: uncertain
  review: needs-check
  note: >-
    (cicero-map: check.) The site of Chalcis sub Libano is not securely
    identified. Marked so the kingdom is not silently omitted, but the position
    is the weakest in the dataset.
