# Kingdoms drawn as their capital rather than as territory, because nobody can
# say where they ended. The published polygons for these dynasts are
# schematic ellipses given a scholarly citation, so the map marks the seat of
# power instead.
#
# September 2026: Galatia, Cappadocia, Commagene, Judaea, Emesa, Ituraea and
# Tarcondimotus' Amanus are now drawn as territory, from their frontiers in the
# ancient geographers and the scholarship (atoms.yaml), and their seats are
# gone. Osroene stays a seat: its extent east of the Euphrates is not known.
#
# Each row cites its polity's source and spans the whole 68–27 BCE window,
# hence the open ends. The seat's position is its place's (places.yaml), which
# is Pleiades'.

- polity: osroene
  place: edessa
  from: before 68 BCE
  to: after 27 BCE
  sources: [{ source: sullivan-1990 }]
  confidence: certain
  review: draft

# Added September 2026 (the extension to 133): the two slave kingdoms of Sicily,
# whose extent inside the province nobody records.

- polity: sicily-eunus
  place: enna
  from: before 133 BCE
  to: 133 BCE
  sources:
    - { source: diodorus, locator: '34/35.2.10–24' }
    - { source: strabo, locator: '6.2.6' }
  confidence: certain
  review: draft
  note: Eunus' city from the rising of c. 135 until Rupilius took it in 132.

- polity: sicily-tryphon
  place: triocala
  from: { earliest: 104 BCE, latest: 103 BCE }
  to: 101 BCE
  sources:
    - { source: diodorus, locator: '36.7.2–4' }
  confidence: probable
  review: draft
  note: >-
    Tryphon's royal city, walled and given a palace and a market place
    (Diodorus 36.7.3); the site is Pleiades' doubtful identification.
