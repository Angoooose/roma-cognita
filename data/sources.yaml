    dataset of roads of the Roman Empire, static version 2024 (Scientific Data,
    2025)
  url: https://doi.org/10.5281/zenodo.17122148
  licence: CC BY 4.0
  usedBy: pipeline/src/roads/build.ts, pipeline/src/rome/streets.ts
  note: >-
    Roads, drawn only where the source dates their construction to 27 BCE or
    earlier (pipeline/src/roads). Its GeoJSON is EPSG:3395, not 4326. On the plan
    of Rome its consular roads are drawn up to the gate each left by, and no
    further; locators there are its line names ("Tarracinae-Rome").

