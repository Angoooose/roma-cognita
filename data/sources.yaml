# Every work and dataset the records cite. A record points here by id and adds
# a locator (volume, page, map, chapter, fragment). Datasets carry their licence,
# because the attribution screen is generated from this file and because a
# re-licensed build must be able to drop anything whose terms it cannot meet.
#
# `kind`: ancient — a text from antiquity; modern — scholarship and atlases,
# cited and never copied; dataset — machine-readable data the pipeline ingests.

# --- compilations --------------------------------------------------------------

- id: cicero-map
  kind: modern
  citation: cicero-map, the predecessor of this project — data/*.json (September 2026)
  note: >-
    Cited as provenance, not as authority. Where a migrated record carries only
    this source, cicero-map gave a reason (an event, a statute) rather than a
    work, and the reason is kept in the record's note. The validator lists every
    such record so it can be sourced properly.

