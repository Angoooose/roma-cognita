# --- datasets ------------------------------------------------------------------

- id: natural-earth
  kind: dataset
  citation: Natural Earth, 1:10m physical vectors — land
  url: https://www.naturalearthdata.com/
  licence: public domain
  note: >-
    Land (ne_10m_land plus ne_10m_minor_islands) is what every atom outline is
    clipped to (pipeline/src/atoms/land.ts). The map draws the OSM coast; the
    political bake gives the slivers between the two to the nearest atom.

- id: pleiades
  kind: dataset
  citation: Pleiades, a gazetteer of past places
  url: https://pleiades.stoa.org/
  licence: CC-BY-3.0
  note: Locators are the place path, e.g. places/423025.

