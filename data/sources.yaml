    partitions ("partizioni archeologiche") of street infrastructure, fetched through
    its WFS
  url: https://www.archeositarproject.it/en/piattaforma/open-data/
  licence: CC-BY-SA-4.0
  note: >-
    Every piece of ancient street an excavation in Rome has found (paving, kerbs,
    ramps, steps), outlined where it was found and dated. Locators are its numbers
    (codice PA). The pieces in and around the Servian Wall that may have stood in
    68–27 BCE are copied into data/geometry/rome-sitar.geojson (pipeline/src/rome/
    sitar.ts), with the date they were fetched. Most are dated only "Roman" (509
    BCE–476 CE). Some are SITAR's own digitising of Lanciani's Forma Urbis Romae
    (1893–1901), which it says in the piece's description.
    The heights it records of what excavations found (its altimetry) give the
    ancient valley floors: those on ground walked on are copied into
    data/geometry/rome-levels.geojson, with the piece each belongs to.
    Its reconstruction of the Servian Wall's whole course (19694, made for the
    2017 "Roma medio repubblicana" conference) and the pieces of the wall, its
    agger, ditch and gates are copied into data/geometry/rome-servian.geojson: the
    model's wall stands on that course (pipeline/src/rome/servian.ts).
    The pieces of the consular roads' paving outside the wall that the model's roads
    pass through, and its reconstructions of three of their courses (the Via
    Flaminia, 16890; the Appia's first mile, 19681; the Latina, 19682), are copied
    into data/geometry/rome-roads.geojson (pipeline/src/rome/roads.ts).

