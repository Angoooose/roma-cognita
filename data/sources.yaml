# --- the city of Rome (the plan, DESIGN.md §7.7) ------------------------------
# Added September 2026 for data/places/rome.yaml. Dates come from Platner &
# Ashby, each article checked on LacusCurtius; outlines from OpenStreetMap, which
# traces what survives on the ground today (the record says when that is a later
# rebuilding on the same site); locations from Pleiades where it has the monument.

- id: platner-ashby
  kind: modern
  citation: >-
    S. B. Platner, completed and revised by T. Ashby, A Topographical Dictionary
    of Ancient Rome (London: Oxford University Press, 1929)
  url: https://penelope.uchicago.edu/Thayer/E/Gazetteer/Places/Europe/Italy/Lazio/Roma/Rome/_Texts/PLATOP*/home.html
  note: >-
    Public domain; transcribed on LacusCurtius by B. Thayer, one page per article.
    Locators are the article's page there and its pages in the book ("Pons
    Fabricius, p. 400"), and link to it. Its dates are the ancient sources' and
    have stood; its identifications predate the excavations of the 1930s (Largo
    Argentina, the Forum Boarium temples), which is why those monuments are not
    yet drawn.
  usedBy: pipeline/src/rome/model.ts

- id: osm-rome
  kind: dataset
  citation: >-
    OpenStreetMap contributors, outlines of ancient monuments in Rome, fetched
    through the Overpass API
  url: https://www.openstreetmap.org/
  licence: ODbL-1.0
  note: >-
    Locators are OpenStreetMap elements ("way/131451564") and link to them. The
    outlines are of the remains as they stand, surveyed on modern imagery, so a
    temple rebuilt in the empire on its republican podium is outlined as rebuilt.
    Copied into data/geometry/rome.geojson with the date it was fetched.

# --- the generated city of Rome (DESIGN.md §7.7) -------------------------------
# Added September 2026. No record cites these: they are the methods and the
# evidence the generated streets, blocks and lots follow (pipeline/src/rome/city.ts).
# None of it is traced; the figures are comparanda, several from other cities.

- id: vanegas-2012
  kind: modern
  citation: >-
    C. A. Vanegas, T. Kelly, B. Weber, J. Halatsch, D. G. Aliaga and P. Müller,
    "Procedural Generation of Parcels in Urban Modeling", Computer Graphics Forum
    31.2 (2012)
  url: https://onlinelibrary.wiley.com/doi/abs/10.1111/j.1467-8659.2012.03047.x
  usedBy: pipeline/src/rome/city.ts
  note: >-
    The lots: strips along each street edge of a block, cut to a depth and split
    along the street, the corners mitred, the middle left as courtyards.

- id: emilien-2012
  kind: modern
  citation: >-
    A. Emilien, A. Bernhardt, A. Peytavie, M.-P. Cani and E. Galin, "Procedural
    Generation of Villages on Arbitrary Terrains", The Visual Computer 28 (2012)
  url: https://perso.liris.cnrs.fr/eric.galin/Articles/2012-villages.pdf
  usedBy: pipeline/src/rome/city.ts
  note: >-
    With Galin et al. 2011, the main streets: cheapest paths over the terrain that
    shun slopes, so they follow the valleys.

- id: galin-2011
  kind: modern
  citation: >-
    E. Galin, A. Peytavie, E. Guérin and B. Beneš, "Authoring Hierarchical Road
    Networks", Computer Graphics Forum 30.7 (2011)
  url: https://onlinelibrary.wiley.com/doi/10.1111/j.1467-8659.2011.02055.x
  usedBy: pipeline/src/rome/city.ts

- id: dylla-2009
  kind: modern
  citation: >-
    K. Dylla, B. Frischer, P. Müller, A. Ulmer and S. Haegler, "Rome Reborn 2.0: A
    Case Study of Virtual City Reconstruction Using Procedural Modeling
    Techniques", Computer Applications and Quantitative Methods in Archaeology
