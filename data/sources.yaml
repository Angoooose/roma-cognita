    transcribed in Sumner 1978, 218; Roman Statutes itself was not opened.
    Sumner dates the law late in 100 or early in 99 (pp. 219, 225), not
    101/100. English renderings in the notes are ours from his Greek, not
    quotations. Its naming of the kings of Egypt, Cyprus and Cyrene (Delphi
    copy, SEG III 378) and "the king who holds Cyprus" (Cnidus copy, SEG XXVI
    1227) are as Bennett (Egyptian Royal Genealogy, "Ptolemy Apion") reports
    them.

- id: diophantus-decree
  kind: ancient
  citation: >-
    Decree of Chersonesus in honour of Diophantus, general of Mithridates VI,
    c. 107 BCE (IOSPE I² 352)
  url: http://www.chersonesos.org/?p=museum_coll_ep1&l=eng
  note: >-
    Read in the English translation on the Chersonesos museum's page, by N.
    Khrapunov, which heads the text with V. V. Latyshev's Russian translation
    and E. I. Solomonik's commentary; quotations are Khrapunov's English. The
    decree is dated only
    by the city's eponym; c. 107 and the campaigns of c. 110–107 are the usual
    modern dating, not the stone's.

