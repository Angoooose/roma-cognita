    UN-ESCWA and BGR, Inventory of Shared Water Resources in Western Asia
    (Beirut, 2013), chapter on the Tigris basin
  note: Describes the Wadi Tharthar flood-relief scheme, which diverted the Tigris
    into the Tharthar depression from 1956.

# --- the city of Rome (the plan, DESIGN.md §7.7) ------------------------------
# Added September 2026 for data/places/rome.yaml. Dates come from Platner &
# Ashby, each article checked on LacusCurtius; outlines from OpenStreetMap, which
# traces what survives on the ground today (the record says when that is a later
# rebuilding on the same site); locations from Pleiades where it has the monument.

- id: platner-ashby
  kind: modern
  citation: >-
    S. B. Platner, completed and revised by T. Ashby, A Topographical Dictionary
    of Ancient Rome (London: Oxford University Press, 1929)
  url: https://penelope.uchicago.edu/Thayer/E/Gazetteer/Places/Europe/Italy/Lazio/Roma/Rome/_Texts/PLATOP*/home.html
  note: >-
    Public domain; transcribed on LacusCurtius by B. Thayer, one page per article.
    Locators are the article's page there and its pages in the book ("Pons
    Fabricius, p. 400"), and link to it. Its dates are the ancient sources' and
    have stood; its identifications predate the excavations of the 1930s (Largo
    Argentina, the Forum Boarium temples), which is why those monuments are not
    yet drawn.
  usedBy: pipeline/src/rome/model.ts

- id: sitar
  kind: dataset
  citation: >-
    SITAR, Sistema Informativo Territoriale Archeologico di Roma (Soprintendenza
    Speciale Archeologia Belle Arti e Paesaggio di Roma): the archaeological
    partitions ("partizioni archeologiche") of street infrastructure, fetched through
    its WFS
  url: https://www.archeositarproject.it/en/piattaforma/open-data/
  licence: CC-BY-SA-4.0
  note: >-
    Every piece of ancient street an excavation in Rome has found (paving, kerbs,
    ramps, steps), outlined where it was found and dated. Locators are its numbers
    (codice PA). The pieces in and around the Servian Wall that may have stood in
    68–27 BCE are copied into data/geometry/rome-sitar.geojson (pipeline/src/rome/
    sitar.ts), with the date they were fetched. Most are dated only "Roman" (509
    BCE–476 CE). Some are SITAR's own digitising of Lanciani's Forma Urbis Romae
    (1893–1901), which it says in the piece's description.
    The heights it records of what excavations found (its altimetry) give the
    ancient valley floors: those on ground walked on are copied into
    data/geometry/rome-levels.geojson, with the piece each belongs to.

- id: digital-augustan-rome
  kind: modern
  citation: >-
    D. G. Romano et al., Digital Augustan Rome (University of Arizona,
    Archaeological Mapping Lab), the successor to L. Haselberger, D. G. Romano and
    E. A. Dumser (eds.), Mapping Augustan Rome, JRA Supplement 50 (2002)
  url: https://www.digitalaugustanrome.org/
  note: >-
    A plan of the city in 14 CE, its streets "attested / hypothetical", with an
    entry for each. Read as a scholarly source for which streets there were and
    roughly where; none of its drawing is copied, since it carries no licence.
    Locators are its entry titles.

- id: osm-rome
  kind: dataset
  citation: >-
    OpenStreetMap contributors, outlines of ancient monuments in Rome, fetched
    through the Overpass API
  url: https://www.openstreetmap.org/
  licence: ODbL-1.0
  note: >-
    Locators are OpenStreetMap elements ("way/131451564") and link to them. The
    outlines are of the remains as they stand, surveyed on modern imagery, so a
    temple rebuilt in the empire on its republican podium is outlined as rebuilt.
    Copied into data/geometry/rome.geojson with the date it was fetched.

# --- the generated city of Rome (DESIGN.md §7.7) -------------------------------
# Added September 2026. No record cites these: they are the methods and the
# evidence the generated streets, blocks and lots follow (pipeline/src/rome/city.ts).
# None of it is traced; the figures are comparanda, several from other cities.

- id: vanegas-2012
  kind: modern
  citation: >-
    C. A. Vanegas, T. Kelly, B. Weber, J. Halatsch, D. G. Aliaga and P. Müller,
    "Procedural Generation of Parcels in Urban Modeling", Computer Graphics Forum
    31.2 (2012)
  url: https://onlinelibrary.wiley.com/doi/abs/10.1111/j.1467-8659.2012.03047.x
  usedBy: pipeline/src/rome/city.ts
  note: >-
    The lots: strips along each street edge of a block, cut to a depth and split
    along the street, the corners mitred, the middle left as courtyards.

- id: emilien-2012
  kind: modern
  citation: >-
    A. Emilien, A. Bernhardt, A. Peytavie, M.-P. Cani and E. Galin, "Procedural
    Generation of Villages on Arbitrary Terrains", The Visual Computer 28 (2012)
  url: https://perso.liris.cnrs.fr/eric.galin/Articles/2012-villages.pdf
  usedBy: pipeline/src/rome/city.ts
  note: >-
    With Galin et al. 2011, the main streets: cheapest paths over the terrain that
    shun slopes, so they follow the valleys. And the lanes grown one off another
    (growth.ts).

- id: weber-2009
  kind: modern
  citation: >-
    B. Weber, P. Müller, P. Wonka and M. Gross, "Interactive Geometric Simulation
    of 4D Cities", Computer Graphics Forum 28.2 (2009)
  url: http://www.peterwonka.net/Publications/pdfs/2009.EG.Weber.UrbanSimulation.FinalVersion.pdf
  usedBy: pipeline/src/rome/growth.ts
  note: >-
    The lanes: grown off the streets already there, and made to meet a street
    just ahead, end in a junction close by, and keep off one another.

- id: chen-2008
  kind: modern
  citation: >-
    G. Chen, G. Esch, P. Wonka, P. Müller and E. Zhang, "Interactive Procedural
    Street Modeling", ACM Transactions on Graphics 27.3 (2008)
  url: https://web.engr.oregonstate.edu/~zhange/images/street_sig08.pdf
  usedBy: pipeline/src/rome/growth.ts
  note: >-
    The one field of directions the lanes follow: along the contours on a slope,
    and square or parallel to the streets round them elsewhere.

- id: courtat-2011
  kind: modern
  citation: >-
    T. Courtat, C. Gloaguen and S. Douady, "Mathematics and Morphogenesis of
    Cities: A Geometrical Approach", Physical Review E 83 (2011)
  url: https://arxiv.org/abs/1010.1762
  usedBy: pipeline/src/rome/growth.ts
  note: >-
    A lane carried on across a street from one opposite, so that streets continue
    through junctions as the streets of grown towns do.

- id: galin-2011
  kind: modern
  citation: >-
    E. Galin, A. Peytavie, E. Guérin and B. Beneš, "Authoring Hierarchical Road
    Networks", Computer Graphics Forum 30.7 (2011)
  url: https://onlinelibrary.wiley.com/doi/10.1111/j.1467-8659.2011.02055.x
  usedBy: pipeline/src/rome/city.ts

- id: dylla-2009
  kind: modern
  citation: >-
    K. Dylla, B. Frischer, P. Müller, A. Ulmer and S. Haegler, "Rome Reborn 2.0: A
    Case Study of Virtual City Reconstruction Using Procedural Modeling
    Techniques", Computer Applications and Quantitative Methods in Archaeology
    (CAA 2009)
  url: https://proceedings.caaconference.org/files/2009/09_Dylla_et_al_CAA2009.pdf
  usedBy: pipeline/src/rome/city.ts
  note: >-
    How Rome Reborn built its generic buildings: masses scanned from Gismondi's
    model, detailed by rules from archaeological plans, counted by region from
    the regionary catalogues. The lesson taken: a plausible block plan first.

- id: forma-urbis-stanford
  kind: modern
  citation: >-
    Stanford Digital Forma Urbis Romae Project: the Severan Marble Plan of Rome
    (203–211 CE), its fragments
  url: https://formaurbis.stanford.edu/
  usedBy: pipeline/src/rome/city.ts
  note: >-
    Rows of shops on the streets, blocks of flats of small rooms round courtyards,
    atrium houses beside them, built wall to wall (e.g. fragment 10g, the Subura).
    Imperial, not Republican.

- id: reynolds-expedition
  kind: modern
  citation: >-
    D. W. Reynolds, "The Lost Architecture of Ancient Rome", Expedition (Penn
    Museum)
  url: https://www.penn.museum/sites/expedition/the-lost-architecture-of-ancient-rome/
  usedBy: pipeline/src/rome/city.ts
  note: >-
    What the Marble Plan shows of ordinary buildings: shops flanking house doors,
    flats round courtyards, rich and poor side by side.

- id: poehler-2017
  kind: modern
  citation: E. E. Poehler, The Traffic Systems of Pompeii (Oxford, 2017)
  url: https://bmcr.brynmawr.edu/2018/2018.09.22/
  usedBy: pipeline/src/rome/city.ts
  note: >-
    Pompeii's streets mostly 2–4 m wide and one lane, the main ones about 7 m: the
    local and main street widths (the URL is the BMCR review).

- id: pecs-cosa
  kind: modern
  citation: >-
    R. Stillwell (ed.), The Princeton Encyclopedia of Classical Sites
    (Princeton, 1976), "Cosa"
  url: https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.04.0006:entry=cosa
  usedBy: pipeline/src/rome/city.ts
  note: >-
    A Latin colony of 273 BCE: blocks about 35 m by 80 m between streets of about
    4 m — the block sizes the valleys are split down to.

- id: livy
  kind: ancient
  citation: Livy, Ab Urbe Condita
  url: https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0026:book%3D5:chapter%3D55
  usedBy: pipeline/src/rome/city.ts
  note: >-
    5.55: Rome rebuilt after the Gallic sack with no care for straight streets,
    "casually built upon … rather than regularly planned". 21.62: a third storey
    in 218 BCE.

- id: tacitus-ann
  kind: ancient
  citation: Tacitus, Annales
  url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Tacitus/Annals/15B*.html
  usedBy: pipeline/src/rome/city.ts
  note: >-
    15.38: before 64 CE, "narrow, twisting lanes and formless streets"; 15.43:
    Nero's rule that each building have its own walls, implying shared walls
    before.

- id: varro-ll
  kind: ancient
  citation: Varro, De Lingua Latina
  usedBy: pipeline/src/rome/city.ts
  note: 5.145–146, the kinds of street, from via and vicus to angiportum and the dead-end fundula.

- id: cicero-agr
  kind: ancient
  citation: Cicero, De Lege Agraria
  url: https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.02.0013:text=Agr.:speech=2:chapter=35:section=96
  usedBy: pipeline/src/rome/city.ts
  note: >-
    2.96 (63 BCE): Rome "raised up and hanging on its upper floors", "non optimis
    viis, angustissimis semitis" — tall and crowded in the late Republic.

- id: vitruvius
  kind: ancient
  citation: Vitruvius, De Architectura
  url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Vitruvius/2*.html
  usedBy: pipeline/src/rome/city.ts
  note: >-
    2.8.17: Rome builds upward for want of ground; 6.3: the atrium house.

# --- the aqueducts of Rome (DESIGN.md §7.7) --------------------------------------
# Added September 2026 for the aqueduct records in places/rome.yaml and their
# courses and arcades (pipeline/src/rome/aqueducts.ts).

- id: frontinus
  kind: ancient
  citation: Frontinus, De Aquaeductu Urbis Romae
  url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Frontinus/De_Aquis/Bennett/1*.html
  usedBy: pipeline/src/rome/aqueducts.ts
  note: >-
    Book 1: each aqueduct's builders and date, its length in paces with how much
    runs underground, on substructures and on arches (1 pace = 1.485 m), where it
    enters the city, the order of their levels (1.18), and the Marcia, Tepula and
    Julia on one arcade, Julia topmost (1.19). Bennett's Loeb translation on
    LacusCurtius; the Latin is on the same site.

- id: ashby-1935
  kind: modern
  citation: T. Ashby, The Aqueducts of Ancient Rome (Oxford, 1935)
  url: https://archive.org/details/1935TheAqueductsOfAncientRomeThomasAshby
  usedBy: pipeline/src/rome/aqueducts.ts
  note: >-
    The courses near Rome from the remains, the construction and measurements of
    the Republican arcades (piers of tufa, voussoirs of peperino, spans of about
    5.4 m), and the surveyed levels of each channel. Locators are the book's pages.

# --- the houses of the model of Rome (DESIGN.md §7.7) ----------------------------
# Added September 2026 for the doors, shops, windows and tiled roofs painted on the
# generated houses (packages/engine/src/rome/ModelLayer.ts). The patterns are
# illustrative; these are the evidence for what they show.

- id: wallace-hadrill-1994
  kind: modern
  citation: >-
    A. Wallace-Hadrill, Houses and Society in Pompeii and Herculaneum (Princeton,
    1994)
  url: https://press.princeton.edu/books/paperback/9780691029092/houses-and-society-in-pompeii-and-herculaneum
  usedBy: packages/engine/src/rome/ModelLayer.ts
  note: >-
    The house front of the two towns: the door into the atrium, shops either side
    of it, few windows onto the street. Pompeii and Herculaneum as they were buried
    in 79 CE, so comparanda for Republican Rome, not evidence of it.

- id: ellis-2018
  kind: modern
  citation: >-
    S. J. R. Ellis, The Roman Retail Revolution: The Socio-Economic World of the
    Taberna (Oxford, 2018)
  url: https://global.oup.com/academic/product/the-roman-retail-revolution-9780198769934
  usedBy: packages/engine/src/rome/ModelLayer.ts
  note: >-
    The taberna: a single room open to the street across most of its width, in rows
    along the street fronts. Its shuttered thresholds spread mostly under the
    empire, after the window, so the model draws the shops as plain openings.
