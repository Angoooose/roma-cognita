- id: mapterhorn
  kind: dataset
  citation: Mapterhorn terrain tiles (Terrarium encoding), mostly Copernicus GLO-30 in these regions
  url: https://mapterhorn.com/
  licence: various open (per-source; Copernicus DEM licence for GLO-30) — terms of the hosted tiles unverified
  usedBy: pipeline/src/rome/plate.ts
  note: >-
    Offline input to derive-floodplains, z10 (~70 m). Heights are whole metres at
    z≤11. It is a surface model, so towns stand up. Also the contours on the plan of
    Rome, from z13 (~19 m) smoothed over ~45 m so the modern city's buildings do not
    trace themselves: the relief is today's, a few metres above the ancient ground.

- id: itinere
  kind: dataset
