      supports: [of, from]
    - source: livy-per
      locator: '93'
      quote: >-
        King Nicomedes of Bithynia made the Roman nation his heir and his kingdom
        was transformed into a province.
      supports: [type, of]
    - source: appian
      locator: 'Mithr. 71'
      quote: >-
        Nicomedes had lately died childless and bequeathed his kingdom to the
