# How polities stood to one another over time: `polity` is `type` `of` another.
# Province and client standing are kept apart from the polity so they can be
# dated separately from it and from the ground it held — Egypt was a kingdom
# throughout, a client only from some point in the window.
#
# Province rows run from the province's creation. A client row runs from when
# the standing began where that is known, and otherwise across the whole
# 133–27 window.

