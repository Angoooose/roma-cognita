    - { source: appian, locator: 'BC 1.39' }
  confidence: certain
  review: draft
  note: >-
    The allies were bound to Rome by treaty, sovereign at home but without
    the right of war and peace, which was Rome's, and owed troops by the list
    of the togati (Beloch pp. 201–215). Subject rather than allied, so the map
    draws them as a washed shade of Rome, the way the atlases draw Roman Italy
    before the Social War, and not as a dozen independent powers.

