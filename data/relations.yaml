# --- added September 2026: the neighbours of Rome ------------------------------

- polity: lycia
  type: allied-to
  of: rome
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - source: appian
      locator: 'Mithr. 61'
      quote: >-
        Sulla bestowed freedom on the inhabitants of Ilium , Chios , Lycia ,
        Rhodes , Magnesia , and some others, either as a reward for their
        cooperation, or a recompense for what they had bravely suffered on his
        account, and inscribed them as friends of the Roman people.
      supports: [type, of]
    - source: mitchell-2005
      locator: 'SEG 55.1452, preamble'
      url: https://www.attalus.org/docs/seg/s55_1452.html
      quote: >-
        [this oath] was accomplished on the 9th day before the Kalends of
        Sextilis {24 July 46 B.C.} according to the law of Caesar in the comitium
        [by the Romans] and Lycians
      supports: [of]
    - source: appian
      locator: 'BC 4.61'
      quote: >-
        The Rhodians and the Lycians said that they would help neither Cassius
        nor Brutus in civil wars
      supports: []
    - source: cassius-dio
      locator: '47.33.1'
      quote: >-
        Ariobarzanes , the Rhodians , and the Lycians , while not opposing them,
        were yet unwilling to form an alliance with them.
      supports: []
    - source: appian
      locator: 'BC 5.7'
      quote: >-
        He released the Lycians from taxes altogether, and urged the rebuilding of
        Xanthus .
      supports: []
    - source: strabo
      locator: '14.3.3'
      quote: >-
        In earlier times they would deliberate about war and peace and alliances,
        but now they naturally do not do so, since these matters necessarily lie
        in the power of the Romans … they remained ever free under the Romans,
        thus retaining their ancestral usages
      supports: []
  confidence: certain
  review: draft
  note: >-
    Whether Lycia was Rome's ally or a free state under her is an open question
    for the project's owner. The treaty of 46 (Mitchell's text, of which only
    the preamble and the territorial clauses are online) is sworn by Romans and
    Lycians; Strabo has them free but no longer making their own alliances. No
    open text found shows the alliance in force at 133: the Lycian League's
    dedication to Roma on the Capitol (OGIS 551) speaks only of goodwill and
    is dated c. 150 or c. 80.

- polity: rhodus
  type: allied-to
  of: rome
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - source: livy-per
      locator: '46'
      quote: >-
        At their request, an alliance was concluded with the Rhodians .
      supports: [type, of, from]
    - source: livy-per
      locator: '78'
      quote: >-
        He attacked the city of Rhodes , which alone had remained faithful to the
        Roman people
      supports: [type, of, from]
    - source: appian
      locator: 'BC 4.66'
      quote: >-
        not to disregard the treaty which existed between the Rhodians and the
        Romans which bound them not to bear arms against each other.
      supports: [type, of]
    - source: appian
      locator: 'BC 4.70'
      quote: >-
        treaties made with you by Gaius Caesar , the founder of the present
        monarchy, — yet these very treaties say that the Romans and the Rhodians
        shall assist each other in case of need.
      supports: [type, of]
    - source: strabo
      locator: '14.2.5'
      quote: >-
        became a friend to the Romans and to all kings who favoured both the
        Romans and the Greeks. Consequently it not only has remained autonomous.
      supports: [to]
    - { source: fraser-bean-1954 }
  confidence: certain
  review: draft
  note: >-
    The alliance concluded in 164 (Per. 46) stood in 88, when Rhodes "alone had
    remained faithful" (Per. 78), and was renewed through Caesar (App. BC
    4.68–70). Cassius' storming of Rhodes in 43/42 was a Roman faction against
    an ally; the triumvirs rewarded the island (App. BC 5.7).

