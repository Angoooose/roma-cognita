      supports: [type, of]
    - source: cassius-dio
      locator: '53.12.4'
      quote: >-
        Bithynia with Pontus which adjoined it, Sardinia and Baetica were held to
        belong to the people and the senate
      supports: [type, of, to]
    - source: magie-1950
      locator: 'vol. I, p. 320'
      url: https://archive.org/download/RRAM01Magie1950/RRAM01_Magie_1950_djvu.txt
      quote: >-
        When he died, in 74, it was found that he had bequeathed his king- dom to
        the Roman people. … ordered the governor of Asia, Marcus Juncus, to take
        over Bithynia and organize it as a province of Rome.
      supports: [type, of, from]
    - source: broughton-mrr
      locator: 'vol. II, p. 106'
      url: https://archive.org/download/broughton-magistrates-roman-republic/Broughton_Magistrates_Roman_Republic_djvu.txt
      quote: >-
