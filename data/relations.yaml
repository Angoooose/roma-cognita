- polity: aegyptus
  type: client-of
  of: rome
  from: before 68 BCE
  to: after 43 BCE
  sources:
    - { source: braund-1984 }
  confidence: probable
  review: needs-check
  note: >-
    Migrated as cicero-map drew it, a client for the whole window. But
    cicero-map's own note argues for client standing only from 59 (socius et
    amicus) or 55 (the Gabinian garrison), and before that Egypt was formally
    independent. The start probably wants to be 59 or 55 with the years before
    as `independent`; not changed here because that is a new judgement.

