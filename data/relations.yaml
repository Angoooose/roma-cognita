    Dio has Abgar in treaty with Rome "in the time of Pompey" (40.20.1), and no
    earlier tie is recorded. Left open at 43 on purpose (September 2026): nothing attests Osroene's
    standing in 43–27. Abgar was bound to Rome under Pompey (Dio 40.20.1) and
    served Parthia against Crassus in 53; geography points to a Parthian
    vassal, but no text says so for these years.

