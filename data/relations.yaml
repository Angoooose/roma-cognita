        slight inexactitude on the part of Eutropius, have occurred at the end of
        75.
      supports: []
  confidence: certain
  review: draft
  note: >-
    Bithynia from the bequest of 74; with Pontus from Pompey's settlement of 63.
    Eutropius dates the death to the consuls of 74 and Magie follows him;
    Broughton allows the end of 75 (an open question for the project's owner,
    left at 74).

