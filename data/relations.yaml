- polity: aegyptus
  type: client-of
  of: rome
  from: before 68 BCE
  to: after 43 BCE
  sources:
    - { source: braund-1984 }
  confidence: probable
  review: needs-check
  note: >-
    Drawn as a client for the whole window, but client standing is better dated
    from 59 (Auletes recognised as friend and ally) or 55 (the Gabinian
    garrison), and before that Egypt was formally independent. The start
    probably wants to be 59 or 55 with the years before as `independent`; not
    yet changed, because it needs a decision between the two.

