# --- client kingdoms -------------------------------------------------------------

- polity: numidia
  type: client-of
  of: rome
  from: before 133 BCE
  to: 112 BCE
  sources:
    - { source: braund-1984 }
    - { source: sallust-jug, locator: '5.4–5, 16, 21.4' }
  confidence: probable
  review: draft
  note: >-
    The heirs of Masinissa, who "was ever our true and loyal friend" (Sall.
    Jug. 5.5); the
    senate divided the kingdom between Micipsa's heirs (Jug. 16) and ordered
    Jugurtha and Adherbal to lay down their arms (21.4). Broken by Jugurtha's
    taking of Cirta in 112; Rome declared war in 111.

- polity: numidia
  type: client-of
  of: rome
  from: 105 BCE
  to: 47 BCE
  sources:
    - { source: braund-1984 }
    - { source: sallust-jug, locator: '65.2–3' }
    - { source: plutarch, locator: 'Pompey 12.4' }
  confidence: probable
  review: draft
  note: >-
    Gauda, promised Numidia by Marius (Sall. Jug. 65.3), king from Jugurtha's
    surrender; Hiempsal II owed his throne to Pompey in 81 (Plut. Pompey 12.4).
    In 111–106 the kingdom was at war with Rome and is drawn independent.

- polity: numidia-jugurtha
  type: client-of
  of: rome
  from: c. 116 BCE
  to: 113 BCE
  sources: [{ source: sallust-jug, locator: '16, 20.5' }]
  confidence: probable
  review: needs-check
  note: >-
    Jugurtha's kingdom by the senate's own division (Sall. Jug. 16); Adherbal
    still put "more trust in the friendship of the Roman people" (20.5).

- polity: mauretania
  type: client-of
  of: rome
  from: 105 BCE
  to: 34 BCE
  sources:
    - { source: braund-1984 }
    - { source: sallust-jug, locator: '19.7, 80.4, 111.1' }
    - { source: bridoux-2020, locator: '¶80' }
  confidence: probable
  review: needs-check
  note: >-
    From Bocchus I's surrender of Jugurtha in 105, for which he was promised
    "friendship, alliance, and the part of Numidia which he now desired" (Sall.
    Jug. 111.1); Bridoux calls him Sulla's client from then (¶80). Before, the
    kingdom was unknown to Rome (Jug. 19.7), its request for a treaty early in
    the war refused (80.4), and in 106 it fought Marius; it is drawn
    independent. Two kings from about 49; see the polity.

- polity: aegyptus
  type: client-of
  of: rome
  from: 59 BCE
  to: 31 BCE
  sources:
    - { source: braund-1984 }
    - { source: cassius-dio, locator: '39.12.1' }
    - { source: caesar-bc, locator: '3.107' }
    - { source: suetonius-iul, locator: '54.3' }
  confidence: probable
  review: needs-check
  note: >-
    From 59, when Caesar's law and a decree of the senate made Ptolemy XII a
    friend and ally (Caes. BC 3.107; Dio 39.12.1; Suet. Iul. 54.3). Before it
    Egypt was an independent kingdom on friendly terms with Rome, and is drawn
    independent (decided September 2026, over 55, the Gabinian garrison: the
    formal recognition is the change of standing, the garrison a consequence
    of it). Until 2026 this row ran across the whole of 68–27.

- polity: nabataea
