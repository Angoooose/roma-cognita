# How polities stood to one another over time: `polity` is `type` `of` another.
# This is what cicero-map's `kind` meant by province and client, lifted out so
# it can be dated separately from the polity and from the ground it held —
# Egypt was a kingdom throughout, a client only from some point in the window.
#
# Every row here is derived from cicero-map/data/polities.json and control.json;
# nothing is new. Province rows run from the province's creation. Client rows
# run over the years cicero-map drew the kingdom as a client, which for the
# kingdoms drawn as seats was its whole 68–43 window.

