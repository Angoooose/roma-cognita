- polity: emesa
  type: client-of
  of: rome
  from: before 51 BCE
  to: 31 BCE
  sources:
    - source: cicero-fam
      locator: '15.1.2'
      quote: >-
        a despatch on the same subject reached me from Iamblichus , phylarch of
        the Arabians , who is generally considered to be well-disposed and
        friendly to our Republic.
      supports: [type, of, from]
    - source: strabo
      locator: '16.2.10'
      quote: >-
        Arethusa , belonging to Sampsiceramus and Iamblichus his son, chiefs of
        the tribe of the Emeseni .
      supports: []
    - source: josephus-aj
      locator: '14.129'
      quote: >-
        on his account it was that all the Syrians assisted him also, as not
        willing to appear behindhand in their alacrity for Caesar , viz.
        Iamblicus the ruler
      supports: [type, of]
    - source: cassius-dio
      locator: '50.13.7'
      quote: >-
        For this reason he tortured and put to death, among others, Iamblichus ,
        king of a tribe of the Arabians
      supports: [to]
    - { source: sullivan-1990 }
  confidence: uncertain
  review: needs-check
  note: >-
    Strabo names Sampsiceramus and Iamblichus as the Emeseni's chiefs, so
    Cicero's and Dio's Iamblichus "of the Arabians" is Emesa's. Dio puts
    Antony's killing of him in the year of Caesar and Messalla's consulship
    (50.10.1), 31. The start was 64 (Pompey's settlement, after Sullivan) until
    October 2026: no readable text dates the tie to 64, so it now opens at its
    first attestation, Cicero's despatch from Cilicia in his proconsulship of 51,
    when the Parthians crossed the Euphrates.

- polity: osroene
  type: client-of
