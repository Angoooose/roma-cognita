# --- territories: Africa -----------------------------------------------------

- dprr: Mauretania
  kind: territory
  polities:
    - polity: mauretania
    - polity: mauretania-bogud
      from: 49 BCE
  sources:
    - { source: braund-1984 }
    - { source: cassius-dio, locator: '41.42.7' }
  confidence: uncertain
  review: draft
  note: >-
    The Moorish kingdom, never a province in this window. Joined to both
    halves our map draws once it was split between Bocchus and Bogud in 49,
    since the name does not say which.

- dprr: Numidia
  kind: territory
  polities:
    - polity: numidia
      to: 47 BCE
    - polity: africa-nova
      from: 46 BCE
  sources:
    - { source: bellum-africum, locator: '97' }
    - { source: sallust-jug, locator: '27.3–4' }
  confidence: probable
  review: draft
  note: >-
    The Numidian kingdom until Thapsus; annexed by Caesar in 46 as Africa Nova
    ("New Africa"). Dated to match claims.yaml, where the kingdom's ground
    passes to the new province in 46. The consuls' "Numidia" of the Jugurthine
    War, from Bestia in 111 (Sall. Jug. 27.3–4) to Marius, was a war against
    this kingdom and shows on it: numidia is Jugurtha's whole kingdom from 112.

- dprr: Africa
  kind: territory
  polities:
    - polity: africa
  confidence: certain
  review: draft
  note: >-
    The old province round Carthage and Utica. After 46 it is also called
    Africa Vetus ("Old Africa"), and is the same polity.

- dprr: Africa Vetus
  kind: territory
  polities:
    - polity: africa
  sources:
    - { source: bellum-africum, locator: '97' }
  confidence: certain
  review: draft
  note: >-
    "Old Africa": the original province, so called from 46 to tell it from
    Africa Nova. Our africa carries the name from 46.

- dprr: Africa Nova
  kind: territory
  polities:
    - polity: africa-nova
  confidence: certain
  review: draft

- dprr: Cyrenaica
  kind: territory
  polities:
    - polity: cyrenaica-free
      from: 96 BCE
      to: 75 BCE
      confidence: uncertain
      note: >-
        The free cities of Apion's bequest, before the province of c. 74. P.
        Lentulus Marcellinus, sent as quaestor "to the new province of Cyrene"
        in 75 (Sallust Hist. 2.43 M), falls in their last year as drawn.
    - polity: cyrenae
      to: 28 BCE
    - polity: creta-cyrenae
      from: 27 BCE
  sources:
    - { source: livy-per, locator: '70' }
    - { source: appian, locator: 'BC 1.111' }
    - { source: sallust-hist, locator: '2.43 M' }
  confidence: certain
  review: draft
  note: The country of Cyrene; the same province as our cyrenae, and before it the free cities.

- dprr: Cyrene
  kind: territory
  polities:
    - polity: cyrenaica-free
      from: 96 BCE
      to: 75 BCE
      confidence: uncertain
      note: >-
        The free cities of Apion's bequest, before the province of c. 74. P.
        Lentulus Marcellinus, sent as quaestor "to the new province of Cyrene"
        in 75 (Sallust Hist. 2.43 M), falls in their last year as drawn.
    - polity: cyrenae
      to: 28 BCE
    - polity: creta-cyrenae
      from: 27 BCE
  sources:
    - { source: livy-per, locator: '70' }
    - { source: appian, locator: 'BC 1.111' }
  confidence: certain
  review: draft
  note: >-
    The city that gave the province its name. A post "at Cyrene" is a post in
    the province, so it is joined like Cyrenaica rather than treated as a city.

- dprr: Aegyptus
  kind: territory
  polities:
    - polity: aegyptus
      to: 31 BCE
    - polity: aegyptus-province
      from: 30 BCE
  sources:
    - { source: caesar-bc, locator: '3.103–112' }
    - { source: bellum-alexandrinum }
    - { source: braund-1984 }
  confidence: probable
  review: draft
  note: >-
    Ptolemaic Egypt, an independent friend of Rome to 60, a client kingdom from
    59, and never a province before 30. Joined to the kingdom so that Romans who
    served there — in Caesar's Alexandrian war, or with the legions left behind
    — show on it; none was its governor.
    From 30 Egypt is a province under an equestrian prefect (aegyptus-province).

# --- territories: Illyricum and the Balkans ----------------------------------

- dprr: Illyria
  kind: territory
  polities:
    - polity: illyricum
  sources:
    - { source: wilkes-1969, locator: 'pp. 37–41' }
    - { source: dzino-2010, locator: 'pp. 80–98' }
  confidence: probable
  review: draft
  note: >-
    The east Adriatic coast, the name used for Rome's third- and second-century
    Illyrian wars. The same ground became the province of Illyricum, which our
    map draws from 59; a post before then is not shown.

- dprr: Illyricum
  kind: territory
  polities:
    - polity: illyricum
  confidence: certain
  review: draft

- dprr: Dalmatia
  kind: territory
  polities:
    - polity: delmatae
      to: 34 BCE
    - polity: illyricum
      from: 33 BCE
  sources:
    - { source: appian, locator: 'Ill. 11–13' }
    - { source: appian, locator: 'Ill. 28' }
    - { source: wilkes-1969, locator: 'pp. 29–45' }
  confidence: uncertain
  review: needs-check
  note: >-
    The land of the Delmatae, inland from Salona, against whom Rome fought in
    the second century and again in 45–44. In this window it was hostile ground
    outside the province of Illyricum, and our map draws it as the Delmatae's
    own. Joined to them, not to Illyricum; the imperial province of Dalmatia is
    later. A post here is a war command, never a governorship of the people.
    From their surrender in 33 their ground is Illyricum's (claims.yaml), so the
    join moves there too (September 2026).

- dprr: Macedonia
  kind: territory
  polities:
    - polity: macedonia
  confidence: certain
  review: draft

- dprr: Macedonia/Achaea
  kind: territory
  polities:
    - polity: macedonia
  sources:
    - { source: kallet-marx-1995 }
    - { source: broughton-mrr, locator: vol. II }
  confidence: probable
  review: draft
  note: >-
    Macedonia with Greece. Greece (Achaea) was governed from Macedonia in this
    window, and our macedonia includes it.

- dprr: Achaea
  kind: territory
  polities:
    - polity: macedonia
      to: 28 BCE
    - polity: achaea
      from: 27 BCE
  sources:
    - { source: kallet-marx-1995 }
    - { source: broughton-mrr, locator: vol. II }
    - { source: cicero-fam, locator: '4.12' }
    - { source: cassius-dio, locator: '53.12.4' }
  confidence: probable
  review: needs-check
  note: >-
    Greece south of Thessaly. It is first firmly attested as a province of its
    own in 27, and our map draws its ground as Macedonia's until then, so it is
    joined there to 28 and to achaea from 27.
    Caesar did send his own governors to Greece in 46–44, which some count as
    an early province of Achaea; here they appear on Macedonia. The name also
    covers the civil-war commanders of 49–48, whose posts in Greece were
    campaigns, not government.

- dprr: Epirus
  kind: territory
  polities:
    - polity: macedonia
      to: 28 BCE
    - polity: achaea
      from: 27 BCE
  sources:
    - { source: kallet-marx-1995 }
    - { source: barrington, locator: 'maps 49–51, 54–55' }
    - { source: bowersock-1965, locator: '284–285' }
  confidence: probable
  review: draft
  note: >-
    The north-west of Greece, down to the Ambracian Gulf, part of the province
    of Macedonia and inside our macedonia ground until 27, when its southern
    part (our epirus atom) went with Achaea.

- dprr: Aetolia
  kind: territory
  polities:
    - polity: macedonia
  sources:
    - { source: kallet-marx-1995 }
    - { source: barrington, locator: 'maps 54–55' }
  confidence: probable
  review: draft
  note: >-
    Central Greece north of the Gulf of Corinth, the name of Rome's war with the
    Aetolian League in 191–189. By this window it lay in the Greece governed
    from Macedonia, which is how our map draws it.

- dprr: Thracia
  kind: territory
  polities:
    - polity: thracia-odrysae
  sources:
    - { source: sullivan-1990 }
  confidence: uncertain
  review: needs-check
  note: >-
    Thrace inland of the Aegean coast, which in this window was the Odrysian
    kingdom, a client of Rome. The Thracian coast itself was Macedonia's.
    Joined to the kingdom; a Roman post here is a campaign, not government.

- dprr: Crete
  kind: territory
  polities:
    - polity: creta
      to: 28 BCE
    - polity: creta-cyrenae
      from: 27 BCE
  sources:
    - { source: velleius, locator: '2.38.6' }
    - { source: cassius-dio, locator: '36.17a–19' }
  confidence: certain
  review: draft
  note: >-
    Our creta starts in 66, when Metellus had finished the conquest; the war
    years before it are not shown on the province, and the Cretan league that
    fought him is not the place to show them. Crete is not joined to Cyrenae:
    polities.yaml leaves the date of their union unsettled. From 27 the joint
    province creta-cyrenae carries it.

