# How the Digital Prosopography of the Roman Republic's 92 "provinces" line up
# with our polities, so that a province on the map can show who governed it in
# the year drawn. One entry per DPRR province, keyed by DPRR's own name for it,
# spelt exactly as DPRR spells it. The schema is packages/schema/src/
# dprrProvinces.ts; the reasoning behind the join is PEOPLE.md §3.1.
#
# Licence. This table is our work, under our licence (CC BY-SA), and lives in
# data/ for that reason. DPRR is CC BY-NC, and the two cannot be merged
# (PEOPLE.md §2), so nothing here is taken from DPRR except the names of its
# provinces. No governors, no dates of office, no counts. Every judgement below
# rests on the sources cited, not on DPRR's records.
#
# `kind` says what sort of thing the name is. DPRR's "provinces" are a
# praetor's or proconsul's provincia — his assigned sphere of duty — and only
# some of those were ground. Only a `territory` is joined to polities, and only
# its posts appear in a polity's inspector. The rest are sorted so the inspector
# can say what they are: a `region` of Italy, a `city`, a standing `court` at
# Rome, a praetor's `jurisdiction` at Rome, a `command` with no fixed ground, or
# a `vague` name that cannot be put on one polity.
#
# Rules followed:
# - A join names only polities in polities.yaml, and agrees with claims.yaml:
#   where the ground changed hands in 68–27 BCE, the join is dated to match
#   (Pontus from 63, Cyprus 58–48).
# - An undated join holds whenever both the DPRR post and the polity exist. So a
#   post from before a province was created (Crete before 66, Syria before 64)
#   is simply not shown; that is left to the polity's dates, never faked here.
# - More than one polity at once means the post covered all of them (Pompey's
#   two Spains, Caesar's Transalpine Gaul after the conquest).
# - A name for ground we do not draw as any polity is `vague`, with a note
#   saying so. No polity is invented to receive it.
# - A client kingdom or free ally we draw (Egypt, Armenia, Judaea, Lycia) is a
#   `territory` joined to itself: Romans served there, as commanders, envoys and
#   staff, though Rome sent no governor. The inspector tells governors from
#   staff by office, not by this table.
#
# Confidence is how sure the classification and join are, not how well any
# governor is attested. Every entry is review: draft until signed off.

# --- territories: Spain ------------------------------------------------------

- dprr: Hispania
  kind: territory
  polities:
    - polity: hispania-citerior
      from: 54 BCE
      to: 49 BCE
    - polity: hispania-ulterior
      from: 54 BCE
      to: 49 BCE
  sources:
    - { source: plutarch, locator: 'Pompey 52' }
    - { source: cassius-dio, locator: '39.33' }
    - { source: caesar-bc, locator: '1.38' }
  confidence: probable
  review: needs-check
  note: >-
    Spain as a whole. For 54–49 it is joined to both Spanish provinces, because
    the lex Trebonia of 55 gave Pompey both of them for five years, and he
    governed them from Italy through his legates Afranius, Petreius and Varro
    until Caesar beat them in 49. Outside those years the name marks commands
    that do not say which Spain they meant, and is left unjoined rather than
    guessed. The schema's own example treats Hispania as vague; this is a
    deliberate exception, to be confirmed.

- dprr: Hispania Citerior
  kind: territory
  polities:
    - polity: hispania-citerior
  confidence: certain
  review: draft

- dprr: Balearic islands
  kind: territory
  polities:
    - polity: hispania-citerior
  sources:
    - { source: strabo, locator: '3.5.1' }
    - { source: broughton-mrr }
  confidence: probable
  review: draft
  note: >-
    Conquered by Q. Caecilius Metellus in 123 and governed from Nearer Spain
    thereafter; our map draws the islands as part of Hispania Citerior.

- dprr: Hispania Ulterior
  kind: territory
  polities:
    - polity: hispania-ulterior
  confidence: certain
  review: draft

# --- territories: Gaul -------------------------------------------------------

- dprr: Gallia Narbonensis
  kind: territory
  polities:
    - polity: gallia-transalpina
  sources:
    - { source: pliny-nh, locator: '3.31' }
    - { source: cah-ix, locator: ch. 9 }
  confidence: probable
  review: draft
  note: >-
    The later, official name of the old Transalpine province round Narbo, used
    once the rest of Gaul had been conquered and needed telling apart from it.
    The same ground as our gallia-transalpina.

- dprr: Gallia Transalpina
  kind: territory
  polities:
    - polity: gallia-transalpina
    - polity: gallia-comata
      from: 51 BCE
      confidence: uncertain
      note: >-
        Caesar's conquests, governed with the old province. Uncertain for
        every governor it brings: DPRR names only Transalpine Gaul, so a man
        who held the old province alone (Sex. Pompeius at Massilia, 43) is
        brought here too.
  sources:
    - { source: caesar-bg }
    - { source: cah-ix, locator: ch. 9 }
  confidence: uncertain
  review: needs-check
  note: >-
    Gaul beyond the Alps. Before the conquest this is only the old province.
    From 51, when our map first draws Gallia Comata ("long-haired Gaul", the
    conquered interior), a command over Transalpine Gaul is taken to cover both:
    Caesar held them as one command. They were first given to different men in
    44, when Lepidus took the old province and Plancus the rest, so the join is
    weakest in 44–43, for a governor who held only one half. It also inherits
    gallia-comata's own doubtful start date.

- dprr: Gallia Cisalpina
  kind: territory
  polities:
    - polity: gallia-cisalpina
  confidence: certain
  review: draft

- dprr: Gallia Cispadana
  kind: territory
  polities:
    - polity: gallia-cisalpina
  sources:
    - { source: cah-ix }
  confidence: probable
  review: draft
  note: >-
    Gaul "this side of the Po": the southern half of Cisalpine Gaul, inside
    our gallia-cisalpina.

- dprr: Liguria
  kind: territory
  polities:
    - polity: gallia-cisalpina
  sources:
    - { source: caesar-bg, locator: '1.10' }
    - { source: barrington, locator: 'maps 39–40' }
  confidence: probable
  review: draft
  note: >-
    The Ligurian coast and Apennines north of the Arno, which Rome fought over
    in the second century. By this window it lay inside the province of
    Cisalpine Gaul, and our cisalpina ground runs to Albintimilium; it became a
    region of Italy only under Augustus. Joined to the province, not treated
    as an Italian region.

- dprr: Venetia
  kind: territory
  polities:
    - polity: gallia-cisalpina
  sources:
    - { source: pliny-nh, locator: '3.127' }
    - { source: barrington, locator: 'maps 39–40' }
  confidence: probable
  review: draft
  note: >-
    The land of the Veneti round Aquileia and Patavium, north of the Po. In this
    window it was part of Cisalpine Gaul, which our map draws to the Formio; it
    joined Italy only when the province was dissolved after 43.

