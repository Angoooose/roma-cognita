# --- jurisdictions at Rome -------------------------------------------------------

- dprr: Rome
  kind: jurisdiction
  confidence: certain
  review: draft
  note: >-
    Duties in the city itself. Rome is a polity in our data only as the other
    end of every province-of relation; it holds no ground, so nothing is joined.

- dprr: urbanus
  kind: jurisdiction
  confidence: certain
  review: draft
  note: The urban praetor, who heard lawsuits between Roman citizens.

- dprr: inter peregrinos
  kind: jurisdiction
  confidence: certain
  review: draft
  note: >-
    The praetor "among foreigners", who heard lawsuits in which one side was
    not a Roman citizen.

- dprr: city
  kind: jurisdiction
  confidence: certain
  review: draft
  note: >-
    A praetor's duties in the city where it is not said whether he was the
    urban praetor, the foreigners' praetor or both.

