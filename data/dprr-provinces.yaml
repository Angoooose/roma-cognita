# --- vague ---------------------------------------------------------------------------

- dprr: Italia
  kind: vague
  sources:
    - { source: appian, locator: 'BC 1.49' }
  confidence: probable
  review: needs-check
  note: >-
    Italy, which after the Social War was citizen territory with no governor.
    We draw it as the polity italia, but a post "in Italy" is a war command, a
    levy, or a general waiting outside Rome for his triumph — never its
    government — so it is not joined.

- dprr: Gallia
  kind: vague
  confidence: probable
  review: draft
  note: >-
    "Gaul", not saying which. Could be the Cisalpine or Transalpine province or
    the conquered interior; not joined rather than guessed.

- dprr: Britannia
  kind: vague
  confidence: certain
  review: draft
  note: >-
    Britain, which Caesar raided in 55 and 54 but Rome did not hold. We draw
    no polity there.

- dprr: Istria
  kind: vague
  sources:
    - { source: pliny-nh, locator: '3.127' }
  confidence: probable
  review: draft
  note: >-
    The peninsula between Tergeste and the Arsia, the name of Rome's
    second-century Istrian wars. Our map leaves it unclaimed in this window,
    between Cisalpine Gaul at the Formio and Illyricum at the Arsia, so there
    is no polity to join it to.

- dprr: Pannonia
  kind: vague
  confidence: probable
  review: draft
  note: >-
    The middle Danube and Sava lands, not Roman until Augustus. We draw no
    polity there.

- dprr: provincia declined
  kind: vague
  confidence: certain
  review: draft
  note: >-
    Not a place: it records that a magistrate refused the province he was
    offered.

- dprr: province 92
  kind: vague
  confidence: uncertain
  review: needs-check
  note: >-
    DPRR gives this province neither a name nor a description; "province 92" is
    the label our build makes from its number. What it stands for is not
    known, so it is not joined.
