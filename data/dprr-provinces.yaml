# --- cities ----------------------------------------------------------------------
# A post at a single city: a garrison, a siege, a local command. Not joined,
# even where the city lies inside a polity we draw, because it is not the
# government of that polity.

- dprr: Alexandria
  kind: city
  sources:
    - { source: bellum-alexandrinum }
  confidence: certain
  review: draft
  note: >-
