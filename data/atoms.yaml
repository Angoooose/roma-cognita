    Lusitania between the Tagus and the Durius. Caesar, propraetor of Ulterior
    in 61–60, cleared the Mons Herminius and brought the country to the Durius
    under Roman arms, then sailed to Brigantium and "alarmed" the Callaeci (Dio
    37.52–53). Claimed from 61–60; the Callaeci beyond the Durius are not. Left
    unclaimed in 133–62: D. Brutus had taken the surrender of its towns in
    138–136 (App. Hisp. 71–73; Strabo 3.3.1), and the Senate sent ten
    commissioners to settle what he had won (Hisp. 99); but the Lusitanians were
    Sertorius' mainstay in the 70s (Plut. Sert. 10–12), and Caesar had to
    conquer the Herminius afresh.

