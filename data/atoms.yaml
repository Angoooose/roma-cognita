    under treaties of 305–302 (Beloch 165); in revolt from 91; the Vestini,
    Paeligni and Marrucini surrendered and the Marsi sued for peace in 89 (Livy
    Per. 75–76; App. BC 1.52). The Roman prefectures of the upper Aternus
    (Amiternum, Peltuinum) and the Latin colonies of Alba and Carseoli are left
    out (Beloch 52); the frontiers with the Samnite Caraceni and Pentri follow
    the Sangro and the Trigno, a convention.

