    but a conquest by Didius says Rome did not hold it in fact, and who did is
    not recorded, though the Knidos clause can be read as making only the
    Caenic land his conquest. Where the Caenic land lay is not
    certain: Pliny puts the district "called Caenica" inland, by Bizye and
    Apros (4.47), beyond this outline, which keeps macedonia's old northern
    line and is only the part of Didius' gain the map already drew as
    Macedonian. Aenus lies inside.

