  note: >-
    Cirta and its surroundings east of the Ampsaga: Juba I's to 46, then the
    part of his kingdom Caesar gave to P. Sittius (Appian BC 4.54; Bridoux
    ¶101, ¶157), taken into Africa on Sittius' death in 44 (¶159). Milev,
    Chullu and Rusicade lie inside. How far the Sittiani reached east and south
    is unknown; the southern edge is a convention round the plain of Cirta.

