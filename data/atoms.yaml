  note: >-
    Cisalpine Gaul south of the Po and east of the Trebia and the Macra, with
    the Etruscan and Ligurian land north of the Arno. Beloch finds the plain
    between Placentia and the Rubicon Roman citizen land, the tribe Pollia's
    (the colonies of Mutina and Parma, Regium Lepidi, Faventia, Fidentia and
    the other market towns), with the Latin colonies of Placentia and Bononia,
    and Luna, a Roman colony, on the land of the deported Apuani (65–68).
    Ravenna was an ally under treaty (Cic. Balb. 50), and so were Faesulae and
    the Boii left by the Po. It took Roman citizenship in 90–89, while the
    land north of the Po received only Latin rights (Asconius, Pis. 3 C) and
    Liguria west of the Trebia kept allied peoples such as Genua and the
    Statielli: that is why this atom is cut out of cisalpina, the two differing
