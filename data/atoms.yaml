# Ground that is never subdivided at any date the data covers. An atom carries
# an outline and no politics; who held it when is claims.yaml. Its geometry is
# data/geometry/atoms.geojson, keyed by the same id, and is built from the
# `construction` below by `npm run atoms -w pipeline` (pipeline/src/atoms).
#
# Rebuilt September 2026. The first outlines were AWMC's
# 60 BCE shading cut with straight lines, and hand-drawn twelve-vertex rings
# for the kingdoms; neither followed anything the sources name, and AWMC's
# ODbL would not relicense. Every outline is now authored here from the
# frontiers the cited scholarship describes:
#
#   outline  the frontier, vertex by vertex. A vertex is a place (with its
#            Pleiades id where it has one) or a routing point, and says how the
#            frontier reaches it from the vertex before: straight (`line`, the
#            default), down or up a river (`river`, the modern main channel from
#            HydroRIVERS), along a range (`crest`, the ridge in the Mapterhorn
#            DEM), or as a smooth curve for a zone nobody surveyed (`curve`).
#            Outlines are drawn out over the sea on purpose and clipped to
#            Natural Earth land, so the coast is exact and only the inland edge
#            is authored.
#   box      a rectangle round an island, whose coast is its boundary.
#
# ORDER MATTERS. Each atom has every atom above it cut out of it, so a frontier
# two atoms share is authored once, by the earlier atom, and the later atom is
# drawn to overlap it. The note on the later atom says whose line it takes.
#
# evidence: `surveyed` where the boundary is a coast or a named river the sources
# give as the line; `derived` where it is reconstructed from named places and
# features in the scholarship; `schematic` where authority faded out (a desert
# edge, a mountain zone) and the line is a convention. Confidence is how far the
# outline can be trusted as the extent of what its claims say it was.

# === North Africa ==============================================================
# Chiefly V. Bridoux, Les royaumes d'Afrique du Nord (2020), ch. 1 and pls. II,
# VII–XIV, which reviews Gsell, Desanges, Camps and Di Vita-Évrard.

