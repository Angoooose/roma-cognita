# --- cut from AWMC ground ------------------------------------------------------
# AWMC shades the Roman world as one extent, so ground this data has to
# separate arrives fused. The three parents (italia-all, hispania,
# anatolia-interior) never reach the map under their own names, so they are
# labels inside `construction` rather than atoms.

- id: italia
  evidence: derived
  construction:
    - method: cut
      dataset: awmc-roman-60bce
      parent: { label: italia-all, seeds: [{ at: [14.199, 41.635] }] }
      line: [[10.0, 43.55], [12.6, 44.25]]
      side: right
  sources:
    - { source: awmc-roman-60bce }
    - { source: natural-earth }
    - { source: cicero-map, locator: data/cuts.json }
  confidence: probable
  review: draft
  note: >-
    The cut is the Rubicon–Arno line, the Republican limit of Italia. It puts
    Genua on the Cisalpine side, which is right for the Republic though not for
    the Augustan regiones.

- id: cisalpina
  evidence: derived
  construction:
    - method: cut
      dataset: awmc-roman-60bce
      parent: { label: italia-all, seeds: [{ at: [14.199, 41.635] }] }
      line: [[10.0, 43.55], [12.6, 44.25]]
      side: left
  sources:
    - { source: awmc-roman-60bce }
    - { source: natural-earth }
    - { source: cicero-map, locator: data/cuts.json }
  confidence: probable
  review: draft
  note: North of the Rubicon–Arno line; see italia.

- id: hispania-citerior
  evidence: derived
  construction:
    - method: cut
      dataset: awmc-roman-60bce
      parent: { label: hispania, seeds: [{ at: [-1.643, 39.059] }] }
      line: [[-0.9, 37.6], [-8.8, 41.6]]
      side: right
    - method: seed
      dataset: awmc-roman-60bce
      seeds:
        - { at: [2.922, 39.632], note: Baliares — Mallorca }
        - { at: [4.066, 39.964], note: Baliares — Menorca }
        - { at: [1.401, 38.978], note: Baliares — Ebusus }
  sources:
    - { source: awmc-roman-60bce }
    - { source: natural-earth }
    - { source: broughton-mrr, locator: vol. II — the Citerior/Ulterior commands }
  confidence: probable
  review: draft
  note: >-
    The division ran through the Saltus Castulonensis and was never surveyed;
    the line reproduces its direction, not its course.

- id: hispania-ulterior
  evidence: derived
  construction:
    - method: cut
      dataset: awmc-roman-60bce
      parent: { label: hispania, seeds: [{ at: [-1.643, 39.059] }] }
