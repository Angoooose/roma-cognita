# Ground that is never subdivided at any date the data covers. An atom carries
# an outline and no politics; who held it when is claims.yaml. Its geometry is
# data/geometry/atoms.geojson, keyed by the same id.
#
# Migrated from cicero-map/data/atoms.json, cuts.json and shapes.json. The
# outlines in atoms.geojson are cicero-map's *processed* output
# (public/geo/polities.json), not re-derived: each part below was built, then
# clipped to Natural Earth 10m land, differenced against its neighbours so
# nothing overlaps, given the leftover coastal shreds it surrounded (< 0.25 sq°),
# simplified at 0.01° and rounded to 4 decimals. That is coarser than v1's
# regional zoom wants. `construction` is kept so the pipeline can rebuild every
# outline against OSM land without re-deciding anything:
#
#   seed   name an upstream polygon by a point known to fall inside it — never
#          by the upstream id, which AWMC renumbers between releases. AWMC's 59
#          unseeded polygons are small islands; cicero-map attached each to the
#          nearest named atom and printed every assignment.
#   cut    split an upstream polygon along the infinite straight line through
#          two points; `side` is relative to travelling from the first to the
#          second. Every cut stands for a frontier that was a zone rather than a
#          line, and a straight line is visibly a convention where a polyline
#          would be false precision.
#   drawn  a coarse hand-drawn ring, twelve-odd vertices because that is the
#          resolution the evidence supports, drawn out over the sea on purpose
#          so that clipping to land makes the coast exact and only the inland
#          edge a guess. Neighbours are drawn to overlap: `difference` removes
#          overlap but cannot close a gap, so overlap is the only way two drawn
#          outlines come to share an edge.
#
# evidence: cicero-map's awmc and coastline → surveyed; cut → derived;
# schematic → schematic. Confidence is how far the outline can be trusted as
# the extent of *something*: islands, whose boundary is the coast, are certain;
# AWMC mainland shading probable, because it is a 60 BCE sphere of authority
# rather than an administrative line (see the anatolia cut).

