    have kept Tarquinii and Vulci allied, so the line is a zone. Some
    Etruscans and Umbrians took up arms in 90–89 and were beaten (Livy Per.
    74); the lex Iulia's offer of citizenship kept the rest loyal (App. BC
    1.49). Beloch goes further for Umbria: all or most of the Tiber-valley
    towns later in the tribe Clustumina (Tuder, Iguvium, Arna, Ameria and the
    rest) joined the rising, which stayed in the west of the region (56–57).
    Drawn here as loyal and enfranchised in 90, since no source dates their
    submission. Faesulae, north of the Arno, lies in
    cisalpina-cispadana.

