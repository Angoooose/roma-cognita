    From Cap Ténès to the Soummam. Desanges, followed by Bridoux ("tout à fait
    vraisemblable", ¶102), holds that the Mauretanian kingdom had pushed east to
    the Soummam, "ou tout du moins jusqu'à l'Algérois", in the first half of the
    first century; so Mauretanian from Sosus' accession, c. 80, uncertainly.
    Numidian before, to Gauda's death c. 88 (Bridoux ¶124, ¶145). The
    southern edge is the front of the Tell Atlas, a convention. Takes the
    Soummam from numidia-soummam.

