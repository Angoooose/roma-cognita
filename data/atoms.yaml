  confidence: uncertain
  review: needs-check
  note: '(cicero-map: check.) See bithynia-pontus.'

# --- drawn by hand -------------------------------------------------------------
# Kingdoms AWMC does not supply. Every published polygon found for these turned
# out either copyleft or a generated ellipse wearing a citation (cicero-map
# README, "Rejected: published client-kingdom borders").

- id: cyprus
  evidence: surveyed
  construction:
    - { method: drawn, bbox: [32.2, 34.5, 34.7, 35.8] }
  sources:
    - { source: natural-earth }
    - { source: cicero-map, locator: data/shapes.json }
  confidence: certain
  review: draft
  note: An island; the coastline is the boundary. The box only selects it.

- id: gallia-comata
  evidence: schematic
  construction:
    - method: drawn
      ring:
        [
          [-2.0, 42.6],
          [-2.5, 47.5],
          [-4.8, 48.8],
          [-1.0, 49.8],
          [2.5, 51.2],
          [6.0, 51.5],
          [8.3, 48.9],
          [7.6, 47.5],
          [7.0, 46.0],
          [6.2, 45.0],
          [4.0, 43.0],
          [1.0, 42.4],
        ]
  sources:
    - { source: caesar-bg }
    - { source: barrington, locator: maps 7–18 }
  confidence: probable
  review: draft
  note: >-
    The Rhine is a real frontier. The southern edge is not drawn at all: the
    ring runs past Transalpina into the Pyrenees on purpose, and the seam is
    what differencing against the neighbours leaves. The eastern edge stops
    short of the Alpine crest on purpose: the Cottian and Maritime Alps were
    held by their own tribes until Augustus, and that ground is left unclaimed.

