    surveyed; south of the Tagus it follows the named places, north of it only
    the direction is attested (Richardson). The Arevaci are cut out as
    meseta-arevaci, and the Baliares as baliares. The Pompaelo corner is drawn
    as it stood after Pompey (Strabo 3.4.10); when the Vascon uplands came under
    Roman arms before him is not recorded.

