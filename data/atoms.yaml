# === The Levant ================================================================
# Judaea is drawn as Pompey left it in 63 (Josephus AJ 14.74–76; BJ 1.155–157):
# Judaea, Idumaea, Peraea and Galilee, without the coastal plain, Samaria and the
# Greek cities, which went to the province. Earlier atoms here cut the envelope
# of Syria, which is drawn last.

