- id: bithynia-pontus
  evidence: derived
  construction:
    - method: cut
      dataset: awmc-roman-60bce
      parent: { label: anatolia-interior, seeds: [{ at: [31.2, 38.815] }] }
      line: [[28.0, 38.5], [37.0, 39.4]]
      side: left
  sources:
    - { source: awmc-roman-60bce }
    - { source: natural-earth }
    - { source: cah-ix, locator: ch. 8 }
  confidence: uncertain
  review: needs-check
  note: >-
    (cicero-map: check.) Cut along Pompey's settlement of 63. AWMC shades the
    whole Anatolian interior as Roman at 60 BCE, which overstates it — Galatia
    and Cappadocia were client kingdoms inside this outline, and are drawn as
    seats on top of it. The cut divides what AWMC drew; it does not fix it.

