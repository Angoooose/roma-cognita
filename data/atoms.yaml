# === Italy and the islands =====================================================

# Italy before the Social War (the extension to 133 BCE, September 2026). The
# italia atom is what was Roman citizen land in 133–91; the atoms above it are
# the allied regions cut out of it, one for each group the Social War dates
# differently: the loyal allies of Etruria and Umbria, of the heel and of the
# toe, enfranchised in 90; the insurgents of Asculum, of the Marsic peoples, of
# the Nucerine cities and of the Hirpini, who gave in or were taken in 89; of
# Apulia, in 88; of Samnium and Lucania, the last, in 87. The frontiers between
# the citizen land and the allies follow Beloch's reconstruction (1880, ch.
# III) and are known only as zones, so every one of these atoms is schematic
# and uncertain; the Latin colonies and the allied cities left inside the
# citizen land (Tibur, Praeneste, Neapolis, Nola's neighbours) are places.
# From 90–87 each carries the italia rows its parent does.

