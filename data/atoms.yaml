# (Strabo 3.4.20; Dio 51.20, 53.25–29) and are drawn as independent; the
# Vaccaei pass to Hither Spain c. 29. The Arevaci are Hither Spain's from the
# fall of Numantia in 133; the Baliares from Metellus' conquest of 123.

