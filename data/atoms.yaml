    edges, the Delta, the Fayum and Mareotic Libya west to the Catabathmus,
    which Pliny makes Egypt's neighbour with Cyrenaica (5.38–39); the eastern
    desert to the Red Sea ports, whose roads, mines and harbours the Ptolemies
    held; and the western oases of the Hibite nome and its neighbours
    (Barrington map 79), drawn as the separate islands of ground they were.
    Siwa (Ammon), under its own rulers, and the Sinai south of the coast road,
    a nomad and Nabataean zone (Barrington map 76), are left out, as is the
    Dodecaschoenus beyond Philae, contested with Meroë. Takes the Catabathmus
    from cyrenaica.

