    Italy of the late Republic, bounded by the Rubicon on the Adriatic and the
    Arno on the Tyrrhenian. Luca, north of the Arno, lay in Caesar's province
    (the conference of 56); the Macra is the Augustan limit (Pliny 3.50) and is
    not used. Between the Arno and the Rubicon the line runs along the Apennine
    watershed. The Rubicon is taken as the modern Rubicone, whose
    identification is conventional. Since September 2026 the allied regions of
    133–91 are cut out of it (the atoms above), and what is left is the Roman
    citizen land of those years, with the Latin colonies and a few allied
    cities inside (Beloch 1880, ch. III); after 87 it is Italy with the rest.

