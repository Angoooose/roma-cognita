    Massalia's own territory lies inside this outline, and the Tolosates are cut
    out as tolosates. When the Ruteni provinciales came in is not recorded: the
    Ruteni were not made provincial in 121 (BG 1.45), and the 70s are argued
    (Amela Valverde 2019, 24, 28). Takes the eastern Pyrenees from
    hispania-citerior.

