      supports: [to]
    - source: pliny-nh
      locator: '6.117'
      quote: >-
        The Macedonians formed these communities into cities, being prompted
        thereto by the extraordinary fertility of the soil.
      supports: [from]
    - source: pliny-nh
      locator: '6.124'
      quote: >-
        the Euphrates continues to flow with an undivided channel for a distance
        of eighty-seven miles beyond Babylon , before its waters are diverted
        from their channel for the purposes of irrigation
      supports: [to]
