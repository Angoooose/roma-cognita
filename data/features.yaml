# Physical features. Shapes live in geometry/features.geojson, keyed by id.
#
# Floodplains (kind: floodplain) are derived, not drawn: their outlines come from
# terrain by pipeline/src/features/derive-floodplains.ts (hulls, channels and
# thresholds in pipeline/src/features/regions.ts). Re-run it after changing any
# of those; it prints each region's area beside the published figures and flags
# what it doubts. No outline is traced from any atlas.
#
# The Nile delta branches (kind: river) are authored as waypoints with the
# provenance of every coordinate in pipeline/src/features/delta-branches.ts; the
# same tool writes their lines. `discharge` on a line is display width only.
#
# Rivers surveyed from OpenStreetMap (sources: osm-waterways) are fetched into
# their lines by pipeline/src/rivers/fetch.ts, and drawn in place of HydroRIVERS'
# coarser modern channel along them.
#
# Every record here is "always" within the window: before 133 BCE to after 27 BCE.
# Change over the window (the Fayum lake falling, the Pelusiac silting, the Gulf
# coast advancing) is not attempted. The floodplains stop at the coast the map
# draws: today's, with the landscape corrections (landscape-changes.yaml) applied.

# --- floodplains ---------------------------------------------------------------

- id: nile-valley-floodplain
  kind: floodplain
  names:
    - { text: Nile valley, lang: en, preferred: true }
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: butzer-1976, locator: cultivable area of the valley by period (locator to supply) }
    - source: herodotus
      locator: '2.19'
      quote: >-
        the Nile , when it is in flood, goes over not only the Delta but also of
        the land which is called Libyan and of that which is called Arabian
        sometimes as much as two days' journey on each side
      supports: [from]
    - source: diodorus
      locator: '1.36.7'
      url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/1B*.html
      quote: >-
        this one alone begins to rise at that time and increases so greatly in
        volume day by day that it finally overflows practically all Egypt
      supports: [from]
    - source: diodorus
      locator: '1.46.7'
      url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/1C*.html
      quote: >-
        at the time we visited those regions, in the One Hundred and Eightieth
        Olympiad
      supports: []
    - source: strabo
      locator: '17.1.4'
      quote: >-
        The country above the Delta is irrigated in the same manner … Egypt ,
        from the mountains of Ethiopia to the vertex of the Delta, is merely a
        river tract on each side of the Nile
      supports: [to]
    - source: pliny-nh
      locator: '5.58'
      quote: >-
        the smallest rise was that of five, in the year of the battle of
        Pharsalia … When the waters have reached their greatest height, the
        people open the embankments and admit them to the lands.
      supports: [to]
    - { source: mapterhorn, locator: z10 terrain }
    - { source: hydrorivers, locator: 'Nile main stem, DIS_AV_CMS ≥ 500' }
  confidence: probable
  review: draft
  note: >-
    From just below the First Cataract (Syene/Elephantine) to the latitude of
    Memphis, the traditional junction of Upper and Lower Egypt; north of that is
    the delta record. Derived as ground within 8 m of the floodplain surface beside
    the modern Nile (HAND ≤ 8 m, Mapterhorn z10). In the previews the edge sits at
    the foot of the cliffs and low desert, and the Kom Ombo plain (modern
    reclamation) stays out. About 10,500 km², in line with the valley figures of
    the order of 10,000–12,000 km² usually cited (Butzer 1976 — not yet checked
    against the book). The modern river has moved within the plain since
    antiquity; that does not move the plain's edge. Doubts: the DEM is a surface
    model, so Cairo-sized built-up areas read high (none in the valley south of
    Memphis is large enough to matter), and heights are whole metres at z10.

