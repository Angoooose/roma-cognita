    Rome draws the river's water on (the tiberis place in places/rome.yaml), so the
    two meet without a break. The course is today's: through Rome it is the
    Republic's, between the modern embankments; at Ostia the river looped round the
    town until the flood of 1557 cut it off (the Fiume Morto), which is not drawn.
    Below Ostia the line runs on over land the delta has built since, where the map
    draws the Republic's sea. Display discharge 220 m³/s, HydroRIVERS' through Rome.

# --- seas ------------------------------------------------------------------------
#
# Water names, in Latin (DESIGN §8.2). A sea's shape in geometry/features.geojson
# is the course its name is lettered along, hand-placed in
# pipeline/src/labels/seas.ts — not its extent, which no source draws as a line.
# The names are Pliny's; he wrote after our window, but he is the fullest Latin
# survey of the seas, and these are the forms the Barrington Atlas prints.
# Pliny's locators are to the book only; the paragraphs want checking (review:
# needs-check). Each sea's dates rest on a writer before 133 (Herodotus,
# Polybius, or Pytheas as Pliny reports him) and on Strabo, writing under
# Augustus, both describing it: the two bracket the window.

