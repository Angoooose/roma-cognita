  confidence: probable
  review: draft
  note: >-
    The lowland of the Karkheh, Dez and Karun below the Zagros foothills, with Susa
    in it. Derived as ground within 12 m of the floodplain surface beside the modern
    rivers: the plain is a set of coalescing fans with the rivers somewhat incised
    near Dezful and Shushtar, so the threshold is higher than in Mesopotamia. The
    anticlinal ridges (Ahvaz and its neighbours) come out on their own. Two edges
    are hull edges, not terrain: the west, where the plain runs on into the
    Mesopotamian alluvium (the line is the Mesopotamian hull, roughly the modern
    border and the Hawizeh marsh), and the south-east, where the coastal plain
    continues to the Jarrahi and Hendijan. The Karkheh and Dez reservoirs are
    kept out by the hull. The southern edge is the head of the Gulf as
    persian-gulf-head draws it, which takes the Shadegan flats. About 26,700 km²;
    no ancient area figure is known to us.

- id: middle-euphrates-valley
  kind: floodplain
  names:
    - { text: Euphrates valley, lang: en, preferred: true }
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: mapterhorn, locator: z10 terrain }
    - { source: hydrorivers, locator: 'Euphrates, DIS_AV_CMS ≥ 100' }
  confidence: probable
  review: draft
  note: >-
    The narrow Holocene floor of the Euphrates in Syria, from below the Tabqa dam to
    the Iraqi border below Abu Kamal, past Zenobia, Circesium and Dura-Europos.
    Derived as ground within 8 m of the floodplain surface beside the river; the
    edge sits at the first terrace riser, and the terraces (dry-farmed) stay out.
    Upstream of Tabqa the valley is under Lake Assad and cannot be derived from a
    modern DEM, so the record starts at the dam — the drowned stretch past
    Barbalissos wants its own record from pre-dam survey. The last ~10 km of the
    Khabur valley above Circesium is included. About 2,500 km². It cites no modern work: none with
    an area was found; it rests on the terrain.

# --- the Nile delta branches -----------------------------------------------------
#
# Names follow Strabo 17.1.18 and Pliny, NH 5.64, west to east. Courses: Toussoun
# 1922 for the delta as a whole, Bietak 1975 for the eastern delta; the waypoints
# are Pleiades positions of sites on the branches, modern channel points, and our
# own routing points, each tagged in delta-branches.ts. Between waypoints the line
# is a spline: interpolation, not evidence. Discharge is apportioned so the seven
# mouths sum to the pre-dam mean flow of the Nile (~2,800 m³/s), weighted to the
# branches the ancient writers treat as principal (Herodotus 2.17: the Pelusiac,
# Canopic and Sebennytic are the natural streams). It sets line width only.

