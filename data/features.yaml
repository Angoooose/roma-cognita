    - { text: Kanobikon stoma, lang: grc-Latn }
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - source: herodotus
      locator: '2.17'
      quote: >-
        the second of the ways goes towards the West, and this is called the
        Canobic mouth
      supports: [from]
    - { source: herodotus, locator: '2.179' }
    - source: diodorus
      locator: '1.33.7'
      url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/1B*.html
      quote: >-
        It empties into the sea in seven mouths … then the Bolbitine, and
        finally the Canopic, which is called by some the Heracleotic.
      supports: [from]
    - source: diodorus
      locator: '1.46.7'
      url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/1C*.html
      quote: >-
        at the time we visited those regions, in the One Hundred and Eightieth
        Olympiad
      supports: []
    - source: strabo
      locator: '17.1.18'
      quote: >-
        Next to Canobus is Heracleium , in which is a temple of Hercules ; then
        follows the Canobic mouth , and the commencement of the Delta.
      supports: [to]
    - source: pliny-nh
      locator: '5.64'
      quote: >-
        I allude to the seven more famous ones, the Canopic Mouth , next to
        Alexandria
      supports: [to]
    - { source: toussoun-1922 }
    - { source: pleiades, locator: 'places/727142, 727169, 727221, 727120' }
    - { source: hydrorivers, locator: modern Rosetta branch }
  confidence: probable
  review: draft
  note: >-
    From the fork at Kerkasoros (Pleiades 727142) down the modern Rosetta channel
    to a point south of Naukratis' latitude (our choice), then past Naukratis
    (727169) and Schedia (727221, where the Alexandria canal left it) to the mouth
    at Herakleion-Thonis (727120), now under Abu Qir Bay — the line is trimmed ~5 km
    at the modern shore. Sais (727217) lies on the modern Rosetta just downstream of
    the split, so in this reading it is on the Bolbitine; statements that Sais was
    on the Canopic imply a split below Sais, which cannot then reach Naukratis.
    Display discharge 600 m³/s.

