      locator: '1.193'
      quote: >-
        the crop is watered by hand or with swing-buckets. For the whole
        Babylonian territory like the Egyptian is cut up into channels
      supports: [from]
    - source: strabo
      locator: '16.1.9'
      quote: >-
        the Euphrates , at the commencement of summer, overflows; It begins to
        fill in the spring, when the snow in Armenia melts: the ploughed land,
        therefore, would be covered with water and be submerged, unless the
        overflow of the superabundant water were diverted by trenches and
