      supports: [from, status]
    - source: appian
      locator: 'Mithr. 84'
      quote: >-
        He intrusted to Mancaeus the defence of Tigranocerta, which city, as I
        have already said, the king had built in this region in honor of
        himself
      supports: [status]
    - source: broughton-mrr
      locator: 'vol. II, 69 B.C., p. 133'
      url: https://archive.org/download/broughton-magistrates-roman-republic/Broughton_Magistrates_Roman_Republic_djvu.txt
      quote: >-
        09 B.C. 133 … He invaded Armenia, routed King Tigranes near Tigranocerta
        and captured the city
      supports: [status]
    - source: strabo
      locator: '11.14.15'
      quote: >-
        attacked and pulled down the city, which was still only half finished,
        and left it a small village
      supports: [to]
    - source: strabo
      locator: '16.1.23'
      quote: >-
        In their territory is Nisibis, which they called also Antioch in
        Mygdonia, situated below Mount Masius, and Tigranocerta
      supports: [to]
    - { source: plutarch, locator: 'Lucullus 21, 25–29' }
  confidence: uncertain
  review: needs-check
  note: >-
    Appian has Tigranes settle the Cappadocians he carried off at Tigranocerta,
    a place he "had called after himself", in the raid that followed Sulla's
    death in 78 (Mithr. 67; Broughton dates the death by Lepidus' consulship);
    Strabo puts the founding after Tigranes took Syria (11.14.15). Until
    October 2026 the town and its royal seat started c. 80, a convention no
    readable text gives; they now start before 77, the raid being the first
    dated mention. The site is disputed: Pleiades puts it at Arzan, after
    Barrington map 89 D3; Silvan (Martyropolis) and other sites have been
    proposed. Broughton's running head for 69 reads "09 B.C." in the scan.
    Strabo, writing under Augustus, has Lucullus leave it "a small village".

