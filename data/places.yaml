    - { source: appian, locator: 'BC 1.24' }
    - { source: cassius-dio, locator: '43.50' }
    - { source: pleiades, locator: places/314921 }
  confidence: probable
  review: draft
  note: >-
    Destroyed 146 and left unoccupied by the curse on the site. Caesar's refoundation as
    Colonia Iulia Concordia Carthago was decreed in 44 and settled under the triumvirs;
    Pleiades dates the place continuously from 750. C. Gracchus' colony Iunonia, marked out
    on the site in 122 (Plut. C. Gracch. 11; App. BC 1.24), is not drawn: the assembly was
    called to repeal its law in 121 (App. BC 1.24), and no town is known to have stood,
    whatever became of the settlers' allotments.

