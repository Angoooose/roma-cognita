    - value: royal seat
      from: before 133 BCE
      to: 47 BCE
      note: >-
        Masinissa's and Micipsa's capital (Strabo 17.3.13; Bridoux ch. 1 ¶27) and
        Adherbal's (Bridoux ¶141), taken by Jugurtha in 112 (Sall.
        Jug. 26), held by Marius in 106/105 (Jug. 102.1), and the seat of the
        eastern kings after them to Juba I, whose capital it was when Bocchus II
        and Sittius took it in 46 (Bridoux ch. 1 ¶101); given to P. Sittius and his
        men (App. BC 4.54; Pliny 5.22, "colonia Cirta Sittianorum cognomine").
        Octavian later made it a full Roman colony, at a date not known, so no
        status is given after 47.
  labelSide: w
  sources:
