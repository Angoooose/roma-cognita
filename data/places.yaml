# Settlements, and how loudly each is lettered.
#
# Pleiades knows what existed and what it was called; it has no idea what
# mattered, so this file decides. `prominence` is a tier: 1 the
# overview, 2 from 1.5x, 3 from 3x, 4 from 5x — tier 4 is largely Cicero's own
# Italy. The ranking is Roman civic status and administrative weight, not size:
# a conventus seat belongs on a political map at a size its population would
# not earn, and status is datable in a way population is not.
#
# `location` and `pleiades` are Pleiades'; the rest is this project's curation,
# edited by hand. Name language is not yet recorded and is left untagged; the
# non-preferred names are the spellings the gazetteer files the place under.
#
# Dates: every place stood throughout the 133–27 BCE window (Pleiades attests
# it in the period), hence the open ends — except where a row
# overrides Pleiades, because period dating is not event dating: Pleiades has
# Carthage continuously from 750 BCE although it lay in ruins from 146 until
# Caesar refounded it.
#
# confidence: certain for a place matched to its Pleiades entry; probable or
# uncertain, and needs-check, where the match is in doubt.

