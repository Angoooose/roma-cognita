    - { text: Stratonicaea }
    - { text: Hadrianopolis }
  from: before 130 BCE
  to: after 27 BCE
  prominence: 4
  sources:
    - { source: pleiades, locator: places/550898 }
    - { source: kallet-marx-1995, locator: 'p. 114' }
  confidence: certain
  review: needs-check
  note: >-
    Stratonicea on the upper Caicus, where Aristonicus fled and was starved
    into surrender by Perperna (Eutropius 4.20; Orosius 5.10). The ancient
    texts say only "Stratonicea"; Kallet-Marx takes it as the one "on the
    upper Caicus", where Aristonicus "had had his stronghold" (p. 114). The
    attribution of his cistophori as "King Eumenes" to its mint (Robinson,
    NC 1954) was not read. It stood "before 133" here until October 2026; it
    is first attested in 130, when the consul Perperna took Aristonicus there,
    and Pleiades attests it in the Roman period (30 BC–AD 300).

