    puts Sextius' founding of it under 122. Marius beat the Teutones near it in
    102 (Per. 68). The epitome calls it a colony; Strabo's garrison is the
    likelier reading, and it is not drawn as one. Pliny (3.36) lists it among
    the towns with Latin rights.

