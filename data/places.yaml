- id: tigranocerta
  pleiades: '874774'
  kind: settlement
  location: [41.382, 37.977]
  names:
    - { text: Tigranocerta, preferred: true }
    - { text: Cholimma }
  from: before 77 BCE
  to: after 27 BCE
  prominence: 3
  status:
    - value: royal seat
      from: before 77 BCE
      to: 70 BCE
      note: >-
        Tigranes' new capital, peopled with Greeks and others carried off from
        Cappadocia and Cilicia; Lucullus took it after the battle of 6 October
        69 and sent the settlers home (Plut. Lucullus 26, 29; Strabo 11.14.15,
        12.2.9; App. Mithr. 67, 84–86).
  labelSide: e
  sources:
    - source: pleiades
      locator: places/874774
      url: https://pleiades.stoa.org/places/874774/json
      quote: >-
        reprPoint: [41.38204995464358, 37.977039393010486]
      supports: [location]
    - source: appian
      locator: 'Mithr. 67'
      quote: >-
        But now Sulla had just died … So Mithridates persuaded his son-in-law,
        Tigranes, to make an incursion into Cappadocia … settled them, with
        others, in a certain place where he had first assumed the diadem of
        Armenia and which he had called after himself, Tigranocerta
      supports: [from, status]
    - source: broughton-mrr
      locator: 'vol. II, 78 B.C., p. 85'
      url: https://archive.org/download/broughton-magistrates-roman-republic/Broughton_Magistrates_Roman_Republic_djvu.txt
      quote: >-
        78 B.C. A.U.C. 676 Consuls … Lepidus quarreled with his colleague,
