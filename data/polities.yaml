    - { text: Eumenes III }
  from: 133 BCE
  to: 130 BCE
  ruler: Aristonicus (King Eumenes), 133–130
  sources:
    - { source: strabo, locator: '14.1.38' }
    - { source: florus, locator: '1.35.4–7' }
    - { source: justin, locator: '36.4' }
    - { source: eutropius, locator: '4.20' }
    - { source: orosius, locator: '5.10.1–5' }
    - { source: velleius, locator: '2.4.1' }
    - { source: kallet-marx-1995, locator: 'p. 114' }
  confidence: certain
  review: draft
  note: >-
    Eumenes II's bastard son, who claimed Attalus' kingdom against the will.
    He raised Leucae, lost a sea battle to the Ephesians off Cyme, and went
    inland with the poor and the slaves he called Heliopolitae; he took
    Thyateira and Apollonis (Strabo 14.1.38) and by force Myndus, Samos and
    Colophon (Florus 1.35.4). He beat and killed the consul Crassus near Leucae
    (131 or 130), was beaten by Perperna and starved out of Stratonicea, where he
    had fled (Eutropius 4.20; Orosius 5.10), late in 130 or in the winter
    after, and died in prison at Rome; Aquillius finished the war in 129. His
    extent is not known — cities and fortresses, not a territory — so he is
    drawn as a seat (seats.yaml).

