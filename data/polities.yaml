    Pompey's annexation; the end of the Seleucid kingdom. Cassius' in 43–42;
    then Antony's, governed by Saxa, Ventidius, Sosius and others. Overrun by
    the Parthians in 40, all but Tyre (Dio 48.26.1), and recovered in 39; the
