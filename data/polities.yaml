- id: sextus-pompeius
  kind: command
  names:
    - { text: Sextus Pompeius, preferred: true }
    - { text: Sex. Pompeius Magnus Pius, lang: la }
  from: { earliest: 43 BCE, latest: 42 BCE }
  to: 36 BCE
  ruler: Sex. Pompeius, 43–36
  sources:
    - { source: cassius-dio, locator: '48.17.4–19.1' }
    - { source: appian, locator: 'BC 4.84–85' }
    - { source: appian, locator: 'BC 5.72' }
    - { source: appian, locator: 'BC 5.126' }
    - { source: welch-2012 }
  confidence: certain
  review: draft
  note: >-
    Pompey's younger son. The senate gave him the fleet and the coasts in 43
    (Dio 46.40.3; Vell. 2.73.2); condemned with Caesar's assassins later that
    year (Dio 48.17.2), he held Sicily from 43/42, Sardinia and Corsica through
    his freedman Menodorus in 40–38, and was recognised by the triumvirs at
    Misenum in 39 as governor of Sicily, Sardinia, Corsica and (on paper) the
    Peloponnese, which Antony never handed over (Dio 48.36.4–5, 48.39.1; App.
    BC 5.72, 5.77). Beaten at Naulochus in 36, killed at Miletus in 35 (App. BC
    5.144). A Roman commander, not a state: the provinces he held stayed
    provinces, so his ground is occupation.

- id: achaea
