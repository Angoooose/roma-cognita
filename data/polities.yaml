  review: draft
  note: >-
    The Hasmonean state: a vassal of Antiochus VII after his siege of
    Jerusalem (134–132) until his death in 129 (AJ 13.236–248, 13.273), then
    independent, growing under Hyrcanus I, Aristobulus I and Jannaeus from
    Judaea and Peraea into Idumaea, Samaria, Galilee, the coast from Carmel to
    Raphia and the Greek cities across the Jordan (AJ 13.254–397). Pompey takes
    Jerusalem, 63; Antipater procurator from 47. Antony made Herod
    and Phasael tetrarchs under Hyrcanus in 41 (AJ 14.324–326). The Parthians
    carried off Hyrcanus in 40 and made Antigonus king (judaea-antigonus); the
    senate made Herod king the same year (AJ 14.381–385), and he took Jerusalem
    in 37. Cleopatra had Jericho and the coast from 36 (claims.yaml); in 30
    Octavian gave them back and added Samaria, Gadara, Hippos, Gaza, Anthedon,
    Joppa and Strato's Tower (AJ 15.217; BJ 1.396). Josephus' two
    chronologies of the Hasmoneans disagree: counting his reign lengths back
    from 63 (Aristobulus II three years and three months, Alexandra nine,
    Jannaeus twenty-seven, Aristobulus I one, Hyrcanus thirty-one) gives the
    first dates in ruler; his consuls of 69 for the start of the brothers' war
    (AJ 14.4), which Schürer follows, give those in brackets. The ruler line
    read 134–104, 104–103, 103–76, 76–67 and 67–63 alone until October 2026.

