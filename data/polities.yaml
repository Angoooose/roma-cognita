# The register of political units, independent of the ground they held. What
# ground each held is in claims.yaml; how each stood to Rome is in
# relations.yaml. `kind` says only what sort of thing the polity was.
#
# Confidence: `certain`, the date is fixed by an event everyone agrees on;
# `probable`, the standard accounts converge; `uncertain`, not settled.
# Anything that wants a human with the books open is review: needs-check.
#
# Dates. `from` is the province's creation where one is recorded. Every other
# `before 133 BCE` / `after 27 BCE` marks where the 133–27 BCE window cuts the
# record off: the polity existed at that year and this data says nothing about
# how far beyond it (see data/README.md, "Open ends"). The year of a transition
# belongs to the successor: a kingdom annexed in 46 ends in 47.

- id: rome
  kind: state
  names:
    - { text: Roma, lang: la, preferred: true }
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - source: appian
      locator: 'BC 1.9'
      quote: >-
        At length Tiberius Sempronius Gracchus, an illustrious man, eager for
        glory, a most powerful speaker, and for these reasons well known to all,
        delivered an eloquent discourse, while serving as tribune
      supports: [from]
    - source: res-gestae
      locator: '34'
      quote: >-
        In my sixth and seventh consulships, after I had extinguished civil
        wars, and at a time when with universal consent I was in complete
        control of affairs, I transferred the republic from my power to the
        dominion of the senate and people of Rome.
      supports: [kind, to]
    - { source: broughton-mrr }
  confidence: certain
  review: draft
  note: >-
    The other end of every province-of and client-of relation. In force at
    133, Tiberius Gracchus' tribunate (App. BC 1.9), and at 27, when Augustus
    in his sixth and seventh consulships (28–27) handed the republic back to
    the senate and people (RG 34).

- id: italia
  kind: citizen-territory
  names:
    - { text: Italia, lang: la, preferred: true }
  from: 90 BCE
  to: after 27 BCE
  sources:
    - source: appian
      locator: 'BC 1.40'
      quote: >-
        The Romans were led by the consuls Sextus Julius Caesar and Publius
        Rutilius Lupus
      supports: [from]
    - source: appian
      locator: 'BC 1.49'
      quote: >-
        The Senate also voted that those Italians who had adhered to their
        alliance should be admitted to citizenship, which was the one thing they
        all desired most. They sent this decree around among the Etruscans, who
        gladly accepted the citizenship.
      supports: [kind, from]
    - source: appian
      locator: 'BC 1.50'
      quote: >-
        The insurgents along the Adriatic coast, before they learned of the
        change of sentiment among the Etruscans, sent 15,000 men to their
        assistance by a long and difficult road. Gnaeus Pompeius, who was now
        consul
      supports: [from]
    - source: cicero-balb
      locator: '21'
      quote: >-
        even by the Julian law itself, by which the rights of citizenship were
        given to the allies and to the Latins
      supports: [kind]
    - source: velleius
      locator: '2.20.2'
      quote: >-
        although the citizenship had been given to Italy with the proviso that
        the new citizens should be enrolled in but eight tribes
      supports: [kind]
    - source: res-gestae
      locator: '16'
      quote: >-
        I paid cash to the towns for the lands that I assigned to soldiers in
        my fourth consulship, and later in the consulship of Marcus Crassus and
        Gnaeus Lentulus … The sum amounted to about 600,000,000 sesterces paid
        for lands in Italy, and about 260,000,000 disbursed for provincial
        lands.
      supports: [to]
    - source: cicero-arch
      locator: '7'
      quote: >-
        The freedom of the city was given him in accordance with the provisions
        of the law of Silvanus and Carbo
      supports: []
  confidence: certain
  review: draft
  note: >-
    Italy enfranchised by the Social War: the lex Iulia of 90 gave citizenship
    to the Latins and the allies who had stayed loyal (App. BC 1.49; Cic. Balb.
    21), the lex Plautia Papiria of 89 to the rest who registered (Cic. Arch.
    7); the Samnites and Lucanians came in last, in 87. Begins at the lex
    Iulia: it was { 90, 89 } until September 2026, which drew it from 89 and
    left the year of the first law to nobody. Before 90 the citizen land is
    ager-romanus, and each part of Italy passes to italia in the year it was
    enfranchised or submitted (claims.yaml). Citizen territory is not a
    province and had no governor; it is modelled as a polity so the ground can
    be claimed by it and named ITALIA. Appian puts the senate's grant among
    the events of the consuls Julius Caesar and Rutilius (BC 1.40, 1.49),
    before Pompeius Strabo's consulship of 89 (1.50), hence 90; the Res Gestae
    still sets Italy's land against the provinces' in 14 (RG 16).

# --- Italy before the Social War (added September 2026, the extension to 133) --
# Before 90 the peninsula was a patchwork: the Roman citizen land (ager-romanus),
# the Latin colonies (drawn as places, status colonia latina) and some 150
# allied communities bound to Rome by treaties (socii). The allies are one
# polity because the treaty unit was the community, not the people, and their
# peoples' frontiers are not recorded; the atoms of the allied regions are cut
# only where the Social War gives them different dates (atoms.yaml). In 91–88
# the insurgents' league (italici) holds its ground against Rome.

- id: ager-romanus
  kind: citizen-territory
  names:
    - { text: Ager Romanus, lang: la, preferred: true }
  from: before 133 BCE
  to: 91 BCE
  sources:
    - source: beloch-1880
      locator: 'p. 68'
      url: https://archive.org/download/deritalischebund00belo/deritalischebund00belo_djvu.txt
      quote: >-
        dass die Ausdehnung der Tribus Pollia und die des römischen
        Bürgergebiets in der Gallia Cisalpina bis zum Socialkriege sich
        einander decken, und dass also zur Bestimmung der Ausdehnung des Ager
        Romanus
      supports: [kind, to]
    - source: beloch-1880
      locator: 'p. 65'
      url: https://archive.org/download/deritalischebund00belo/deritalischebund00belo_djvu.txt
      quote: >-
        Mutiua heisst bei Polybios (III 40) schon damals Colonie, und ist
        jedenfalls seitdem beständig im römischen Besitze geblieben
      supports: [from]
    - source: beloch-1880
      locator: 'p. 67'
      url: https://archive.org/download/deritalischebund00belo/deritalischebund00belo_djvu.txt
      quote: >-
        wie alle Bürgergemeinden des diesseitigen Galliens bis auf den
        Socialkrieg in die Tribus Pollia eingeschrieben worden sind : Mutina,
        Parma, Regium Lepidi, Forum Cornelii, Faventia
      supports: [kind, from, to]
    - source: appian
      locator: 'BC 1.40'
      quote: >-
        The Romans were led by the consuls Sextus Julius Caesar and Publius
        Rutilius Lupus
      supports: [to]
    - source: appian
      locator: 'BC 1.49'
      quote: >-
        The Senate also voted that those Italians who had adhered to their
        alliance should be admitted to citizenship
      supports: [to]
    - { source: beloch-1880, locator: 'ch. III, pp. 43–64' }
  confidence: certain
  review: draft
  note: >-
    The land of the Roman citizens before the Social War: Latium, southern
    Etruria, the Sabine country, Picenum and the Gallic land on the Adriatic,
    the strip of Umbria along the Via Flaminia, and northern Campania, with the
    confiscated public land in the south and the citizen colonies of Cispadane
    Gaul (Beloch ch. III). It did not end so much as grow into italia: from 90
    the enfranchised allies joined it and the whole is drawn as Italia.

- id: socii
  kind: league
  names:
    - { text: Socii, lang: la, preferred: true }
  from: before 133 BCE
  to: 82 BCE
  sources:
    - source: beloch-1880
      locator: 'p. 176'
      url: https://archive.org/download/deritalischebund00belo/deritalischebund00belo_djvu.txt
      quote: >-
