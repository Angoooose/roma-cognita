- id: sophene
  kind: kingdom
  names:
    - { text: Sophene, lang: la, preferred: true }
  from: before 133 BCE
  to: 95 BCE
  ruler: The line of Zariadris, to Artanes
  sources:
    - { source: strabo, locator: '11.14.15' }
    - { source: sullivan-1990 }
  confidence: probable
  review: needs-check
  note: >-
    The Armenian kingdom of the Zariadrids west of the Tigris, seated at
    Carcathiocerta, independent since Antiochus III's defeat by Rome (Strabo
    11.14.15: "they joined the Romans and were ranked as autonomous, with the
    title of king"). Tigranes deposed its last king,
    Artanes, soon after his accession (Strabo 11.14.15), c. 95–94.

- id: paphlagonia
  kind: kingdom
  names:
    - { text: Paphlagonia, lang: la, preferred: true }
  from: 63 BCE
  to: after 27 BCE
  ruler: Attalus, to 40; Castor, 40–37/36; Deiotarus Philadelphus, from 37/36
  sources:
    - { source: strabo, locator: '12.3.1' }
    - { source: appian, locator: 'Mithr. 114' }
    - { source: cassius-dio, locator: '48.33.5' }
    - { source: strabo, locator: '12.3.41' }
    - { source: magie-1950, locator: 'vol. I, 434, 443' }
  confidence: probable
  review: needs-check
  note: >-
    Castor had "the domains of Attalus" from 40 (Dio 48.33.5), and his son
    Deiotarus Philadelphus, "who possessed Gangra", was the last king (Strabo
    12.3.41). Magie (I 434) gives the kings of Paphlagonia the Amnias basin
    with Pompeiopolis as well, by 37/36 at the latest; its date is not known and
    it stays with the pontus atom. Philadelphus went over to Octavian before
    Actium (Plut. Antony 63.3, as Magie I 443 reads it) and kept his kingdom.

- id: comana-pontica
  kind: city-state
  names:
    - { text: Comana, lang: la, preferred: true }
  from: 63 BCE
  to: after 27 BCE
  ruler: 'the priests of Ma: Archelaus, then Lycomedes from 47; Cleon, 31/30; Dyteutus, from c. 29'
  sources:
    - { source: strabo, locator: '12.3.34–35' }
    - { source: strabo, locator: '12.8.9' }
    - { source: cassius-dio, locator: '51.2.2–3' }
  confidence: probable
  review: draft
  note: >-
    Antony enlarged Lycomedes' domain by four hundred schoeni (Strabo
    12.3.35). After Actium Octavian deposed him and gave his kingdom to "one
    Medeius", who had turned the Mysians against Antony (Dio 51.2.2–3); Strabo
    has the Mysian brigand chief Cleon, rewarded for the same, receive the
    priesthood and die within a month (12.8.9), and then Dyteutus son of
    Adiatorix (12.3.35). Medeius and Cleon may be one man.

- id: olba
  kind: kingdom
  names:
    - { text: Olba, lang: la, preferred: true }
  from: 67 BCE
  to: after 27 BCE
  ruler: the Teucrid priest-dynasts; Aba, by Antony's and Cleopatra's favour, then her descendants
  sources:
    - { source: strabo, locator: '14.5.10' }
    - { source: magie-1950, locator: 'vol. I, 434' }
  confidence: probable
  review: needs-check
  note: >-
    The priests of Zeus at Olba had been dynasts of the Tracheia, but "then the
    country was beset by numerous tyrants, and the gangs of pirates were
    organised. And after the overthrow of these they called this country the
    domain of Teucer" (Strabo 14.5.10); so the polity is dated from Pompey's
    war on the pirates in 67. Aba, daughter of Xenophanes, held the priest-dynasty because "both Antony
    and Cleopatra conferred it upon her as a favour"; she was overthrown, "but
    the empire remained with her descendants" (Strabo 14.5.10). Its standing
    under Antony — his client, or Cleopatra's dependant within her grant of
    Rough Cilicia — is not stated, so it stays independent. Strabo's grant of
    "the whole of Cilicia Tracheia except Seleuceia" to Cleopatra and then
    Amyntas (14.5.6) would include Olba's coast at Corycus and Elaeussa;
    Borgia (2017, 305) places Amyntas' holding there. Not drawn.

- id: derbe
  kind: kingdom
  names:
    - { text: Derbe, lang: la, preferred: true }
  from: before 50 BCE
  to: 31 BCE
  ruler: Antipater of Derbe
  sources:
    - { source: strabo, locator: '12.6.3' }
    - { source: dmitriev-2000, locator: 'pp. 359–360, 371 n. 81' }
    - { source: magie-1950, locator: 'vol. I, 443' }
  confidence: probable
  review: needs-check
  note: >-
    Antipater held Derbe and Laranda until Amyntas "attacked and killed
    Derbetes" (Strabo 12.6.3). The date is not recorded: about 36 (Robert), the
    late 30s or early 20s (Mitchell), or after Actium with Octavian's leave
    (Magie I 443), which is the date drawn (Dmitriev 371 n. 81 collects the
    views).

- id: lycia
  kind: league
  names:
    - { text: Lycia, lang: la, preferred: true }
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: strabo, locator: '14.3.2–3' }
    - { source: mitchell-2005 }
    - { source: behrwald-2000 }
  confidence: certain
  review: draft
  note: >-
    The Lycian League, a free ally of Rome; its treaty with Rome of 24 July 46
    survives. Brutus besieged and destroyed Xanthus in 42 and made the league
    pay taxes (Plut. Brutus 30–32; App. BC 4.82); Antony released it from them
    and urged the rebuilding of Xanthus (App. BC 5.7). The standing did not
    change, so the sack is not drawn.

