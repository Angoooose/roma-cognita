  confidence: probable
  review: needs-check
  note: >-
    Lysanias succeeded his father Ptolemy in 40 and was Antigonus' go-between
    with the Parthians (AJ 14.330); Antony executed him in 36 "on the charge
    that he had favoured Pacorus" and gave much of the land to Cleopatra (Dio
    49.32.5). By 30 Zenodorus "had hired what was called the house of
    Lysanias" (AJ 15.344). Myers (2010) holds that only the southern Beqaa can
    be placed securely; the atom is wider.

- id: emesa
  kind: kingdom
  names:
    - { text: Emesa, lang: la, preferred: true }
  from: before 69 BCE
  to: 31 BCE
  ruler: Sampsiceramus I; Iamblichus I, by 51 to 31; Alexander, 31–30
  sources:
    - { source: sullivan-1990 }
    - { source: cassius-dio, locator: '50.13.7' }
    - { source: cassius-dio, locator: '51.2.2' }
  confidence: probable
  review: needs-check
  note: >-
    Cicero uses the name as a nickname for Pompey in the
    letters to Atticus. Strabo has "Arethusa, belonging to Sampsiceramus and
    Iamblichus his son" (16.2.10). Antony tortured Iamblichus to death before
    Actium (Dio 50.13.7), and his brother Alexander, who had the realm "as a
    reward for accusing" him, was deposed by Octavian and killed after the
    triumph (51.2.2; still a suppliant in 30, Josephus BJ 1.393). The kingdom
    was restored to Iamblichus II only in 20 (Dio 54.9.2).

