    Tarcondimotus' principality in the Amanus and on the middle Pyramus, seated
    at Hierapolis-Castabala. Not Cilicia Tracheia, which is the rough country
    west of the Cilician plain and was not his. Forced into Cassius' alliance in
    43 (Dio 47.26.2), "King and Friend of Antony" (Magie I 434), "king of Upper
    Cilicia" at Actium (Plut. Antony 61.1), where he fell (Dio 50.14.2). His son
    Philopator was deposed by Octavian (Dio 51.2.2), and "the kingship of this
    region was for a time suspended" (Magie I 445) until Tarcondimotus II was
    given it in 20 (Dio 54.9.2). Who held the ground in 30–20 is not known;
    Dmitriev suggests Amyntas, then Archelaus. It is left unclaimed.

