- id: gallia-cisalpina
  kind: province
  names:
    - { text: Gallia Cisalpina, lang: la, preferred: true }
  from: c. 81 BCE
  to: 43 BCE
  sources:
    - { source: cah-ix }
  confidence: probable
  review: draft
  note: >-
    Formally dissolved into Italy in 42 (Dio 48.12.5), so the province ends in
    43 by the successor-takes-the-year rule. The lex Roscia of 49 enfranchised
    the Transpadanes but did not end the province: D. Brutus governed it in
    44–43. Its ground stays provincial to the end of the window.

- id: cyrenae
  kind: province
  names:
    - { text: Cyrenae, lang: la, preferred: true }
  from: c. 74 BCE
  to: 28 BCE
  sources:
    - { source: livy-per, locator: '70' }
    - { source: appian, locator: 'BC 1.111' }
    - { source: sallust-hist, locator: '2.43 M' }
  confidence: probable
  review: draft
  note: >-
    Bequeathed to Rome in 96, organised as a province c. 74. Given with Crete
    to Cassius (or Brutus) in 44 (App. BC 3.8), then Antony's. Promised to
    Cleopatra Selene in 34 (Dio 49.41.3; see cyrenaica-selene); Scarpus' army,
    which went over to Octavian after Actium, stood "in Africa" to guard Egypt
    (Dio 51.5.6). Kept apart from Crete until 27, when the joint province is
    first attested (see creta-cyrenae).

- id: creta
  kind: province
  names:
    - { text: Creta, lang: la, preferred: true }
  from: 66 BCE
  to: 28 BCE
  sources:
    - { source: velleius, locator: '2.38.6' }
    - { source: livy-per, locator: '100' }
    - { source: cassius-dio, locator: '36.17a–19' }
  confidence: probable
  review: draft
  note: >-
    Conquered by Q. Caecilius Metellus, 69–67. Probably administered with
    Cyrenae as a single command from soon after the conquest, but the date of
    the union is not settled, so it is kept as its own unit rather than
    asserting one. Brought over to Brutus by his officer Lepidus in 42 (App. BC
    5.2), then Antony's; an Antonian officer, Crassus, struck the same coins at
    Cnossus and at Cyrene (RPC I 914–917), which suggests one command. In 36
    Antony gave "parts of Crete" to Cleopatra's children (Dio 49.32.5); which
    parts is not known, so nothing is drawn. Cydonia and Lappa were freed after
    Actium (Dio 51.2.3).

- id: syria
