      supports: [kind]
    - source: beloch-1880
      locator: 'p. 169'
      url: https://archive.org/download/deritalischebund00belo/deritalischebund00belo_djvu.txt
      quote: >-
        diesem Umfang ist der samnitische Bund als Glied in die italische
        Eidgenossenschaft eingetreten und hat ihr bis zum Socialkriege angehört
      supports: [kind, from]
    - source: appian
      locator: 'BC 1.34'
      quote: >-
        Fulvius Flaccus in his consulship first openly excited among the
        Italians the desire for Roman citizenship, so as to be partners in the
        hegemony instead of subjects.
      supports: [from]
    - source: granius-licinianus
      locator: 'p. 32.7–14'
      url: https://archive.org/download/granilicinianiqu00liciuoft/granilicinianiqu00liciuoft_djvu.txt
      quote: >-
        quos equites a consu|libus Claudio et Servilio | missi conciderunt …
        Data erat et Sul|lae proviwcia Gallia Cisal
      supports: [to]
    - source: broughton-mrr
      locator: 'vol. II, 81 B.C., p. 74'
      url: https://archive.org/download/broughton-magistrates-roman-republic/Broughton_Magistrates_Roman_Republic_djvu.txt
      quote: >-
        Within this year Sulla celebrated his triumph over Mithridates … and
        probably carried through the major portion of his administrative and
        constitutional reforms
      supports: [to]
    - source: cicero-balb
      locator: '32'
      quote: >-
        But some treaties are in existence, as for instance those with the
        Germans, the Insubres, the Helvetians, and the Iapidae, and with some of
        the barbarian tribes in Gaul in which there is a special exception made
        that no one of them is to be received by us as a citizen of Rome.
      supports: []
    - { source: beloch-1880, locator: 'ch. VIII, pp. 158–175; ch. X, pp. 201–215' }
    - { source: cicero-balb, locator: '21, 50' }
    - { source: appian, locator: 'BC 1.39' }
    - { source: asconius-pis, locator: '3 C' }
  confidence: certain
  review: draft
  note: >-
    Rome's Italian allies, the "Italian league under Rome's hegemony" of
    Beloch's title: some 150 communities, peoples and leagues, each bound by
    its own treaty, sovereign at home but with no foreign policy of their own,
    owing troops by the list of the togati. One polity, not one per people:
    the treaty unit was the community (Beloch ch. VIII counts at least 11
    allied cities in Etruria and 16 in Umbria), and no source draws the
    peoples' frontiers. In the peninsula they end with the Social War (91–87);
    beyond the Po the Cenomani, the Veneti and the Insubres, whose treaty barred
    their men from Roman citizenship (Cic. Balb. 32), and the Ligurians left
    allied run on until the province of c. 81, Latin communities from the lex
    Pompeia of 89 (Asconius, Pis. 3 C). The end is the province's start
    (gallia-cisalpina): Sulla's reforms of 81 (MRR) and the province "given"
    to Sulla by Granius' account of 79. Cicero still names treaties with the
    Insubres in 56 (Balb. 32): the treaties outlived the league as the map
    draws it, which is a choice of drawing, not a date in the sources.

- id: italici
  kind: league
  names:
    - { text: Italici, lang: la, preferred: true }
    - text: Italia
      lang: la
      note: >-
        The insurgents' own name for their state and its capital, Corfinium
        renamed (Vell. 2.16.4; Strabo 5.4.2 "Italica"; Diodorus 37.2.7). Not
        preferred, so the map does not letter two Italias at once.
    - text: Víteliú
      lang: osc
      note: The Oscan form, on the insurgents' coins.
  from: 91 BCE
  to: 88 BCE
  ruler: >-
    two consuls a year and a senate of 500 (Diodorus 37.2.5–6): Q. Poppaedius
    Silo the Marsian and C. Papius Mutilus the Samnite, the first chosen, 91
    or 90
  sources:
    - source: diodorus
      locator: '37.2.2'
      quote: >-
        these were the sparks which at length broke forth into a flame at the
        time when Lucius Marcius Philippus and Sextus Julius were consuls
      supports: [from]
    - source: velleius
      locator: '2.15.1'
      quote: >-
        in the consulship of Lucius Caesar and Publius Rutilius … all Italy took
        up arms against the Romans. The rebellion began with the people of
        Asculum
      supports: [from]
    - source: diodorus
      locator: '37.2.4'
      quote: >-
        amongst which was Corfinium, a large and famous city, recently
        established as the capital city of the Italians.
      supports: [kind]
    - source: diodorus
      locator: '37.2.5'
      quote: >-
        They had likewise a senate consisting of five hundred members … who made
        a law that two consuls should be chosen every year, and twelve generals.
      supports: [kind, ruler]
    - source: diodorus
      locator: '37.2.6'
      quote: >-
        At this time Quintus Pompaedius Silo, a Marsian, (a person of the
        highest repute in his country), and Gaius Aponius Motylus, a Samnite,
        likewise famous for his noble acts above the rest of his own nation,
        were chosen consuls
      supports: [ruler]
    - source: appian
      locator: 'BC 1.38'
      quote: >-
        They sent envoys to each other secretly, formed a league, and exchanged
        hostages as a pledge of good faith.
      supports: [kind]
    - source: appian
      locator: 'BC 1.53'
      quote: >-
        Such was the course of events throughout Italy as regards the Social
        War, which had raged with violence thus far and until the whole of
        Italy came into the Roman state except the Lucanians and the Samnites.
        These also seem to have obtained what they desired somewhat later.
      supports: [to]
    - source: appian
      locator: 'BC 1.68'
      quote: >-
        They ordered Caecilius Metellus, who was carrying on the remainder of
        the Social War against the Samnites, to make peace on the best terms he
        could … In this way the Samnites became allies of Marius. … They were
        thrust out by Octavius and Pompeius
      supports: [to]
    - source: livy-per
      locator: '80'
      quote: >-
        Citizenship was given to the Italian nations by the Senate. The
        Samnites, the only ones to take up arms again, sided with Cinna and
        Marius. … Cinna and Marius, together with Carbo and Sertorius, attacked
        the Janiculum, but were routed by consul Octavius and retreated.
      supports: [to]
    - { source: diodorus, locator: '37.2.7–11' }
    - { source: strabo, locator: '5.4.2' }
    - { source: velleius, locator: '2.15–17' }
    - { source: appian, locator: 'BC 1.39–52' }
    - { source: livy-per, locator: '72–76' }
  confidence: probable
  review: draft
  note: >-
    The allies in revolt, the Social or "Marsic" War. The rising began at
    Asculum, in 91 or 90 (Livy Per. 72; App. BC 1.38–39); the league took
    Corfinium as its capital, with a senate, consuls and generals on the Roman
    model, and moved to Aesernia when the Marsi and their neighbours gave in
    (Diodorus 37.2.9). By the end of 88 only the Samnites, the Lucanians and
    Nola held out (Diodorus 37.2.11; App. BC 1.53), and the Samnites made
    terms with Marius and Cinna in 87 (App. BC 1.68; Livy Per. 80). Its last
    year, 87, belongs to italia. Its first year is 91 or 90: Diodorus dates
    the outbreak to the consuls Philippus and Sextus Julius, 91 (37.2.2),
    Velleius the rising, Asculum's first, to the consuls L. Caesar and
    Rutilius, 90 (2.15.1). It stays 91, since the claims on the allied
    atoms start then, but is probable, not certain, until they can be made a
    range with it (October 2026). The ruler named Silo and Mutilus consuls
    for 90 until then: Diodorus has them chosen "at this time", as the war
    began (37.2.6), and gives no year of their own. Drawn in a colour of its own: an independent
    power at war with Rome, not an ally.

# The two slave kingdoms of Sicily are drawn as seats (seats.yaml): each held
# the interior and some cities of a province Rome never stopped governing from
# Syracuse and Lilybaeum, and no source says how far either reached.

- id: sicily-eunus
  kind: kingdom
  names:
    - { text: Fugitivi, lang: la, preferred: true, note: 'the runaways, as the Latin tradition calls the rebels (Livy Per. 58, 59)' }
    - { text: Syri, lang: la, note: 'Eunus took the name Antiochus and called his followers Syrians (Diodorus 34/35.2.24)' }
  from: before 133 BCE
  to: 133 BCE
  ruler: Eunus, called Antiochus, c. 135–132
  sources:
    - { source: diodorus, locator: '34/35.2.10–24, 34/35.2.43' }
    - { source: livy-per, locator: '56, 58, 59' }
    - { source: strabo, locator: '6.2.6' }
  confidence: certain
  review: draft
  note: >-
    The first Sicilian slave war. The slaves of Enna rose under the Syrian
    Eunus, made him king in the theatre and took the city; Cleon's band joined
    them from Agrigentum, and their armies beat the praetors (Diodorus
    34/35.2.10–18, 43; Livy Per. 56). The consul Rupilius took Tauromenium and then
    Enna in 132, and Eunus died a prisoner at Morgantina (Diodorus
    34/35.2.20–23; Livy Per. 59); 132 is Rome's. Began c. 135 (Livy Per. 56),
    before the window.

- id: sicily-tryphon
  kind: kingdom
  names:
    - { text: Fugitivi, lang: la, preferred: true, note: 'the runaways of the second Sicilian slave war' }
  from: { earliest: 104 BCE, latest: 103 BCE }
  to: 101 BCE
  ruler: Salvius, called Tryphon, c. 104–c. 102; Athenion, c. 102–101
  sources:
    - { source: diodorus, locator: '36.3–10' }
    - { source: livy-per, locator: '69' }
  confidence: probable
  review: draft
  note: >-
    The second Sicilian slave war. The slaves rose round Heraclea and made
    Salvius king; Athenion was made king in the west, round Segesta and
    Lilybaeum, and then served under Salvius, who took the name Tryphon and
    made the rock of Triocala his royal city (Diodorus 36.4–7). Lucullus and
    then Servilius failed against it, and Athenion succeeded Tryphon; Aquillius,
    consul in 101, killed Athenion and reduced the rest by siege (36.8–10), and
    Livy's epitome puts the end in the book of 100 (Per. 69). Diodorus has the
    war last "almost four years" (36.10.3). The royal city dates from Tryphon's
    proclamation, a year or so into the rising; the last year is taken as 101,
    the war's end, the mopping up of 100 being Rome's.

