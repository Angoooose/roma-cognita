  note: >-
    Numidia annexed after Thapsus. When it was joined to the old province is
    disputed. The traditional date is 27, with the division of the provinces;
    Fishwick and Shaw (1977) and Fishwick (1993, 1994) argue from the Fasti
    Triumphales that Africa was "already united under one governor by 35 B.C."
    Dio's "Africa, Numidia" in the list of 27 (53.12.4) is no evidence either
    way, since he says his list follows the provinces of his own day (53.12.8);
    his "the Africas" of 36 and 32 (49.14.6, 50.6.4) may be geography. The
    claims pass to africa at 27, the latest date; only the line between the two
    Africas is in doubt, not whose ground it was. The polity is kept to 28 to
    match. Juba II's "kingdom of his
    fathers" of 30 (Dio 51.15.6) is not drawn: he exchanged it in 25 for
    Mauretania, its people having "been enrolled in the Roman state" (53.26.2),
    and nothing shows he ruled Numidia in between.

