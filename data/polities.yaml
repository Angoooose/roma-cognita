    away in 40 "and used the name of the Parthians as a pretense" (BJ 1.274),
    and was fined by Ventidius in 39 (Dio 48.41.5). From 36/34 he paid tribute
    to Cleopatra for the "parts of Arabia" Antony gave her, with Herod as
    surety (AJ 15.106–107); that grant was revenue with no attested frontier and
    is not drawn. Herod fought him on Antony's orders in 32–31 (AJ 15.108–160),
    with no change of ground. In 30 "the Arabians about Petra" burned
    Cleopatra's ships (Dio 51.7.1). Obodas (II or III in modern numbering)
    followed Malichus c. 30 (Bowersock 1983). The kingdom was "before 133"
    until October 2026: no readable text shows a Nabataean king between
    Aretas I, a "prince" in 169 who had "not yet assumed the title of king"
    (Schürer), and Aretas II, "king of the Arabians" at Alexander Jannaeus'
    siege of Gaza in 96 (Josephus, AJ 13.360; Schürer). Schürer makes Justin's
    Erotimus (39.5.5–6) the founder of the royal line, but Justin dates him
    only loosely. So the kingdom now opens at 96. The reigns read "Aretas II,
    c. 120/110–96; Obodas I, c. 96–85; Aretas III, c. 85–62" until October
    2026, years from coins in closed books; they now say only what Josephus
    and Schürer state: Aretas II at Gaza in 96, Obodas I c. 90, Aretas III from
    about 85 (Schürer, to 60 "according to the hitherto prevailing view") and
    paying off Scaurus in 62 (AJ 14.80). Malichus I ended in 31 and Obodas
    began in 30 until October 2026, after Bowersock; but Josephus has Malichus
    still king in 30, at Hyrcanus' plot (AJ 15.165), and Schürer has him reign
    to 28 and Obodas king by 28–29, so they now read so.

