  note: Pharnaces II confirmed by Pompey in 63; killed after Zela.

- id: thracia-odrysae
  kind: kingdom
  names:
    - { text: Thracia, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Sadalas (d. by 43/42); the Sapaean brothers Rhascupolis and Rhascus, 42; Sadalas at Actium, 31
  sources:
    - { source: sullivan-1990 }
    - { source: cassius-dio, locator: '47.25.1–2' }
    - { source: appian, locator: 'BC 4.87' }
    - { source: cassius-dio, locator: '51.25.4–5' }
  confidence: probable
  review: needs-check
  note: >-
    The Thracian kings' authority over the inland tribes was intermittent
    throughout. The ruler string names only kings the ancient texts name for
    43–27: Brutus took over the land of Sadalas, "who had died childless and had
    left it to the Romans" (Dio 47.25.1), in 43/42 — not drawn, since the kings
    were back by Actium (Plut. Ant. 61.1); Rhascupolis and Rhascus were
    "ruling one country", the Sapaei and Corpili, at Philippi (App. BC 4.87).
    The modern king lists (Dessau, Sullivan; revised by Tačeva and Delev) are
    reconstructions and disputed. In 28 Crassus overran Thrace "except the
    territory of the Odrysae" and gave them Dionysus' land taken from the Bessi
    (Dio 51.25.4–5): a client, not annexed.

- id: galatia
  kind: kingdom
  names:
    - { text: Galatia, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Deiotarus, c. 63–40; Castor, 40–37/36; Amyntas, 36–25
  sources:
    - { source: cicero-deiotaro }
    - { source: cassius-dio, locator: '48.33.5' }
    - { source: cassius-dio, locator: '49.32.3' }
    - { source: strabo, locator: '12.5.1' }
    - { source: magie-1950, locator: 'vol. I, 433–434, 443' }
  confidence: probable
  review: draft
  note: >-
    Deiotarus confirmed by Pompey in 63. At his death in 40 his lands and
    Paphlagonia went to his grandson Castor (Dio 48.33.5; Magie I 433), and in
    37/36 to Amyntas, Antony's king in Pisidia since 39 (App. BC 5.75), who
    received Galatia "with Lycaonia and portions of Pamphylia" (Dio
    49.32.3). He went over to Octavian before Actium and was confirmed and
    enlarged with Cleopatra's Rough Cilicia (Dio 51.2.1; Strabo 14.5.6): his
    kingdom ran "from the mountains of northern Galatia to the shore of the
    Mediterranean" (Magie I 434) until his death in 25, when it became a
    province (Dio 53.26.3). The Pontic lands went to Darius in 39.

- id: cappadocia
  kind: kingdom
  names:
    - { text: Cappadocia, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Ariobarzanes III, 51–43/42; Ariarathes X, 43/42–36; Archelaus (Sisines), from 36
  sources:
    - { source: sullivan-1990 }
    - { source: cicero-fam, locator: XV }
    - { source: cassius-dio, locator: '49.32.3' }
    - { source: strabo, locator: '12.2.11' }
    - { source: luke-2025 }
  confidence: probable
  review: draft
  note: >-
    Cicero was charged with protecting Ariobarzanes during his Cilician
    command. Cassius' cavalry killed him — late 43 on Appian (BC 4.63), in 42
    on Dio (47.33.4) — and Ariarathes X followed. Antony judged between
    Ariarathes and "Sisina" in 41 and gave the kingdom to Sisina (App. BC 5.7),
    but only Ariarathes minted (Luke 2025); in 36 Antony gave Cappadocia to
    Archelaus "after driving out Ariarathes" (Dio 49.32.3). Most take Sisines
    and Archelaus to be one man (Magie I 435); Syme took them for two. Kept by
    Octavian (Dio 51.2.1).

- id: commagene
  kind: kingdom
  names:
    - { text: Commagene, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Antiochus I, c. 70–36 (or later); Mithridates II by 31
  sources:
    - { source: sullivan-1990 }
    - { source: facella-2006 }
    - { source: plutarch, locator: 'Antony 34' }
    - { source: cassius-dio, locator: '49.22.1–2' }
  confidence: probable
  review: draft
  note: >-
    Antiochus took in Parthian fugitives after Gindarus and was besieged at
    Samosata by Ventidius and Antony in 38; he made terms (Plut. Antony 34;
    Dio 49.22.1–2, where Antony got no money, against Plutarch's 300 talents).
    He had been fined in 39 for helping Pacorus (Dio 48.41.5). Kept a client
    throughout. Dio 49.23.4 has Phraates kill an Antiochus, grandfather of his
    brothers, c. 37–36; whether this is Antiochus I, and so when he died, is
    disputed. Mithridates II was king at Actium (Plut. Antony 61.1).

- id: judaea
  kind: kingdom
  names:
    - { text: Iudaea, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Hyrcanus II, 63–40; Herod, king from 40, in Jerusalem from 37
  sources:
    - { source: josephus-aj, locator: '14.54–79, 14.143' }
    - { source: josephus-bj, locator: '1.141–158, 1.199' }
    - { source: josephus-aj, locator: '14.381–385' }
    - { source: kokkinos-1998 }
  confidence: probable
  review: draft
  note: >-
    Pompey takes Jerusalem, 63; Antipater procurator from 47. Antony made Herod
    and Phasael tetrarchs under Hyrcanus in 41 (AJ 14.324–326). The Parthians
    carried off Hyrcanus in 40 and made Antigonus king (judaea-antigonus); the
    senate made Herod king the same year (AJ 14.381–385), and he took Jerusalem
    in 37. Cleopatra had Jericho and the coast from 36 (claims.yaml); in 30
    Octavian gave them back and added Samaria, Gadara, Hippos, Gaza, Anthedon,
    Joppa and Strato's Tower (AJ 15.217; BJ 1.396).

- id: ituraea
  kind: kingdom
  names:
    - { text: Ituraea, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Ptolemy son of Mennaeus, to 40; Lysanias, 40–36; Zenodorus (lessee), by 30
  sources:
    - { source: sullivan-1990 }
    - { source: myers-2010 }
    - { source: cassius-dio, locator: '49.32.5' }
  confidence: probable
  review: needs-check
  note: >-
    Lysanias succeeded his father Ptolemy in 40 and was Antigonus' go-between
    with the Parthians (AJ 14.330); Antony executed him in 36 "on the charge
    that he had favoured Pacorus" and gave much of the land to Cleopatra (Dio
    49.32.5). By 30 Zenodorus "had hired what was called the house of
    Lysanias" (AJ 15.344). Myers (2010) holds that only the southern Beqaa can
    be placed securely; the atom is wider.

- id: emesa
  kind: kingdom
  names:
    - { text: Emesa, lang: la, preferred: true }
  from: before 68 BCE
  to: 31 BCE
  ruler: Sampsiceramus I; Iamblichus I, by 51 to 31; Alexander, 31–30
  sources:
    - { source: sullivan-1990 }
    - { source: cassius-dio, locator: '50.13.7' }
    - { source: cassius-dio, locator: '51.2.2' }
  confidence: probable
  review: needs-check
  note: >-
    Cicero uses the name as a nickname for Pompey in the
    letters to Atticus. Strabo has "Arethusa, belonging to Sampsiceramus and
    Iamblichus his son" (16.2.10). Antony tortured Iamblichus to death before
    Actium (Dio 50.13.7), and his brother Alexander, who had the realm "as a
    reward for accusing" him, was deposed by Octavian and killed after the
    triumph (51.2.2; still a suppliant in 30, Josephus BJ 1.393). The kingdom
    was restored to Iamblichus II only in 20 (Dio 54.9.2).

- id: osroene
  kind: kingdom
  names:
    - { text: Osroene, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Abgar II, to 53; Ma'nu II, 52–34; Paqor, 34–29; Abgar III, from 29 (the Edessene list)
  sources:
    - { source: sullivan-1990 }
    - { source: segal-1970 }
  confidence: probable
  review: needs-check
  note: >-
    The kings of Edessa east of the Euphrates, "the boundaries of the Parthian
    empire" (Strabo 16.1.28). The rulers follow the Edessene king-list as
    Segal gives it, whose early dates he says are to be treated with caution.
    Its standing with Rome after the 60s is not known (see relations.yaml).

- id: amanus
  kind: kingdom
  names:
    - { text: Amanus, lang: la, preferred: true }
  from: before 68 BCE
  to: 31 BCE
  ruler: Tarcondimotus I, to 31; Philopator, 31
  sources:
    - { source: sullivan-1990 }
    - { source: strabo, locator: '14.5.18' }
    - { source: cassius-dio, locator: '51.2.2' }
    - { source: magie-1950, locator: 'vol. I, 434, 445' }
  confidence: probable
  review: needs-check
  note: >-
    Tarcondimotus' principality in the Amanus and on the middle Pyramus, seated
    at Hierapolis-Castabala. Not Cilicia Tracheia, which is the rough country
    west of the Cilician plain and was not his. Forced into Cassius' alliance in
    43 (Dio 47.26.2), "King and Friend of Antony" (Magie I 434), "king of Upper
    Cilicia" at Actium (Plut. Antony 61.1), where he fell (Dio 50.14.2). His son
    Philopator was deposed by Octavian (Dio 51.2.2), and "the kingship of this
    region was for a time suspended" (Magie I 445) until Tarcondimotus II was
    given it in 20 (Dio 54.9.2). Who held the ground in 30–20 is not known;
    Dmitriev suggests Amyntas, then Archelaus. It is left unclaimed.

# --- added September 2026: the neighbours of Rome ------------------------------

- id: pontus-regnum
  kind: kingdom
  names:
