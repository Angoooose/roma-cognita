    22.2) with his mother, whom he later imprisoned. The years c. 120 and c. 113
    for his accession and sole rule are modern reckonings; no ancient text
    gives them, though Appian's 57 years of reign (Mithr. 112) counted back
    from 63 give 120. In force in 133: Euergetes was a friend of Rome in the
    Third Punic War (App. Mithr. 10) and was rewarded after Aristonicus'
    capture (Justin 37.1). Ends in 63: Mithridates was alive after the
