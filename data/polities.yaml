# The register of political units, independent of the ground they held. What
# ground each held is in claims.yaml; how each stood to Rome is in
# relations.yaml. cicero-map folded both into one `kind` (citizen / province /
# client); here `kind` says only what sort of thing the polity was.
#
# Migrated from cicero-map/data/polities.json. Its confidence meant: `certain`,
# the date is fixed by an event everyone agrees on; `probable`, the standard
# accounts converge; `check`, not settled and wants a human with the books open.
# `check` became a real confidence plus review: needs-check. Nothing here has
# been re-verified in this project yet, so everything else is review: draft.
#
# Dates. `from` is the province's creation (cicero-map's `since`) where one was
# recorded. Every other `before 68 BCE` / `after 43 BCE` marks where cicero-map's
# 68–43 BCE window cut the record off: the polity existed at that year and this
# data says nothing about how far beyond it (see data/README.md, "Open ends").
# The year of a transition belongs to the successor, as in cicero-map: a
# kingdom annexed in 46 ends in 47.

- id: rome
  kind: state
  names:
    - { text: Roma, lang: la, preferred: true }
  from: before 68 BCE
  to: after 43 BCE
  sources:
    - { source: broughton-mrr }
  confidence: certain
  review: draft
  note: >-
    Added in migration as the other end of every province-of and client-of
    relation. cicero-map had no record for Rome itself because everything on its
    map was implicitly Roman.

- id: italia
  kind: citizen-territory
  names:
    - { text: Italia, lang: la, preferred: true }
  from: { earliest: 90 BCE, latest: 89 BCE }
  to: after 43 BCE
  sources:
    - { source: cicero-map, locator: data/polities.json }
  confidence: certain
  review: draft
  note: >-
    Post-Social War enfranchisement: lex Julia 90, lex Plautia Papiria 89.
    Citizen territory is not a province and had no governor; it is modelled as a
    polity so the ground can be claimed by it and named ITALIA.

