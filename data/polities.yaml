    and Bocchus I, already king under Micipsa, was until the Jugurthine War
    "unknown to us before that time either in peace or in war" (Sall. Jug. 19.7).
    He asked Rome for a treaty early in the war and was refused (Jug. 80.4),
    joined Jugurtha for the promise of a third of Numidia (97.2), and in 105
    handed him over for "friendship, alliance, and the part of Numidia which he
    now desired" (111.1): the land from the Mulucha to about Cap Ténès (Bridoux
