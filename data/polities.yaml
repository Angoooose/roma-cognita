- id: noricum
  kind: kingdom
  names:
    - { text: Noricum, lang: la, preferred: true }
  from: before 133 BCE
  to: after 27 BCE
  ruler: Voccio (fl. 58–49)
  sources:
    - { source: strabo, locator: '4.6.12' }
    - { source: appian, locator: 'Celt. 13' }
    - { source: caesar-bg, locator: '1.53' }
    - { source: caesar-bc, locator: '1.18' }
    - { source: alfoldy-1974, locator: 'chs. 4–5' }
    - { source: cassius-dio, locator: '54.20.2' }
  confidence: probable
  review: needs-check
  note: >-
    A kingdom friendly to Rome until its annexation after the Norican raid on
    Istria in 16 (Dio 54.20.2). No king is securely named for 43–27. The
    Taurisci made to pay tribute in 35 (App. Ill. 16), whom Strabo counts among
    the Norici (4.6.9), lived south of the kingdom drawn here. The locator was
    ch. 3 until September 2026; the first century BCE is chs. 4–5. Polybius
    knew the gold of "the Taurisci Norici" (Strabo 4.6.12), and in 113 they
    were "foreign friends of the Romans" (App. Celt. 13), hence the open start
    at 133.

