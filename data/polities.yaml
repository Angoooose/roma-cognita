# (relations.yaml); `kingdom` here also covers the principalities, tetrarchies
# and phylarchies of the Levant — anything ruled by a dynast.

- id: cyprus-ptolemaic
  kind: kingdom
  names:
    - { text: Cyprus, lang: la, preferred: true }
  from: before 68 BCE
  to: 59 BCE
  ruler: Ptolemy of Cyprus, to 58
  sources:
    - { source: cicero-map, locator: data/polities.json }
  confidence: certain
  review: draft
  note: Annexed in 58 by the lex Clodia and attached to Cilicia.

