- id: bithynia-pontus
  kind: province
  names:
    - { text: Bithynia, lang: la, preferred: true, from: 74 BCE, to: 64 BCE }
    - { text: Bithynia et Pontus, lang: la, preferred: true, from: 63 BCE, to: after 43 BCE }
  from: 74 BCE
  to: after 43 BCE
  sources:
    - { source: magie-1950 }
    - { source: broughton-mrr, locator: vol. II }
  confidence: certain
  review: draft
  note: >-
    Bithynia, bequeathed by Nicomedes IV, from 74; joined with Pontus by
    Pompey's settlement (lex Pompeia) in 63. Bithynia and Pontus are separate
    atoms now, so the province can start with its bequest.

- id: gallia-comata
  kind: province
  names:
    - { text: Gallia Comata, lang: la, preferred: true }
  from: 51 BCE
  to: after 27 BCE
  sources:
    - { source: caesar-bg }
    - { source: cah-ix, locator: ch. 9 }
    - { source: goudineau-1990, locator: '161' }
  confidence: uncertain
  review: needs-check
  note: >-
    Conquered progressively 58–50 and held under Caesar's command, but not
    formally organised as a province until Augustus. Dated from 51, after Alesia
    and the final campaigns; the single date stands in for eight years of
    conquest and is the weakest claim in the dataset. Plancus', then Antony's,
    in 43; Antony's through Calenus to 40, then Octavian's (App. BC 4.2, 5.51).
    None of the fighting of 43–27 moved the ground: Agrippa against the Aquitani
    in 38 (App. BC 5.92), Nonius Gallus against the Treveri and Carrinas against
    the Morini in 30–29 (Dio 51.20.5, 51.21.6), Messalla against the Aquitani in
    28–27. Augustus took a census of the Gauls in 27 (Dio 53.22.5). Its division
    into Aquitania, Lugdunensis and Belgica is dated to 27 (Dio 53.12.5) or to
    16–13; Goudineau (1990) calls the question open, and the province is kept
    whole to 27.

- id: illyricum
  kind: province
  names:
    - { text: Illyricum, lang: la, preferred: true }
  from: 59 BCE
  to: after 27 BCE
  sources:
    - { source: suetonius-iul, locator: '22' }
    - { source: dzino-2010, locator: 'pp. 80–98' }
  confidence: probable
  review: draft
  note: >-
    Assigned to Caesar with Cisalpina by the lex Vatinia of 59; governed with
    it from Aquileia. Vatinius fought the Delmatae there in 45–44.

- id: africa-nova
  kind: province
  names:
    - { text: Africa Nova, lang: la, preferred: true }
  from: 46 BCE
  to: 28 BCE
  sources:
    - { source: bellum-africum, locator: '97' }
    - { source: fishwick-shaw-1977 }
    - { source: fishwick-1993, locator: '53' }
    - { source: fishwick-1994 }
  confidence: certain
  review: needs-check
  note: >-
    Numidia annexed after Thapsus. When it was joined to the old province is
    disputed. The traditional date is 27, with the division of the provinces;
    Fishwick and Shaw (1977) and Fishwick (1993, 1994) argue from the Fasti
    Triumphales that Africa was "already united under one governor by 35 B.C."
    Dio's "Africa, Numidia" in the list of 27 (53.12.4) is no evidence either
    way, since he says his list follows the provinces of his own day (53.12.8);
    his "the Africas" of 36 and 32 (49.14.6, 50.6.4) may be geography. The
    claims pass to africa at 27, the latest date; only the line between the two
    Africas is in doubt, not whose ground it was. The polity is kept to 28 to
    match. Juba II's "kingdom of his
    fathers" of 30 (Dio 51.15.6) is not drawn: he exchanged it in 25 for
    Mauretania, its people having "been enrolled in the Roman state" (53.26.2),
    and nothing shows he ruled Numidia in between.

