- id: bithynia-regnum
  kind: kingdom
  names:
    - { text: Bithynia, lang: la, preferred: true, note: the kingdom of the Nicomedes }
  from: before 133 BCE
  to: 75 BCE
  ruler: >-
    Nicomedes II Epiphanes, to c. 128/127; Nicomedes III Euergetes, c.
    128/127–c. 94; Nicomedes IV Philopator, c. 94–75/74
  sources:
    - { source: appian, locator: 'Mithr. 7, 10–11, 13, 18–20, 60, 71' }
    - { source: memnon, locator: '22.5' }
    - { source: justin, locator: '37.4, 38.1–38.3' }
    - { source: livy-per, locator: '93.2' }
    - { source: eutropius, locator: '6.6.1' }
    - { source: magie-1950 }
  confidence: certain
  review: draft
  note: >-
    A friend of Rome, which sent help against Aristonicus (Strabo 14.1.38).
    Nicomedes III shared Paphlagonia with Mithridates and seized Cappadocia with
    Laodice (Justin 37.4, 38.1). Nicomedes IV, whom the senate recognised, was
    driven out by his brother Socrates Chrestus with Mithridates' troops in 90
    and restored by Aquillius' embassy (App. Mithr. 10–11, 13; Memnon 22.5);
    beaten on the Amnias in the war that followed, he fled to Italy (Mithr.
    18–20; Strabo 12.3.40), and Curio restored him after Dardanus (Mithr. 60).
    He died childless and left the kingdom to Rome (Mithr. 71; Livy Per. 93.2).
    Eutropius puts his death in the consulship of Lucullus and Cotta, 74
    (6.6.1); Livy's epitome tells it among the events of 75. The province is
    dated from 74 (bithynia-pontus), so the kingdom ends with 75. The years of
    the first two kings are modern reckonings.

- id: aristonicus
  kind: kingdom
  names:
