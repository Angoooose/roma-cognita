  from: before 68 BCE
  to: after 27 BCE
  ruler: Pharnaces II, 63–47; Asander (archon, then king), from 47; Dynamis his wife
  sources:
    - { source: appian, locator: 'Mithr. 113, 120' }
  confidence: probable
