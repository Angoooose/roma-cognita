- id: hispania-citerior
  kind: province
  names:
    - { text: Hispania Citerior, lang: la, preferred: true }
  from: 197 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
    - { source: cassius-dio, locator: '53.12.4–5' }
    - { source: perea-yebenes-2017 }
  confidence: certain
  review: draft
  note: >-
    Lepidus' in 43 (App. BC 4.2); Octavian's after Philippi on Dio (48.1.3),
    though Appian calls "Gaul and Spain" Antony's in 40 (BC 5.51); Octavian's
    from 40 in any case. The triumphs "ex Hispania" of 36–26 (Calvinus,
    Norbanus, Philippus, Pulcher, Calvisius, Appuleius) name no province and,
    but for Calvinus' Cerretani, no enemy (Perea Yébenes 2017), so they move no
    frontier. Caesar's in 27 (Dio 53.12.5). Whether Tarraconensis, Baetica and
    Lusitania were created in 27, as Dio's list has it, or in 16–13 is disputed;
    the two Spains are kept to 27 (see hispania-ulterior).

- id: hispania-ulterior
  kind: province
  names:
    - { text: Hispania Ulterior, lang: la, preferred: true }
  from: 197 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
    - { source: cassius-dio, locator: '53.12.4–5' }
    - { source: villanueva-acuna-2011, locator: '70–73' }
  confidence: certain
  review: draft
  note: >-
    Kept whole to the end of the data. Dio lists Baetica for the people and
    Lusitania for Caesar at the settlement of January 27 (53.12.4–5), and
    Albertini (1923) dated the division so; but Dio warns that his list uses
    later arrangements (53.12.8), and Alföldy (1969), Villanueva Acuña (2011,
    2016) and López Barja (2017) put Lusitania's creation later, in 16–13, with
    a separate province north of the Duero before it. Carisius governed "la PH
    Ulterior tal como existió durante el periodo anterior republicano" from 27
    (Villanueva Acuña 2011).

- id: macedonia
  kind: province
  names:
    - { text: Macedonia, lang: la, preferred: true }
  from: 146 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
  confidence: certain
  review: draft
  note: >-
    Includes Greece until Achaea is attested as a province of its own in the
    settlement of 27, which also took Thessaly and southern Epirus (see achaea).
    Brutus held it with Illyricum in 43–42 (Cic. Phil. 10.25–26; App. BC 4.75);
    after Philippi it was Antony's, east of Scodra from Brundisium (App. BC
    5.65), and Octavian's from 31.

- id: africa
  kind: province
  names:
    - { text: Africa, lang: la, preferred: true }
    - text: Africa Vetus
      lang: la
      from: 46 BCE
      to: 28 BCE
      note: >-
        Once Africa Nova is created beside it, until the two are one province,
        by 27 at the latest (see africa-nova).
  from: 146 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
    - { source: cassius-dio, locator: '48.21–23' }
    - { source: cassius-dio, locator: '49.14.6' }
  confidence: certain
  review: draft
  note: >-
    Held for the Republic by Cornificius in 43–42 and taken by T. Sextius, who
    handed both Africas to Fango for Octavian and took them back after Philippi
    (Dio 48.21–22); granted to Lepidus in 41, who came to take possession in 40
    (App. BC 5.12, 5.53; Dio 48.23.5) and held it until his fall in 36, when
    Statilius Taurus took "both the Africas without a struggle" (Dio 49.14.6).

