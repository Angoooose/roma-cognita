    - { source: diophantus-decree }
  confidence: probable
  review: needs-check
  note: >-
    The Crimean Scythians, with their royal seat at Neapolis. Scilurus and his
    sons, "fifty in number" according to Poseidonius (Strabo 7.4.3), fought
