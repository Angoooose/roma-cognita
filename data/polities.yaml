    - { source: pliny-nh, locator: '5.59, 6.177–197' }
    - { source: philae-stele }
  confidence: certain
  review: draft
  note: >-
    The Meroitic kingdom of Kush, 'Aethiopia' to Greek and Roman writers. In 29
    Cornelius Gallus received envoys of its king at Philae: the Latin of his
    stele has the king taken "in tutelam", under protection, the Greek calls
    him a public friend (proxenos). Neither makes Kush a client, and no Roman
    ever held its ground; Lower Nubia went to Gallus' buffer ruler (see
    triakontaschoinos). No Meroitic ruler is securely named for 43–29.

