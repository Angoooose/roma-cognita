  confidence: probable
  review: needs-check
  note: >-
    Divided between the two kings around 49; the arrangement before that is not
    clear enough to date. The kingdom is not in doubt, its internal arrangement
    is, hence probable. Bocchus II took Arabio's western Numidia in 41 (Bridoux
    ¶103, an inference: "se serait emparé") and Bogud's kingdom in 38 (Dio
    48.45.1–3), and at his death in 33 his kingdom went to Rome (Dio 49.43.7;
    see mauretania-roman).

- id: aegyptus
  kind: kingdom
  names:
    - { text: Aegyptus, lang: la, preferred: true }
  from: before 68 BCE
  to: 31 BCE
  ruler: Ptolemy XII to 51, then Cleopatra VII (with Ptolemy XV Caesarion from 44), to 30
  sources:
    - { source: braund-1984 }
    - { source: cassius-dio, locator: '51.19.6' }
    - { source: holbl-2001 }
  confidence: probable
  review: draft
  note: >-
    Recognised socius et amicus in 59; Gabinius restores Ptolemy XII in 55.
    Formally independent throughout. Treated as a client because from 55 a Roman
    garrison sat in Alexandria and the kingdom's foreign policy was not its own.
    Antony's grants of 37/36 and the Donations of 34 added ground in Cyprus,
    Cilicia and the Levant (claims.yaml). Alexandria fell in August 30 (Macrob.
    Sat. 1.12.35; Dio 51.19.6) and the kingdom ends in 31; Egypt from 30 is aegyptus-province.

- id: nabataea
  kind: kingdom
  names:
    - { text: Nabataea, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Aretas III, then Malichus I, to 31; Obodas, from 30
  sources:
    - { source: sullivan-1990 }
    - { source: bowersock-1983 }
  confidence: probable
  review: needs-check
  note: >-
    The kingdom is not in doubt; its extent and its
    standing with Rome are — see the claim and the atom. Malichus turned Herod
    away in 40 "and used the name of the Parthians as a pretense" (BJ 1.274),
    and was fined by Ventidius in 39 (Dio 48.41.5). From 36/34 he paid tribute
    to Cleopatra for the "parts of Arabia" Antony gave her, with Herod as
    surety (AJ 15.106–107); that grant was revenue with no attested frontier and
    is not drawn. Herod fought him on Antony's orders in 32–31 (AJ 15.108–160),
    with no change of ground. In 30 "the Arabians about Petra" burned
    Cleopatra's ships (Dio 51.7.1). Obodas (II or III in modern numbering)
    followed Malichus c. 30 (Bowersock 1983).

- id: bosporus
  kind: kingdom
  names:
