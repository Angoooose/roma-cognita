  note: >-
    The Hasmonean Antigonus, made king by the Parthians when they took
    Jerusalem in 40, until Sosius and Herod took the city in 37 and he was
    beheaded at Antioch (AJ 14.487, 15.8–10). A polity of its own because in
    39–38 there were two Jewish governments: Antigonus in Jerusalem, and Rome's
    king Herod in Joppa, Idumaea and Galilee. The kingdom's last year, 37,
