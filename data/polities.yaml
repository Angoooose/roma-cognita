- id: bithynia-pontus
  kind: province
  names:
    - { text: Bithynia et Pontus, lang: la, preferred: true }
  from: 63 BCE
  to: after 43 BCE
  sources:
    - { source: cicero-map, locator: data/polities.json }
  confidence: certain
  review: draft
  note: >-
    Pompey's settlement of the East; lex Pompeia. Bithynia alone was provincial
    from the bequest of 74, but the ground drawn includes Pontus, which was not,
    so the province is dated from 63 rather than 74 — an under-claim.

- id: gallia-comata
  kind: province
  names:
    - { text: Gallia Comata, lang: la, preferred: true }
  from: 51 BCE
  to: after 43 BCE
  sources:
    - { source: caesar-bg }
    - { source: cah-ix, locator: ch. 9 }
  confidence: uncertain
  review: needs-check
  note: >-
    Conquered progressively 58–50 and held under Caesar's command, but not
    formally organised as a province until Augustus. Dated from 51, after Alesia
    and the final campaigns; the single date stands in for eight years of
    conquest and is the weakest claim in the dataset. (cicero-map: check.)

