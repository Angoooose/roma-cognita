    - { source: sherwin-white-1984, locator: 'chs. 7–8' }
  confidence: certain
  review: draft
  note: >-
    Mithridates' kingdom in its last years: he won back Pontus in 68 and was
    driven out by Pompey in 66, fleeing by Colchis to the Bosporus, where he
    died in 63.

- id: armenia
  kind: kingdom
  names:
    - { text: Armenia, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Tigranes II, 95–55; Artavasdes II, 55–34; Artaxias II, from 34 (in Armenia from 32–30)
  sources:
    - { source: strabo, locator: '11.14' }
    - { source: plutarch, locator: 'Pompey 33' }
    - { source: sherwin-white-1984, locator: 'chs. 8–12' }
  confidence: certain
  review: draft
  note: >-
    Tigranes submitted to Pompey in 66 and kept Armenia as a friend and ally of
    Rome. Canidius made Armenia an ally again in 37/36; Artavasdes II deserted
    Antony in Media in 36, and in 34 Antony seized him and occupied the country
    (Dio 49.39–40), which he promised to Alexander Helios. Artavasdes' son
    Artaxias, proclaimed king by the Armenians, fled to Parthia and came back
    with its help when Antony withdrew, killing the Romans left behind (Tac.
    Ann. 2.3; Dio 51.16.2).

- id: parthia
  kind: kingdom
  names:
    - { text: Parthia, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Phraates III, c. 70–57; Orodes II, 57–38/37; Phraates IV from 38/37 (the usurper Tiridates II c. 31–30)
  sources:
    - { source: debevoise-1938, locator: 'pp. 70–108' }
    - { source: sherwin-white-1984, locator: 'chs. 10–12' }
    - { source: debevoise-1938, locator: 'pp. 108–138' }
    - { source: cassius-dio, locator: '51.18.2–3' }
  confidence: certain
  review: draft
  note: >-
    Pacorus and Labienus overran Syria and Asia in 40 (the occupation rows);
    Pacorus fell at Gindarus in 38. Orodes gave up the throne to Phraates IV,
    who "came into power shortly before 37 B.C." (Debevoise 121). Antony's
    campaign of 36 went through Armenia to Phraaspa in Media and failed. The
    usurper Tiridates drove Phraates out c. 31 and fled to Syria in 30/29 (Dio
    51.18.2–3); he struck coins again in 26–25. Not drawn: nothing divides the
    ground. The Euphrates stayed the frontier (Strabo 16.1.28).

- id: atropatene
  kind: kingdom
  names:
    - { text: Media Atropatene, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Ariobarzanes I; Artavasdes I, to c. 31 (in exile with Octavian from 30)
  sources:
    - { source: strabo, locator: '11.13.1–2' }
    - { source: schottky-1989 }
    - { source: plutarch, locator: 'Antony 38' }
    - { source: cassius-dio, locator: '49.33.1–2' }
  confidence: probable
  review: needs-check
  note: >-
    A Parthian vassal whose capital Antony besieged in 36 (Plut. Antony 38;
    Strabo 11.13.3); its king then changed sides and was Antony's ally from 35
    to 31, when Phraates took the kingdom and the Mede fled to Octavian (Dio
    49.44.4, 51.16.2), who later gave him Lesser Armenia
    (armenia-minor-artavasdes).

- id: iberia-caucasia
  kind: kingdom
