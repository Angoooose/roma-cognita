  note: >-
    Pompey's younger son. The senate gave him the fleet and the coasts in 43
    (Dio 46.40.3; Vell. 2.73.2); condemned with Caesar's assassins later that
    year (Dio 48.17.2), he held Sicily from 43/42, Sardinia and Corsica through
    his freedman Menodorus in 40–38, and was recognised by the triumvirs at
    Misenum in 39 as governor of Sicily, Sardinia, Corsica and (on paper) the
