- id: hispania-citerior
  kind: province
  names:
    - { text: Hispania Citerior, lang: la, preferred: true }
  from: 197 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
    - { source: cassius-dio, locator: '53.12.4–5' }
    - { source: perea-yebenes-2017 }
    - { source: appian, locator: 'Hisp. 98–100' }
    - { source: strabo, locator: '3.5.1' }
  confidence: certain
  review: draft
  note: >-
    Lepidus' in 43 (App. BC 4.2); Octavian's after Philippi on Dio (48.1.3),
    though Appian calls "Gaul and Spain" Antony's in 40 (BC 5.51); Octavian's
    from 40 in any case. The triumphs "ex Hispania" of 36–26 (Calvinus,
    Norbanus, Philippus, Pulcher, Calvisius, Appuleius) name no province and,
    but for Calvinus' Cerretani, no enemy (Perea Yébenes 2017), so they move no
    frontier. Caesar's in 27 (Dio 53.12.5). Whether Tarraconensis, Baetica and
    Lusitania were created in 27, as Dio's list has it, or in 16–13 is disputed;
    the two Spains are kept to 27 (see hispania-ulterior). Before 68: the
    Arevaci are its from the fall of Numantia in 133 (App. Hisp. 98), the
    Baliares from Metellus' conquest of 123 (Strabo 3.5.1); the Celtiberian
    risings put down by T. Didius and C. Valerius Flaccus in 98–92 (Hisp.
    99–100) moved no frontier. In 77–73 most of it was Sertorius' (the polity
    sertorius).

- id: hispania-ulterior
  kind: province
  names:
    - { text: Hispania Ulterior, lang: la, preferred: true }
  from: 197 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
    - { source: cassius-dio, locator: '53.12.4–5' }
    - { source: villanueva-acuna-2011, locator: '70–73' }
  confidence: certain
  review: draft
  note: >-
    Kept whole to the end of the data. Dio lists Baetica for the people and
    Lusitania for Caesar at the settlement of January 27 (53.12.4–5), and
    Albertini (1923) dated the division so; but Dio warns that his list uses
    later arrangements (53.12.8), and Alföldy (1969), Villanueva Acuña (2011,
    2016) and López Barja (2017) put Lusitania's creation later, in 16–13, with
    a separate province north of the Duero before it. Carisius governed "la PH
    Ulterior tal como existió durante el periodo anterior republicano" from 27
    (Villanueva Acuña 2011).

- id: macedonia
  kind: province
  names:
    - { text: Macedonia, lang: la, preferred: true }
  from: 146 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
  confidence: certain
  review: draft
  note: >-
    Includes Greece until Achaea is attested as a province of its own in the
    settlement of 27, which also took Thessaly and southern Epirus (see achaea).
    Brutus held it with Illyricum in 43–42 (Cic. Phil. 10.25–26; App. BC 4.75);
    after Philippi it was Antony's, east of Scodra from Brundisium (App. BC
    5.65), and Octavian's from 31. In 133–68 its governors fought the
    Scordisci and Thracians on the northern frontier again and again; the
    one gain of ground dated inside it is T. Didius' Chersonese c. 100, which
    the law of 101/100 joins to Macedonia (chersonesus-thracica). Mithridates'
    son overran it in 87; his army left it in 86.

- id: africa
  kind: province
  names:
    - { text: Africa, lang: la, preferred: true }
    - text: Africa Vetus
      lang: la
      from: 46 BCE
      to: 28 BCE
      note: >-
        Once Africa Nova is created beside it, until the two are one province,
        by 27 at the latest (see africa-nova).
  from: 146 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
    - { source: cassius-dio, locator: '48.21–23' }
    - { source: cassius-dio, locator: '49.14.6' }
  confidence: certain
  review: draft
  note: >-
    Held for the Republic by Cornificius in 43–42 and taken by T. Sextius, who
    handed both Africas to Fango for Octavian and took them back after Philippi
    (Dio 48.21–22); granted to Lepidus in 41, who came to take possession in 40
    (App. BC 5.12, 5.53; Dio 48.23.5) and held it until his fall in 36, when
    Statilius Taurus took "both the Africas without a struggle" (Dio 49.14.6).

- id: asia
  kind: province
  names:
    - { text: Asia, lang: la, preferred: true }
  from: 129 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
    - { source: magie-1950, locator: 'vol. I, 427–446' }
    - { source: cassius-dio, locator: '53.12.4' }
  confidence: certain
  review: draft
  note: >-
    The Liberators' in 43–42, Antony's from Philippi. Overrun by Labienus and
    the Parthians in 40, except the islands and Stratonicea (Dio 48.26.3–4),
    and cleared by Ventidius in 39; Stratonicea and Aphrodisias were made free.
    A consular province of the people in 27 (Dio 53.12.4).

- id: gallia-transalpina
  kind: province
  names:
    - { text: Gallia Transalpina, lang: la, preferred: true }
    - text: Gallia Narbonensis
      lang: la
      note: >-
        The later name (Pliny 3.31, "Bracata antea dicta"; Strabo 4.1.1). Dio uses
        it for 43 and 27 (46.50.4, 53.12.5), but in the names of his own day; when
        it became official is not known, so it is not the preferred name here.
  from: 121 BCE
  to: after 27 BCE
  sources:
    - { source: broughton-mrr }
    - { source: livy-per, locator: '60–61, 65–68, 73' }
    - { source: velleius, locator: '2.7.8, 2.10.2, 2.39.1' }
    - { source: strabo, locator: '4.1.5' }
    - { source: cicero-font, locator: '12, 16' }
    - { source: amela-valverde-2019, locator: '39' }
    - { source: ebel-1976 }
  confidence: probable
  review: needs-check
  note: >-
    Dated, by convention, from the victories of Domitius Ahenobarbus and Fabius
    Maximus over the Allobroges and the Arverni in 121 (Livy Per. 61; Vell.
    2.10.2, 2.39.1), after Fulvius Flaccus and Sextius Calvinus had beaten the
    Salluvii in 125–122 and founded Aquae Sextiae (Per. 60–61; Strabo 4.1.5);
    Narbo followed in 118 (Vell. 2.7.8). When it became a regular province is
    disputed: traditionally Domitius' work, now often put down to Marius in the
    Cimbric wars or to Pompey in the Sertorian (Amela Valverde 2019, 39), and
    Ebel (1976, not read) holds that the ground west of the Rhône was governed
    from Hither Spain until then. Lowered from certain in September 2026. The
    Cimbri and Teutones crossed it in 109–102 (Arausio, 105; Aquae Sextiae, 102)
    without holding it (Per. 65–68); the Salluvii rose in 90 (Per. 73); and in
    the 70s peoples of the Province fought Fonteius himself while Pompey's army
    wintered there (Cic. Font. 12, 16).

- id: cilicia
  kind: province
  names:
    - { text: Cilicia, lang: la, preferred: true }
  from: 80 BCE
  to: { earliest: 44 BCE, latest: 43 BCE }
  sources:
    - { source: cah-ix, locator: ch. 8 }
    - { source: broughton-mrr, locator: vol. II }
    - { source: cicero-phil, locator: '11.30' }
    - { source: magie-1950, locator: 'vol. II, 1270–1271' }
    - { source: borgia-2017, locator: 'p. 304' }
  confidence: probable
  review: draft
  note: >-
    Cicero's own province in 51–50, when it also carried Cyprus, Pamphylia,
    Pisidia, Lycaonia and three Phrygian dioceses detached from Asia. A
    provincia in this period is a portfolio, not a territory. It lapsed soon
    after Caesar's death: the senate's decree of 43 gives Cassius "Syria, Asia,
    Bithynia, Pontus" and leaves Cilicia out (Cic. Phil. 11.30); in 43 Side was
    the "extrema regio" of the quaestor of Asia (Cic. Fam. 12.15.5); and by 38
    Sosius governed "Syria and Cilicia" (Dio 49.22.2). So Syme and Magie (II
    1270–1271); Bickerman (1947) held that the plain joined Syria only after AD
    18, and Dio's "Cilicia" among Caesar's provinces in 27 (53.12.7) is read
    either way (Borgia 2017, 304). Its northern and western lands went to kings
    in 39–36.

- id: gallia-cisalpina
  kind: province
  names:
    - { text: Gallia Cisalpina, lang: la, preferred: true }
  from: c. 81 BCE
  to: 43 BCE
  sources:
    - { source: cah-ix }
  confidence: probable
  review: draft
  note: >-
    Formally dissolved into Italy in 42 (Dio 48.12.5), so the province ends in
    43 by the successor-takes-the-year rule. The lex Roscia of 49 enfranchised
    the Transpadanes but did not end the province: D. Brutus governed it in
    44–43. Its ground stays provincial to the end of the window.

- id: cyrenae
  kind: province
  names:
    - { text: Cyrenae, lang: la, preferred: true }
  from: c. 74 BCE
  to: 28 BCE
  sources:
    - { source: livy-per, locator: '70' }
    - { source: appian, locator: 'BC 1.111' }
    - { source: sallust-hist, locator: '2.43 M' }
  confidence: probable
  review: draft
  note: >-
    Bequeathed to Rome in 96, organised as a province c. 74. Given with Crete
    to Cassius (or Brutus) in 44 (App. BC 3.8), then Antony's. Promised to
    Cleopatra Selene in 34 (Dio 49.41.3; see cyrenaica-selene); Scarpus' army,
    which went over to Octavian after Actium, stood "in Africa" to guard Egypt
    (Dio 51.5.6). Kept apart from Crete until 27, when the joint province is
    first attested (see creta-cyrenae).

- id: creta
  kind: province
  names:
    - { text: Creta, lang: la, preferred: true }
  from: 66 BCE
  to: 28 BCE
  sources:
    - { source: velleius, locator: '2.38.6' }
    - { source: livy-per, locator: '100' }
    - { source: cassius-dio, locator: '36.17a–19' }
  confidence: probable
  review: draft
  note: >-
    Conquered by Q. Caecilius Metellus, 69–67. Probably administered with
    Cyrenae as a single command from soon after the conquest, but the date of
    the union is not settled, so it is kept as its own unit rather than
    asserting one. Brought over to Brutus by his officer Lepidus in 42 (App. BC
    5.2), then Antony's; an Antonian officer, Crassus, struck the same coins at
    Cnossus and at Cyrene (RPC I 914–917), which suggests one command. In 36
    Antony gave "parts of Crete" to Cleopatra's children (Dio 49.32.5); which
    parts is not known, so nothing is drawn. Cydonia and Lappa were freed after
    Actium (Dio 51.2.3).

- id: syria
  kind: province
  names:
    - { text: Syria, lang: la, preferred: true }
  from: 64 BCE
  to: after 27 BCE
  sources:
    - { source: appian, locator: 'Syr. 49, 70' }
    - { source: velleius, locator: '2.38.6' }
  confidence: certain
  review: draft
  note: >-
    Pompey's annexation; the end of the Seleucid kingdom. Cassius' in 43–42;
    then Antony's, governed by Saxa, Ventidius, Sosius and others. Overrun by
    the Parthians in 40, all but Tyre (Dio 48.26.1), and recovered in 39; the
    province went on. The Cilician plain was governed with it from 38 at the
    latest (Dio 49.22.2). Antony gave the Phoenician and Palestinian coast,
    less Tyre and Sidon, to Cleopatra in 37/36; Octavian took it back in 30.
    The promise of "Syria" to Ptolemy Philadelphus at the Donations of 34 (Dio
    49.41.3) was never carried out: Didius governed it in 31–30 (Dio 51.7).
    Caesar's in 27 (Dio 53.12.7).

- id: bithynia-pontus
  kind: province
  names:
    - { text: Bithynia, lang: la, preferred: true, from: 74 BCE, to: 64 BCE }
    - { text: Bithynia et Pontus, lang: la, preferred: true, from: 63 BCE, to: after 27 BCE }
  from: 74 BCE
  to: after 27 BCE
  sources:
    - { source: magie-1950, locator: 'vol. I, 433–436' }
    - { source: cassius-dio, locator: '53.12.4' }
    - { source: broughton-mrr, locator: vol. II }
  confidence: certain
  review: draft
  note: >-
    Bithynia, bequeathed by Nicomedes IV, from 74; joined with Pontus by
    Pompey's settlement (lex Pompeia) in 63. Bithynia and Pontus are separate
    atoms now, so the province can start with its bequest. From 39 Antony gave
    most of Pompey's Pontus to kings (Darius, then Polemon, and the kings of
    Paphlagonia), so that "only the provinces of Asia and Bithynia in the west
    and the district of Level Cilicia … were directly subject to the rule of
    Rome" (Magie I 436); what stayed provincial was the coast (the pontus atom).
    Antony gave the Greek part of Heraclea to the Galatian Adiatorix, who
    massacred its Roman colonists before Actium (Strabo 12.3.6). "Bithynia with
    Pontus which adjoined it" was the people's in 27 (Dio 53.12.4).

- id: gallia-comata
  kind: province
  names:
    - { text: Gallia Comata, lang: la, preferred: true }
  from: 51 BCE
  to: after 27 BCE
  sources:
    - { source: caesar-bg }
    - { source: cah-ix, locator: ch. 9 }
    - { source: goudineau-1990, locator: '161' }
  confidence: uncertain
  review: needs-check
  note: >-
    Conquered progressively 58–50 and held under Caesar's command, but not
    formally organised as a province until Augustus. Dated from 51, after Alesia
    and the final campaigns; the single date stands in for eight years of
    conquest and is the weakest claim in the dataset. Plancus', then Antony's,
    in 43; Antony's through Calenus to 40, then Octavian's (App. BC 4.2, 5.51).
    None of the fighting of 43–27 moved the ground: Agrippa against the Aquitani
    in 38 (App. BC 5.92), Nonius Gallus against the Treveri and Carrinas against
    the Morini in 30–29 (Dio 51.20.5, 51.21.6), Messalla against the Aquitani in
    28–27. Augustus took a census of the Gauls in 27 (Dio 53.22.5). Its division
    into Aquitania, Lugdunensis and Belgica is dated to 27 (Dio 53.12.5) or to
    16–13; Goudineau (1990) calls the question open, and the province is kept
    whole to 27.

- id: illyricum
  kind: province
  names:
    - { text: Illyricum, lang: la, preferred: true }
  from: 59 BCE
  to: after 27 BCE
  sources:
    - { source: suetonius-iul, locator: '22' }
    - { source: dzino-2010, locator: 'pp. 80–98' }
  confidence: probable
  review: draft
  note: >-
    Assigned to Caesar with Cisalpina by the lex Vatinia of 59; governed with
    it from Aquileia. Vatinius fought the Delmatae there in 45–44.

- id: africa-nova
  kind: province
  names:
    - { text: Africa Nova, lang: la, preferred: true }
  from: 46 BCE
  to: 28 BCE
  sources:
    - { source: bellum-africum, locator: '97' }
    - { source: fishwick-shaw-1977 }
    - { source: fishwick-1993, locator: '53' }
    - { source: fishwick-1994 }
  confidence: certain
  review: needs-check
  note: >-
    Numidia annexed after Thapsus. When it was joined to the old province is
    disputed. The traditional date is 27, with the division of the provinces;
    Fishwick and Shaw (1977) and Fishwick (1993, 1994) argue from the Fasti
    Triumphales that Africa was "already united under one governor by 35 B.C."
    Dio's "Africa, Numidia" in the list of 27 (53.12.4) is no evidence either
    way, since he says his list follows the provinces of his own day (53.12.8);
    his "the Africas" of 36 and 32 (49.14.6, 50.6.4) may be geography. The
    claims pass to africa at 27, the latest date; only the line between the two
    Africas is in doubt, not whose ground it was. The polity is kept to 28 to
    match. Juba II's "kingdom of his
    fathers" of 30 (Dio 51.15.6) is not drawn: he exchanged it in 25 for
    Mauretania, its people having "been enrolled in the Roman state" (53.26.2),
    and nothing shows he ruled Numidia in between.

# --- kingdoms ----------------------------------------------------------------
# Client status is a relation (relations.yaml); `kingdom` here also covers the principalities, tetrarchies
# and phylarchies of the Levant — anything ruled by a dynast.

- id: cyprus-ptolemaic
  kind: kingdom
  names:
    - { text: Cyprus, lang: la, preferred: true }
  from: 80 BCE
  to: 59 BCE
  ruler: Ptolemy of Cyprus, 80–58
  sources:
    - { source: cicero-sest, locator: '57' }
    - { source: strabo, locator: '14.6.6' }
    - { source: plutarch, locator: 'Cato Minor 34–36' }
    - { source: bennett-ptolemies, locator: 'Ptolemy of Cyprus' }
  confidence: certain
  review: draft
  note: >-
    Auletes' brother, made king of Cyprus when Auletes was made king of Egypt in
    80: the prologue to Trogus' book 40 has the division, and it is "universally
    and reasonably inferred" that both kingships began together (Bennett).
    Annexed in 58 by the lex Clodia and attached to Cilicia. Before 80 the
    island was the kingdom of Egypt's, except when a rival Ptolemy held it as a
    kingdom of its own (cyprus-ptolemaic-early).

- id: cyprus-ptolemaic-early
  kind: kingdom
  names:
    - { text: Cyprus, lang: la, preferred: true }
  from: { earliest: 114 BCE, latest: 113 BCE }
  to: 89 BCE
  ruler: Ptolemy X Alexander, 114/113–107; Ptolemy IX Soter II, 105–88
  sources:
    - { source: justin, locator: '39.4' }
    - { source: pausanias, locator: '1.9.1–2' }
    - { source: bennett-ptolemies, locator: 'Ptolemy IX; Ptolemy X' }
  confidence: probable
  review: needs-check
  note: >-
    Cyprus as the kingdom of whichever son of Ptolemy VIII was out of power in
    Alexandria. Ptolemy X, sent there "ostensibly as general" (Paus. 1.9.2),
    whether or not he held the command (Bennett doubts it), took the royal
    title in 114/113 and held it until his mother made him king in Egypt in 107; Ptolemy
    IX, driven from Alexandria to Cyprus in 107, was forced off the island by
    her troops (Justin 39.4) and took it back late in the summer of 105 (the
    Paphos inscription of his year 12, OGIS 166, and the end of Ptolemy X's
    Paphian coinage: Bennett, after Mitford and Mørkholm). He held it until the
    Alexandrians recalled him in 88. In 107–106 the island was the Egyptian
    crown's, and is claimed for aegyptus.

- id: numidia
  kind: kingdom
  names:
    - { text: Numidia, lang: la, preferred: true }
  from: before 133 BCE
  to: 47 BCE
  ruler: >-
    Micipsa, to 118; his heirs in dispute, 118–117; Adherbal (the eastern
    kingdom), 116–112; Jugurtha, 112–105; Gauda, 105–c. 88; Hiempsal II, c. 88–c. 50; Juba I, by 50–46
  sources:
    - { source: braund-1984 }
    - { source: bridoux-2020, locator: '¶122–157' }
    - { source: sallust-jug, locator: '5.4–7, 13, 16, 26–27' }
    - { source: livy-per, locator: '62, 64' }
    - { source: plutarch, locator: 'Pompey 12.4' }
  confidence: probable
  review: draft
  note: >-
    The Massylian kingdom of Masinissa's heirs, drawn as one polity from Micipsa
    to Juba I. Micipsa ruled from the Mulucha to the fossa regia (Bridoux ¶124;
    Sall. Jug. 110.8). On his death in 118 Jugurtha had Hiempsal I killed and
    drove Adherbal out (Livy Per. 62); the senate's commission under Opimius
    divided the kingdom, "the part of Numidia adjoining Mauretania, which was the
    more fertile and thickly populated" to Jugurtha and the part "having more
    harbours and … more buildings" to Adherbal (Sall. Jug. 16.5), dated 116 as
    usual (Bridoux puts it c. 117). This polity follows Adherbal's eastern
    kingdom, whose capital was Cirta; Jugurtha's western one is
    numidia-jugurtha. Jugurtha took Cirta and killed Adherbal in 112 (Jug. 26),
    and Rome went to war in 111 (Jug. 27; Per. 64). After his surrender in 105
    Gauda ruled all Numidia east of Bocchus' gains (Bridoux ¶144–145); on his
    death, c. 88, the kingdom was shared between his sons Hiempsal II, in the
    east, and Masteabar, in the west (numidia-masinissa). The Marian Hiarbas
    drove Hiempsal out and was killed by Pompey in 81, who gave his kingdom back
    to Hiempsal (Plut. Pompey 12.4; Bridoux ¶151–152); Hiarbas' reign, of a year
    or less, is not drawn. Juba I is attested king from 50; the usual "c. 60"
    for his accession "ne repose sur aucune donnée" (Bridoux ¶152). Annexed as
    Africa Nova after Thapsus, 46.

- id: numidia-jugurtha
  kind: kingdom
  names:
    - { text: Regnum Iugurthae, preferred: true }
  from: c. 116 BCE
  to: 113 BCE
  ruler: Jugurtha, 116–112
  sources:
    - { source: sallust-jug, locator: '16.5, 19.7, 20' }
    - { source: bridoux-2020, locator: '¶140–142 and pl. VII' }
  confidence: probable
  review: needs-check
  note: >-
    Jugurtha's share of the division of c. 116: the part of Numidia next to
    Mauretania (Sall. Jug. 16.5), whose western frontier was the Mulucha (Jug.
    19.7, 110.8). Where it met Adherbal's kingdom is unknown: "nous ne disposons
    d'aucun indice pour proposer une quelconque hypothèse" (Bridoux ¶141). From
    112 Jugurtha held the whole kingdom, which is numidia. The name is ours.

- id: mauretania
  kind: kingdom
  names:
    - { text: Mauretania, lang: la, preferred: true }
  from: before 133 BCE
  to: 34 BCE
  ruler: >-
    Bocchus I, by 118 to c. 81/80; Sosus (Mastanesosus), c. 80–49; Bocchus II,
    49–33
  sources:
    - { source: braund-1984 }
    - { source: sallust-jug, locator: '19.7, 80.4, 97.2, 110.8, 111.1' }
    - { source: bridoux-2020, locator: '¶73–97' }
    - { source: cassius-dio, locator: '48.45.1–3' }
    - { source: cassius-dio, locator: '49.43.7' }
    - { source: bridoux-2020, locator: '¶103' }
  confidence: probable
  review: needs-check
  note: >-
    The Moorish kingdom. Its kings between Baga (206) and Bocchus I are unknown,
    and Bocchus I, already king under Micipsa, was until the Jugurthine War
    "unknown to us before that time either in peace or in war" (Sall. Jug. 19.7).
    He asked Rome for a treaty early in the war and was refused (Jug. 80.4),
    joined Jugurtha for the promise of a third of Numidia (97.2), and in 105
    handed him over for "friendship, alliance, and the part of Numidia which he
    now desired" (111.1): the land from the Mulucha to about Cap Ténès (Bridoux
    ¶74–75, after Gsell). He reigned until 81 or 80; his successor was Sosus, the
    "Mastanesosus" of Cicero (Vat. 12, as Bridoux ¶89 reads it), who may have
    carried the kingdom east to the Soummam (¶97, ¶102, after Desanges).
    Ascalis, whom Sertorius besieged in Tingi in 81, was a local prince under the
    king, not a rival king (¶81–84); Sertorius "restored to them both property
    and cities and government" (Plut. Sertorius 9.5), so the episode is not
    drawn. Divided between two kings around 49; the kingdom is not in doubt, its
    internal arrangement is, hence probable. Bocchus II took Arabio's western
    Numidia in 41 (Bridoux ¶103, an inference: "se serait emparé") and Bogud's
    kingdom in 38 (Dio 48.45.1–3), and at his death in 33 his kingdom went to
    Rome (Dio 49.43.7; see mauretania-roman).

- id: aegyptus
  kind: kingdom
  names:
    - { text: Aegyptus, lang: la, preferred: true }
  from: before 133 BCE
  to: 31 BCE
  ruler: >-
    Ptolemy VIII, to 116; Cleopatra III with Ptolemy IX (116–107), then with
    Ptolemy X (107–101); Ptolemy X, 101–88; Ptolemy IX, 88–81; Berenice III and
    Ptolemy XI, 80; Ptolemy XII, 80–51 (in exile 58–55); Cleopatra VII (with
    Ptolemy XV Caesarion from 44), to 30
  sources:
    - { source: braund-1984 }
    - { source: cassius-dio, locator: '39.12.1' }
    - { source: caesar-bc, locator: '3.107' }
    - { source: suetonius-iul, locator: '54.3' }
    - { source: cassius-dio, locator: '51.19.6' }
    - { source: holbl-2001 }
    - { source: bennett-ptolemies, locator: 'Ptolemy VIII, IX, X and XII; Cleopatra II' }
  confidence: probable
  review: draft
  note: >-
    The Ptolemaic kingdom. Its dynastic wars are not drawn, since the ground
    stayed the one kingdom's: Cleopatra II's revolt against Ptolemy VIII
    (132/131–124, Alexandria hers 130–127), the Alexandrians' expulsions of
    Ptolemy IX (107) and Ptolemy X (88), and the Theban revolt Ptolemy IX put
    down c. 88–86 (Paus. 1.9.3). Cyrenaica was the crown's until 108 at least,
    and Cyprus except when a rival Ptolemy held it as a kingdom
    (cyprus-ptolemaic-early, cyprus-ptolemaic). Independent, a friend of Rome,
    until Ptolemy XII bought "the name of friend and ally" (Dio 39.12.1) in
    Caesar's consulship of 59 (Caes. BC 3.107; Suet. Iul. 54.3): "Ptolemy XII
    was not recognised as a Roman 'friend and ally' until early … 59" (Bennett).
    A client from 59; from 55 a Roman garrison sat in Alexandria. Antony's grants of 37/36 and the Donations of 34 added ground in Cyprus,
    Cilicia and the Levant (claims.yaml). Alexandria fell in August 30 (Macrob.
    Sat. 1.12.35; Dio 51.19.6) and the kingdom ends in 31; Egypt from 30 is aegyptus-province.

- id: nabataea
  kind: kingdom
  names:
    - { text: Nabataea, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Aretas III, then Malichus I, to 31; Obodas, from 30
  sources:
    - { source: sullivan-1990 }
    - { source: bowersock-1983 }
  confidence: probable
  review: needs-check
  note: >-
    The kingdom is not in doubt; its extent and its
    standing with Rome are — see the claim and the atom. Malichus turned Herod
    away in 40 "and used the name of the Parthians as a pretense" (BJ 1.274),
    and was fined by Ventidius in 39 (Dio 48.41.5). From 36/34 he paid tribute
    to Cleopatra for the "parts of Arabia" Antony gave her, with Herod as
    surety (AJ 15.106–107); that grant was revenue with no attested frontier and
    is not drawn. Herod fought him on Antony's orders in 32–31 (AJ 15.108–160),
    with no change of ground. In 30 "the Arabians about Petra" burned
    Cleopatra's ships (Dio 51.7.1). Obodas (II or III in modern numbering)
    followed Malichus c. 30 (Bowersock 1983).

- id: bosporus
  kind: kingdom
  names:
    - { text: Bosporus, lang: la, preferred: true }
  from: before 133 BCE
  to: after 27 BCE
  ruler: >-
    Paerisades V, the last Spartocid, to c. 108; Machares, son of Mithridates
    VI, c. 80–65; Pharnaces II, 63–47; Asander (archon, then king), from 47;
    Dynamis his wife
  sources:
    - { source: appian, locator: 'Mithr. 67, 83, 102, 113, 120' }
    - { source: strabo, locator: '7.4.4' }
    - { source: diophantus-decree }
  confidence: probable
  review: draft
  note: >-
    The Spartocid kingdom until Paerisades V gave it to Mithridates (Strabo
    7.4.4); the king's own ground from c. 108 to the revolt of the 80s, with no
    polity of its own (claims.yaml); a kingdom again under Machares, whom his
    father made king c. 80 and who killed himself when Mithridates came in 65
    (App. Mithr. 67, 102). Pharnaces II confirmed by Pompey in 63; killed after
    Zela. Started before 68 until the extension to 133 BCE.

- id: thracia-odrysae
  kind: kingdom
  names:
    - { text: Thracia, lang: la, preferred: true }
  from: before 133 BCE
  to: after 27 BCE
  ruler: >-
    Sadala, fl. c. 80; Cotys, fl. 57–55; Sadalas (d. by 43/42); the Sapaean
    brothers Rhascupolis and Rhascus, 42; Sadalas at Actium, 31
  sources:
    - { source: sullivan-1990 }
    - { source: cicero-verr, locator: '2.1.63' }
    - { source: cicero-pis, locator: '84' }
    - { source: cassius-dio, locator: '47.25.1–2' }
    - { source: appian, locator: 'BC 4.87' }
    - { source: cassius-dio, locator: '51.25.4–5' }
  confidence: probable
  review: needs-check
  note: >-
    The Thracian kings' authority over the inland tribes was intermittent
    throughout. The ruler string names only kings the ancient texts name for
    43–27: Brutus took over the land of Sadalas, "who had died childless and had
    left it to the Romans" (Dio 47.25.1), in 43/42 — not drawn, since the kings
    were back by Actium (Plut. Ant. 61.1); Rhascupolis and Rhascus were
    "ruling one country", the Sapaei and Corpili, at Philippi (App. BC 4.87).
    The modern king lists (Dessau, Sullivan; revised by Tačeva and Delev) are
    reconstructions and disputed. In 28 Crassus overran Thrace "except the
    territory of the Odrysae" and gave them Dionysus' land taken from the Bessi
    (Dio 51.25.4–5): a client, not annexed. Before 43 the ruler string adds only
    the two kings Cicero names: Sadala, to whom Verres was sent as legate c. 80
    (Verr. 2.1.63), and "king Cottus", for whom Piso killed the Bessian prince
    Rabocentus in 57–55 (Pis. 84). The kingdom was there in 133 (the Odrysian
    kings go back to the fifth century), hence the open start; its standing
    with Rome is drawn only from c. 80 (claims.yaml).

- id: galatia
  kind: kingdom
  names:
    - { text: Galatia, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Deiotarus, c. 63–40; Castor, 40–37/36; Amyntas, 36–25
  sources:
    - { source: cicero-deiotaro }
    - { source: cassius-dio, locator: '48.33.5' }
    - { source: cassius-dio, locator: '49.32.3' }
    - { source: strabo, locator: '12.5.1' }
    - { source: magie-1950, locator: 'vol. I, 433–434, 443' }
  confidence: probable
  review: draft
  note: >-
    Deiotarus confirmed by Pompey in 63. At his death in 40 his lands and
    Paphlagonia went to his grandson Castor (Dio 48.33.5; Magie I 433), and in
    37/36 to Amyntas, Antony's king in Pisidia since 39 (App. BC 5.75), who
    received Galatia "with Lycaonia and portions of Pamphylia" (Dio
    49.32.3). He went over to Octavian before Actium and was confirmed and
    enlarged with Cleopatra's Rough Cilicia (Dio 51.2.1; Strabo 14.5.6): his
    kingdom ran "from the mountains of northern Galatia to the shore of the
    Mediterranean" (Magie I 434) until his death in 25, when it became a
    province (Dio 53.26.3). The Pontic lands went to Darius in 39.

- id: cappadocia
  kind: kingdom
  names:
    - { text: Cappadocia, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Ariobarzanes III, 51–43/42; Ariarathes X, 43/42–36; Archelaus (Sisines), from 36
  sources:
    - { source: sullivan-1990 }
    - { source: cicero-fam, locator: XV }
    - { source: cassius-dio, locator: '49.32.3' }
    - { source: strabo, locator: '12.2.11' }
    - { source: luke-2025 }
  confidence: probable
  review: draft
  note: >-
    Cicero was charged with protecting Ariobarzanes during his Cilician
    command. Cassius' cavalry killed him — late 43 on Appian (BC 4.63), in 42
    on Dio (47.33.4) — and Ariarathes X followed. Antony judged between
    Ariarathes and "Sisina" in 41 and gave the kingdom to Sisina (App. BC 5.7),
    but only Ariarathes minted (Luke 2025); in 36 Antony gave Cappadocia to
    Archelaus "after driving out Ariarathes" (Dio 49.32.3). Most take Sisines
    and Archelaus to be one man (Magie I 435); Syme took them for two. Kept by
    Octavian (Dio 51.2.1).

- id: commagene
  kind: kingdom
  names:
    - { text: Commagene, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Antiochus I, c. 70–36 (or later); Mithridates II by 31
  sources:
    - { source: sullivan-1990 }
    - { source: facella-2006 }
    - { source: plutarch, locator: 'Antony 34' }
    - { source: cassius-dio, locator: '49.22.1–2' }
  confidence: probable
  review: draft
  note: >-
    Antiochus took in Parthian fugitives after Gindarus and was besieged at
    Samosata by Ventidius and Antony in 38; he made terms (Plut. Antony 34;
    Dio 49.22.1–2, where Antony got no money, against Plutarch's 300 talents).
    He had been fined in 39 for helping Pacorus (Dio 48.41.5). Kept a client
    throughout. Dio 49.23.4 has Phraates kill an Antiochus, grandfather of his
    brothers, c. 37–36; whether this is Antiochus I, and so when he died, is
    disputed. Mithridates II was king at Actium (Plut. Antony 61.1).

- id: judaea
  kind: kingdom
  names:
    - { text: Iudaea, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Hyrcanus II, 63–40; Herod, king from 40, in Jerusalem from 37
  sources:
    - { source: josephus-aj, locator: '14.54–79, 14.143' }
    - { source: josephus-bj, locator: '1.141–158, 1.199' }
    - { source: josephus-aj, locator: '14.381–385' }
    - { source: kokkinos-1998 }
  confidence: probable
  review: draft
  note: >-
    Pompey takes Jerusalem, 63; Antipater procurator from 47. Antony made Herod
    and Phasael tetrarchs under Hyrcanus in 41 (AJ 14.324–326). The Parthians
    carried off Hyrcanus in 40 and made Antigonus king (judaea-antigonus); the
    senate made Herod king the same year (AJ 14.381–385), and he took Jerusalem
    in 37. Cleopatra had Jericho and the coast from 36 (claims.yaml); in 30
    Octavian gave them back and added Samaria, Gadara, Hippos, Gaza, Anthedon,
    Joppa and Strato's Tower (AJ 15.217; BJ 1.396).

- id: ituraea
  kind: kingdom
  names:
    - { text: Ituraea, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Ptolemy son of Mennaeus, to 40; Lysanias, 40–36; Zenodorus (lessee), by 30
  sources:
    - { source: sullivan-1990 }
    - { source: myers-2010 }
    - { source: cassius-dio, locator: '49.32.5' }
  confidence: probable
  review: needs-check
  note: >-
    Lysanias succeeded his father Ptolemy in 40 and was Antigonus' go-between
    with the Parthians (AJ 14.330); Antony executed him in 36 "on the charge
    that he had favoured Pacorus" and gave much of the land to Cleopatra (Dio
    49.32.5). By 30 Zenodorus "had hired what was called the house of
    Lysanias" (AJ 15.344). Myers (2010) holds that only the southern Beqaa can
    be placed securely; the atom is wider.

- id: emesa
  kind: kingdom
  names:
    - { text: Emesa, lang: la, preferred: true }
  from: before 68 BCE
  to: 31 BCE
  ruler: Sampsiceramus I; Iamblichus I, by 51 to 31; Alexander, 31–30
  sources:
    - { source: sullivan-1990 }
    - { source: cassius-dio, locator: '50.13.7' }
    - { source: cassius-dio, locator: '51.2.2' }
  confidence: probable
  review: needs-check
  note: >-
    Cicero uses the name as a nickname for Pompey in the
    letters to Atticus. Strabo has "Arethusa, belonging to Sampsiceramus and
    Iamblichus his son" (16.2.10). Antony tortured Iamblichus to death before
    Actium (Dio 50.13.7), and his brother Alexander, who had the realm "as a
    reward for accusing" him, was deposed by Octavian and killed after the
    triumph (51.2.2; still a suppliant in 30, Josephus BJ 1.393). The kingdom
    was restored to Iamblichus II only in 20 (Dio 54.9.2).

- id: osroene
  kind: kingdom
  names:
    - { text: Osroene, lang: la, preferred: true }
  from: before 68 BCE
  to: after 27 BCE
  ruler: Abgar II, to 53; Ma'nu II, 52–34; Paqor, 34–29; Abgar III, from 29 (the Edessene list)
  sources:
    - { source: sullivan-1990 }
    - { source: segal-1970 }
  confidence: probable
  review: needs-check
  note: >-
    The kings of Edessa east of the Euphrates, "the boundaries of the Parthian
    empire" (Strabo 16.1.28). The rulers follow the Edessene king-list as
    Segal gives it, whose early dates he says are to be treated with caution.
    Its standing with Rome after the 60s is not known (see relations.yaml).

- id: amanus
  kind: kingdom
  names:
    - { text: Amanus, lang: la, preferred: true }
  from: before 68 BCE
  to: 31 BCE
  ruler: Tarcondimotus I, to 31; Philopator, 31
  sources:
    - { source: sullivan-1990 }
    - { source: strabo, locator: '14.5.18' }
    - { source: cassius-dio, locator: '51.2.2' }
    - { source: magie-1950, locator: 'vol. I, 434, 445' }
  confidence: probable
  review: needs-check
  note: >-
    Tarcondimotus' principality in the Amanus and on the middle Pyramus, seated
    at Hierapolis-Castabala. Not Cilicia Tracheia, which is the rough country
    west of the Cilician plain and was not his. Forced into Cassius' alliance in
    43 (Dio 47.26.2), "King and Friend of Antony" (Magie I 434), "king of Upper
    Cilicia" at Actium (Plut. Antony 61.1), where he fell (Dio 50.14.2). His son
    Philopator was deposed by Octavian (Dio 51.2.2), and "the kingship of this
    region was for a time suspended" (Magie I 445) until Tarcondimotus II was
    given it in 20 (Dio 54.9.2). Who held the ground in 30–20 is not known;
    Dmitriev suggests Amyntas, then Archelaus. It is left unclaimed.

