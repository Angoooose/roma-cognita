    king, not a rival king (¶81–84); Sertorius "restored to them both property
    and cities and government" (Plut. Sertorius 9.5), so the episode is not
    drawn. Divided between two kings around 49; the kingdom is not in doubt, its
    internal arrangement is, hence probable. Bocchus II took Arabio's western
    Numidia in 41 (Bridoux ¶103, an inference: "se serait emparé") and Bogud's
    kingdom in 38 (Dio 48.45.1–3), and at his death in 33 his kingdom went to
    Rome (Dio 49.43.7; see mauretania-roman).

