- id: chersonesus
  kind: city-state
  names:
    - { text: Chersonesus, lang: la, preferred: true }
  from: before 133 BCE
  to: after 27 BCE
  sources:
    - { source: strabo, locator: '7.4.2–3' }
    - { source: diophantus-decree }
  confidence: certain
  review: draft
  note: >-
    The Dorian city on the Heracleian peninsula, "at first self-governing"
    (Strabo 7.4.3). It kept its council, assembly and yearly eponym (the
    decree for Diophantus is dated by them) under Mithridates and the
    Bosporan kings, so the polity runs on; it holds its own ground only until
    it took the king as protector c. 110 (claims.yaml). Added for the extension
    to 133 BCE.

- id: mauretania-bogud
  kind: kingdom
  names:
    - { text: Mauretania Bogudiana, lang: la, preferred: true }
  from: 49 BCE
  to: 39 BCE
  ruler: Bogud, 49–38
  sources:
    - { source: pliny-nh, locator: '5.19' }
    - { source: bridoux-2020, locator: '¶99–100' }
    - { source: cassius-dio, locator: '41.42.7' }
    - { source: cassius-dio, locator: '48.45.1–3' }
    - { source: amela-valverde-2012, locator: '151–155' }
  confidence: probable
  review: draft
  note: >-
    The western kingdom, west of the Mulucha; Pliny's 'Bogudiana'. Named king with Bocchus II by Caesar's party in Rome in 49 (Dio 41.42.7);
    Bocchus took it in 38, while Bogud was campaigning for Antony in Spain, and
    Tingi's people were given citizenship (Dio 48.45.1–3). Freyburger and Roddaz date the Spanish raid to 41
    (as reported by Amela Valverde 2012, 152); Dio's 38 is followed.

- id: numidia-masinissa
  kind: kingdom
  names:
    - { text: Regnum Masteabaris, preferred: true, to: 82 BCE }
    - { text: Regnum Masinissae, preferred: true, from: 81 BCE, to: 45 BCE }
    - { text: Regnum Arabionis, preferred: true, from: 44 BCE }
  from: c. 88 BCE
  to: 42 BCE
  ruler: Masteabar, c. 88–82; Masinissa II, by 81–46; Arabio, 44–41
  sources:
    - { source: bridoux-2020, locator: '¶147–159 and pl. IX' }
    - { source: appian, locator: 'BC 4.54–56' }
    - { source: cassius-dio, locator: '48.22.4–6' }
  confidence: probable
  review: draft
  note: >-
    Western Numidia between the Soummam and the Ampsaga. On Gauda's death, "sans
    doute survenue en 88", his son Masteabar, king by a Greek inscription from
    Syracuse, held it beside his brother Hiempsal II; by 81 it was Masinissa II's
    (Bridoux ¶147–148), whom Bridoux takes as a vassal of the eastern kings
    (¶154–155, ¶161). Lost to Bocchus II and
    Sittius in 46 and recovered by Masinissa's son Arabio in 44. Arabio sided
    with T. Sextius in 43–42 (App. BC 4.54–56) and was driven out and then
    killed by him, "vraisemblablement en 41" (Dio 48.22.4–6; Bridoux ¶159). The
    names are ours; the sources call it by its king.

