- id: sertorius
  kind: command
  names:
    - { text: Sertorius, preferred: true }
    - { text: Q. Sertorius, lang: la }
  from: 80 BCE
  to: 72 BCE
  ruler: Q. Sertorius, 80–73 or 72; M. Perperna, to 72
  sources:
    - { source: plutarch, locator: 'Sertorius 7–27' }
    - { source: appian, locator: 'BC 1.108–115' }
    - { source: livy-per, locator: '90–96' }
    - { source: florus, locator: '2.10' }
    - { source: orosius, locator: '5.23' }
    - { source: broughton-mrr, locator: 'vol. II, 80–72 BCE' }
  confidence: certain
  review: draft
  note: >-
    Marius' and Cinna's man, sent to govern Spain in the civil war of 83–82
    (App. BC 1.108), he held the Pyrenees against Sulla's commander Annius in 81
    and lost them (Plut. Sert. 7). Invited back from Africa by the Lusitanians in 80 (Sert. 10–11), he beat
    the governors of both Spains and Metellus Pius, and ruled through a senate
    of exiles and Roman officers (Sert. 12–14, 22; App. BC 1.108). Perperna
    brought him Lepidus' army as Pompey crossed the Pyrenees (Sert. 15). Killed
    by Perperna at a banquet "during the eighth year of his command" (Livy Per.
    96, under 72; the year is 73 or 72); Pompey then beat Perperna and
    "recovered the Spanish provinces" in 72 (Per. 96; App. BC 1.115). A Roman
    commander, not a state: the provinces he held did not stop being provinces,
    so his ground is occupation (README decision 18). What he held is drawn
    from c. 77, when "all the peoples within the river Ebro" had come over to
    him (Sert. 16.1); in 80–78 he was in Lusitania and Further Spain, where
    Metellus held the Baetis throughout and the Lusitanians' own land is
    unclaimed, so no ground is drawn.

