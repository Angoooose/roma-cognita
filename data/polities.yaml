    - { source: livy-per, locator: '61' }
  confidence: certain
  review: draft
  note: >-
    Under their kings Luerius and Bituitus the Arverni "extended their dominion
    as far as Narbonne and the borders of Marseilles" and held sway to the
    Pyrenees, the Ocean and the Rhine (Strabo 4.2.3); that hegemony has no
    extent anyone can draw and is not claimed. Beaten by Domitius and Fabius in
    121, Bituitus was held at Alba (Livy Per. 61), but the Arverni were
    pardoned and neither made a province nor taxed (BG 1.45).

- id: vaccaei
  kind: people
  names:
    - { text: Vaccaei, lang: la, preferred: true }
  from: before 133 BCE
  to: c. 30 BCE
  sources:
    - { source: strabo, locator: '3.3–4' }
    - { source: curchin-1991 }
    - { source: cassius-dio, locator: '51.20.5' }
    - { source: plutarch, locator: 'Sertorius 21.5' }
    - { source: appian, locator: 'BC 1.112' }
  confidence: certain
  review: draft
  note: >-
    Dio, in his narrative of 29, has the Cantabri, Vaccaei and Astures subdued
    by Statilius Taurus, with no year (51.20.5). Only the Vaccaei stayed so: by
    26 they were the victims of Cantabrian raids, not enemies (Flor. 2.33.47;
    Oros. 6.21.3). Their ground passes to Hither Spain c. 29. Free before
    that: Pompey wintered among them in 75/74 (Plut. Sert. 21.5), and his
    siege of Pallantia failed (App. BC 1.112).

