  confidence: certain
  review: draft
  note: >-
    Mithridates V, a friend and ally of Rome who fought for it against
    Aristonicus and was given Greater Phrygia for it, was murdered at Sinope
    (Strabo 10.4.10); his son succeeded at eleven (Strabo) or thirteen (Memnon
    22.2) with his mother, whom he later imprisoned. The years c. 120 and c. 113
    for his accession and sole rule are modern reckonings; no ancient text
    gives them, though Appian's 57 years of reign (Mithr. 112) counted back
    from 63 give 120. In force in 133: Euergetes was a friend of Rome in the
    Third Punic War (App. Mithr. 10) and was rewarded after Aristonicus'
    capture (Justin 37.1). Ends in 63: Mithridates was alive after the
    consuls of 64 took office (Dio 37.10.1–11.1), and Pompey heard of his
    death on the march against Aristobulus, before taking Jerusalem in the
    consulship of Antonius and Cicero, 63 (Joseph. AJ 14.53, 14.66). He took Lesser Armenia and Colchis, the Bosporus by Parisades'
    gift, part of Paphlagonia with Nicomedes III, and Cappadocia for his son;
    overran Bithynia and Asia in 89–88 and gave them up at Dardanus in 85,
    keeping "his ancestral dominions" (App. Mithr. 55, 58). Lucullus took the
    kingdom in 72–70, and "by the end of 70 … Mithridates' kingdom was entirely
    in Lucullus's hands" (Kallet-Marx 303); he slipped back in 68, beat
    Triarius at Zela in 67, was driven out by Pompey in 66, fled by Colchis to
    the Bosporus, and died there in 63.

