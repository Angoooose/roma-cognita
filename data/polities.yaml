  note: >-
    After putting down the Thebaid in 29, Gallus marched beyond the First
    Cataract and set a ruler (tyrannus) over the Triacontaschoenus, the Nile
    valley from Syene to the Second Cataract, as a buffer between Egypt and
    Meroë (the Philae stele; Hoffmann, Minas-Nerpel and Pfeiffer's "vassal
    buffer zone"). By 25/24 Strabo calls Pselchis there "an Aethiopian city"
    (17.1.54), so the arrangement did not last. It rests on one inscription.
