- id: numidia
  kind: kingdom
  names:
    - { text: Numidia, lang: la, preferred: true }
  from: before 133 BCE
  to: 47 BCE
  ruler: >-
    Micipsa, to 118; his heirs in dispute, 118–117; Adherbal (the eastern
    kingdom), 116–112; Jugurtha, 112–105; Gauda, 105–c. 88; Hiempsal II, c. 88–c. 50; Juba I, by 50–46
  sources:
    - { source: braund-1984 }
    - { source: bridoux-2020, locator: '¶122–157' }
    - { source: sallust-jug, locator: '5.4–7, 13, 16, 26–27' }
    - { source: livy-per, locator: '62, 64' }
    - { source: plutarch, locator: 'Pompey 12.4' }
  confidence: probable
  review: draft
  note: >-
    The Massylian kingdom of Masinissa's heirs, drawn as one polity from Micipsa
    to Juba I. Micipsa ruled from the Mulucha to the fossa regia (Bridoux ¶124;
    Sall. Jug. 110.8). On his death in 118 Jugurtha had Hiempsal I killed and
    drove Adherbal out (Livy Per. 62); the senate's commission under Opimius
    divided the kingdom, "the part of Numidia adjoining Mauretania, which was the
    more fertile and thickly populated" to Jugurtha and the part "having more
    harbours and … more buildings" to Adherbal (Sall. Jug. 16.5), dated 116 as
    usual (Bridoux puts it c. 117). This polity follows Adherbal's eastern
    kingdom, whose capital was Cirta; Jugurtha's western one is
    numidia-jugurtha. Jugurtha took Cirta and killed Adherbal in 112 (Jug. 26),
    and Rome went to war in 111 (Jug. 27; Per. 64). After his surrender in 105
    Gauda ruled all Numidia east of Bocchus' gains (Bridoux ¶144–145); on his
    death, c. 88, the kingdom was shared between his sons Hiempsal II, in the
    east, and Masteabar, in the west (numidia-masinissa). The Marian Hiarbas
    drove Hiempsal out and was killed by Pompey in 81, who gave his kingdom back
    to Hiempsal (Plut. Pompey 12.4; Bridoux ¶151–152); Hiarbas' reign, of a year
    or less, is not drawn. Juba I is attested king from 50; the usual "c. 60"
    for his accession "ne repose sur aucune donnée" (Bridoux ¶152). Annexed as
    Africa Nova after Thapsus, 46.

