  review: draft
  note: >-
    Ariarathes V fell fighting Aristonicus in 130, and Rome gave his sons
    Lycaonia (Justin 37.1); their mother poisoned five of the six. Ariarathes
    VI was murdered through Gordius at Mithridates' prompting; Nicomedes III
    seized the kingdom with the widowed Laodice; Mithridates restored his
    nephew Ariarathes VII, killed him at a parley, and gave the throne to his
    own son of eight as Ariarathes IX under Gordius (Justin 38.1). The senate
    took Cappadocia from him and let the Cappadocians choose a king:
    Ariobarzanes (Justin 38.2; Strabo 12.2.11), whom Sulla put on the throne
    against Gordius (Plut. Sulla 5.3). He was driven out in 90 — by
    Mithridates' generals in Appian, by Tigranes in Justin, very likely the
    same event (Kallet-Marx 356–359) — and restored by Aquillius' embassy
    (App. Mithr. 10–11; Justin 38.3), overrun again in the war of 89–85 and restored by Curio
    after Dardanus (Mithr. 15, 60); Mithridates kept part of it after Murena's
    war until Sulla made him give it up, and Tigranes carried off its people
    to Tigranocerta in 78 or 77 (Mithr. 66–67; Strabo 12.2.9; Kallet-Marx
    295). The years of the kings before Ariobarzanes are modern reckonings;
    Sulla's mission is dated 96 (Badian, Kallet-Marx), 95/94 (Sherwin-White,
    who has Tigranes drive Ariobarzanes out first) or 92 (the older view)
    (McGing 1980, 37 n. 14). Cicero was charged
    with protecting Ariobarzanes III during his Cilician command. Cassius' cavalry killed him — late 43 on Appian (BC 4.63), in 42
    on Dio (47.33.4) — and Ariarathes X followed. Antony judged between
    Ariarathes and "Sisina" in 41 and gave the kingdom to Sisina (App. BC 5.7),
    but only Ariarathes minted (Luke 2025); in 36 Antony gave Cappadocia to
    Archelaus "after driving out Ariarathes" (Dio 49.32.3). Most take Sisines
    and Archelaus to be one man (Magie I 435); Syme took them for two. Kept by
    Octavian (Dio 51.2.1). Ariobarzanes I gave up the throne to his son in 62
    on Magie (I 390), in 64 at the earliest on Kallet-Marx (215, after
    Mattingly's spring 64); Ariobarzanes II was murdered "probably about 54"
    (Magie I 390) and certainly before Cicero met his son as king in September
    51 (Fam. 15.2). The ruler read "Ariobarzanes I, c. 96/95–c. 63/62;
    Ariobarzanes II, c. 63/62–52/51; Ariobarzanes III, 51–43/42" until October
    2026.

