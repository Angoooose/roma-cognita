- id: cilicia
  kind: province
  names:
    - { text: Cilicia, lang: la, preferred: true }
  from: 80 BCE
  to: after 43 BCE
  sources:
    - { source: cah-ix, locator: ch. 8 }
    - { source: broughton-mrr, locator: vol. II }
  confidence: probable
  review: draft
  note: >-
    Cicero's own province in 51–50, when it also carried Cyprus, Pamphylia,
    Pisidia, Lycaonia and three Phrygian dioceses detached from Asia. A
    provincia in this period is a portfolio, not a territory.

- id: gallia-cisalpina
  kind: province
  names:
    - { text: Gallia Cisalpina, lang: la, preferred: true }
  from: c. 81 BCE
  to: 43 BCE
  sources:
    - { source: cah-ix }
  confidence: probable
  review: draft
  note: >-
    Formally dissolved into Italy in 42, so the province ends in 43 by the
    successor-takes-the-year rule — but its ground became citizen territory in
    49 (lex Roscia), which is when the claim moves (claims.yaml). The province
    outlived its ground by six years; D. Brutus governed it in 44–43.

