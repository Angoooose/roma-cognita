# Where a readable source contradicts a record. Researchers log them here and
# leave the record as it is; the project's owner decides each one
# (research/README.md, "Disagreements").

- record: polities.yaml · sicilia; relations.yaml · sicilia province-of rome
  field: from
  says: 241 BCE
  suggests: 227 BCE
  source: solinus
  locator: '5.1'
  url: https://www.thelatinlibrary.com/solinus1.html
  quote: >-
    utraque insula in Romanum arbitratum redacta, iisdem temporibus facta est
    provincia: cum eodem anno Sardiniam M. Valerius, alteram C. Flaminius
  note: >-
    241 is the peace that gave Rome the Carthaginian part of the island
    (Broughton, MRR I 219: Lutatius "organizing the new territory in Sicily");
    Appian (Sic. 2) runs an annual praetor straight on from it. Solinus makes
    Sicily a province in the same year as Sardinia, with the praetors Broughton
    dates to 227 (MRR I 229: Flaminius "First Praetor in Sicily").
  found by: Claude (claude-opus-5-5), western provinces research
  status: open

- record: polities.yaml · sicilia; relations.yaml · sicilia province-of rome
  field: from
  says: 241 BCE
  suggests: 212/211 BCE
  source: velleius
  locator: '2.38.2'
  quote: >-
    Claudius the consul was the first to cross into Sicily with an army, but it
    was only after the capture of Syracuse, fifty years later, that it was
    converted into a province by Marcellus Claudius.
  note: >-
    Velleius dates the province from Marcellus' capture of Syracuse. The claim
    on the whole island already starts open at 133 for this reason
    (data/README.md decision 2).
  found by: Claude (claude-opus-5-5), western provinces research
  status: open

- record: polities.yaml · macedonia; relations.yaml · macedonia province-of rome
  field: from
  says: 146 BCE
  suggests: 167 BCE
  source: livy-per
  locator: '45'
  url: https://www.thelatinlibrary.com/livy/liv.per45.shtml
  quote: >-
    Macedonia in prouinciae formam redacta
  note: >-
    No readable text states 146. The epitome of Livy has Macedonia "reduced to
    the form of a province" after Pydna, under 167; Broughton has Metellus as
    praetor with Macedonia as his province in 148, when he "Recaptured
    Macedonia from the pretender Andriscus" (MRR I 461; Livy Per. 50). 146 is
    the end of Metellus' command and the year Achaea fell.
  found by: Claude (claude-opus-5-5), western provinces research
  status: open

- record: polities.yaml · gallia-transalpina; claims.yaml · atom gallia-transalpina · polity gallia-transalpina
  field: from
  says: 121 BCE
  suggests: later (Marius, 107–101, or Pompey, 77–71)
  source: amela-valverde-2019
  locator: '39'
  url: https://revistas.upsa.es/index.php/helmantica/article/download/468/359/1056
  quote: >-
    Tradicionalmente, la creación de la provincia de la Galia Transalpina se ha
    atribuido a la acción de Cn. Domicio Ahenobarbo … más bien fue obra de C.
    Mario
  note: >-
    Broughton has Domitius, proconsul in 120, organise the province (MRR I
    524), so the relation now reads 121–120; the polity's own note already
    calls the date disputed. Amela Valverde reports the current view that the
    regular province was Marius' work or Pompey's.
  found by: Claude (claude-opus-5-5), western provinces research
  status: open
